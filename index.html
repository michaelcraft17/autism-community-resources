  --brand:var(--harbor-600);--brand-hover:var(--harbor-700);--brand-active:var(--harbor-800);--brand-subtle:var(--harbor-50);--brand-on:var(--stone-0);--accent:var(--coral-500);--accent-hover:var(--coral-600);--accent-subtle:var(--coral-50);--accent-on:var(--stone-0);

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjIaR8sa936xf4hZzQ_-ObzpxCRsCWKIM&loading=async"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── Data (real coordinates from community_resources.json) ──── */
const RESOURCES = [
  { id:1, name:'UCLA Center for Autism Research and Treatment', type:'medical', address:'Westwood · Los Angeles, CA', phone:'(310) 825-9041', website:'https://www.semel.ucla.edu/autism', distance:2.4, services:['ABA Therapy','Research','Clinical Services','Treatment'], description:'Leading autism research and treatment center providing evidence-based interventions. One of the most comprehensive programs on the West Coast.', coordinates:{lat:34.0689,lng:-118.4452} },
  { id:2, name:'Easterseals — National Network', type:'therapy', address:'National · call for local services', phone:'1-800-757-3257', website:'https://www.easterseals.com', distance:1.2, services:['ABA Therapy','Social Activities','Career Skills','Family Support'], description:'National network providing therapy, social activities, and career skills programs for individuals with autism and disabilities.', coordinates:{lat:41.8781,lng:-87.6298} },
  { id:3, name:'Autistic Self Advocacy Network (ASAN)', type:'advocacy', address:'Washington, D.C. (national)', phone:'(202) 596-1056', website:'https://autisticadvocacy.org', distance:4.1, services:['Self-Advocacy','Policy','Community Programs'], description:'National nonprofit run by and for autistic individuals, centering autistic voices in advocacy and policy.', coordinates:{lat:38.9072,lng:-77.0369} },
  { id:4, name:'Pacific Autism Center for Education', type:'education', address:'Santa Clara, CA 95050', phone:'(408) 245-3400', website:'https://www.pacificautism.org', distance:6.8, services:['Special Education','Non-verbal Programs','Behavior Support'], description:'Non-public school for students with moderate to severe autism, with emphasis on non-verbal learners ages 6–22.', coordinates:{lat:37.3236,lng:-121.9797} },
  { id:5, name:'Autism Society of Los Angeles', type:'advocacy', address:'Torrance · Los Angeles, CA', phone:'(424) 299-1531', website:'https://www.autismla.org', distance:8.3, services:['Advocacy','Warm Line','Healthcare Navigation'], description:'Non-profit serving Los Angeles through advocacy, education, and community collaboration since 1964.', coordinates:{lat:33.8461,lng:-118.3531} },
  { id:6, name:'UCSF Benioff Autism & Neurodevelopmental Center', type:'medical', address:'Mission Bay · San Francisco, CA', phone:'(877) 822-4453', website:'https://www.ucsfbenioffchildrens.org', distance:12.6, services:['Diagnosis','Developmental Assessment','ADHD Treatment'], description:'Highly specialized care for patients with autism spectrum disorder and neurodevelopmental disorders at UCSF.', coordinates:{lat:37.7699,lng:-122.3925} },
];

const TYPE_META = {
  advocacy:        { label:'Advocacy',       bg:'var(--type-advocacy-bg)',  fg:'var(--type-advocacy-fg)',  thumb:'#c9e4e6' },
  therapy:         { label:'Therapy',        bg:'var(--type-therapy-bg)',   fg:'var(--type-therapy-fg)',   thumb:'#dfd8ee' },
  education:       { label:'Education',      bg:'var(--type-education-bg)', fg:'var(--type-education-fg)', thumb:'#cde3cf' },
  medical:         { label:'Medical',        bg:'var(--type-medical-bg)',   fg:'var(--type-medical-fg)',   thumb:'#f0cbc6' },
  social:          { label:'Social',         bg:'var(--type-social-bg)',    fg:'var(--type-social-fg)',    thumb:'#f5d5c8' },
  general_support: { label:'General Support',bg:'var(--type-general-bg)',   fg:'var(--type-general-fg)',   thumb:'#ddd8cf' },
};

/* ─── Full dataset (community_data.js) — loaded asynchronously so the
   page shell renders immediately instead of blocking on a multi-MB file. */
function shapeAll(raw) {
  return (Array.isArray(raw) && raw.length ? raw : RESOURCES).map((r,i) => ({
    id: i+1, name: r.name, type: r.type, address: r.address, phone: r.phone,
    website: r.website, services: r.services || [], description: r.description || '',
    coordinates: r.coordinates, suggested: r.suggested,
    facility_name: r.facility_name, entity_type: r.entity_type,
  })).filter(r => r.coordinates && r.coordinates.lat && r.coordinates.lng);
}

function useCommunityData() {
  const [all, setAll] = useState(null); // null = still loading
  useEffect(() => {
    if (window.communityData) { setAll(shapeAll(window.communityData)); return; }
    const s = document.createElement('script');
    s.src = 'community_data.js';
    s.onload = () => setAll(shapeAll(window.communityData));
    s.onerror = () => setAll(shapeAll(null)); // fall back to sample RESOURCES
    document.body.appendChild(s);
  }, []);
  return all;
}

function haversine(a, b){
  if (!a || !b) return null;
  const R = 3959; // miles
  const dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

async function geocode(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  const data = await res.json();
  if (data && data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  return null;
}

function normalizeAddress(addr) {
  return (addr || '').trim().toUpperCase().replace(/\s+/g, ' ');
}

/* ─── Accessibility prefs + favorites persistence (localStorage) ─── */
const A11Y_PREFS_KEY = 'a11y_prefs';
const A11Y_FAVS_KEY = 'a11y_favs';
const DEFAULT_PREFS = { colorScheme:'earthy', theme:'system', textSize:'default', typeface:'default', contrast:'default', motion:'system' };

function loadPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_PREFS_KEY));
    return raw && typeof raw === 'object' ? { ...DEFAULT_PREFS, ...raw } : { ...DEFAULT_PREFS };
  } catch { return { ...DEFAULT_PREFS }; }
}
function savePrefs(prefs) {
  try { localStorage.setItem(A11Y_PREFS_KEY, JSON.stringify(prefs)); } catch {}
}
function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_FAVS_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}
function saveFavs(favs) {
  try { localStorage.setItem(A11Y_FAVS_KEY, JSON.stringify(favs)); } catch {}
}
function clearAllStoredData() {
  try { localStorage.removeItem(A11Y_PREFS_KEY); localStorage.removeItem(A11Y_FAVS_KEY); } catch {}
}

const DIST_OPTIONS = [["Any distance",null],["Driving (25 mi.)",25],["Nearby (10 mi.)",10],["Close (5 mi.)",5],["Walking (2 mi.)",2]];

const SPECIALTIES = ['ABA / Behavioral Therapy','Child & Adolescent Psychiatry','Pediatric Neurology','Developmental-Behavioral Pediatrics','Neurodevelopmental Disabilities'];

/* ─── Icons ─────────────────────────────────────────────────── */
const PinIcon = ({s=15}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" strokeWidth="2"/></svg>;
const SearchIcon = ({s=18}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" strokeWidth="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const MoonIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></svg>;
const FontIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 20L10.5 6h3L18 20M7.5 15h9" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const SunIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" strokeWidth="2"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const SlidersIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h9M17 6h3M4 12h3M9 12h11M4 18h13M19 18h1" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><circle cx="14" cy="6" r="2" fill="currentColor"/><circle cx="7" cy="12" r="2" fill="currentColor"/><circle cx="16" cy="18" r="2" fill="currentColor"/></svg>;
const XIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const HeartIcon = ({f}) => <svg width="18" height="18" viewBox="0 0 24 24" fill={f?'var(--coral-500)':'none'}><path d="M12 20s-7-4.6-7-9.5A4.5 4.5 0 0112 7a4.5 4.5 0 017 3.5C19 15.4 12 20 12 20z" stroke={f?'var(--coral-500)':'var(--stone-400)'} strokeWidth="2" strokeLinejoin="round"/></svg>;
const ShareIcon = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3" stroke="currentColor" strokeWidth="2"/><circle cx="6" cy="12" r="3" stroke="currentColor" strokeWidth="2"/><circle cx="18" cy="19" r="3" stroke="currentColor" strokeWidth="2"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51L8.59 10.49" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;

/* ─── Logo ──────────────────────────────────────────────────── */
const Logo = ({onClick}) => (
  <button onClick={onClick} style={{background:'transparent',border:'none',padding:0,display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
    <svg width="32" height="32" viewBox="0 0 60 60" fill="none">
      <rect x="2" y="2" width="56" height="56" rx="14" fill="var(--harbor-600)"/>
      <path d="M30 16c-7.2 0-13 5.6-13 12.6 0 8.8 13 18.4 13 18.4s13-9.6 13-18.4C43 21.6 37.2 16 30 16z" fill="#fff"/>
      <circle cx="30" cy="28.4" r="5.4" fill="var(--coral-500)"/>
    </svg>
    <div style={{display:'flex',flexDirection:'column',lineHeight:1.1}}>
      <span style={{fontFamily:'var(--font-antonio)',fontWeight:700,fontSize:17,letterSpacing:'0.01em',color:'var(--text)'}}>ACCESSIBILITY</span>
      <span style={{fontFamily:'var(--font-antonio)',fontWeight:500,fontSize:13,letterSpacing:'0.08em',color:'var(--brand)'}}>MAPPER</span>
    </div>
  </button>
);

/* ─── TypePill ──────────────────────────────────────────────── */
const TypePill = ({type,small}) => {
  const t = TYPE_META[type] || TYPE_META.general_support;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:5,background:t.bg,color:t.fg,borderRadius:999,padding:small?'3px 9px':'4px 11px',fontSize:small?10:11,fontWeight:700,letterSpacing:'.05em',textTransform:'uppercase',whiteSpace:'nowrap'}}>
      <span style={{width:5,height:5,borderRadius:'50%',background:t.fg}}/>{t.label}
    </span>
  );
};

/* ─── Resource card — Yelp horizontal style ─────────────────── */
const ResourceCard = ({r, idx, fav, onFav, active, onHover}) => {
  const t = TYPE_META[r.type] || TYPE_META.general_support;
  return (
    <div
      onMouseEnter={()=>onHover(r.id)} onMouseLeave={()=>onHover(null)}
      style={{display:'flex',gap:0,background:active?'var(--brand-subtle)':'transparent',borderBottom:'1px solid var(--divider)',padding:'16px 6px',transition:'background var(--dur-fast) var(--ease-out)'}}>
      <div style={{position:'relative',width:140,flexShrink:0}}>
        <div style={{width:'100%',height:'100%',minHeight:130,borderRadius:10,overflow:'hidden',background:t.thumb,display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
          <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:.13}} viewBox="0 0 140 130" preserveAspectRatio="none">
            {[0,20,40,60,80,100,120,140].map(x=><line key={x} x1={x} y1="0" x2={x} y2="130" stroke={t.fg} strokeWidth="1"/>)}
            {[0,20,40,60,80,100,130].map(y=><line key={y} x1="0" y1={y} x2="140" y2={y} stroke={t.fg} strokeWidth="1"/>)}
          </svg>
          <svg width="36" height="44" viewBox="0 0 24 32" fill="none" style={{opacity:.5}}>
            <path d="M12 2C7.6 2 4 5.6 4 10c0 6.4 8 20 8 20s8-13.6 8-20C20 5.6 16.4 2 12 2z" fill={t.fg}/>
            <circle cx="12" cy="10" r="3.2" fill="#fff"/>
          </svg>
        </div>
        <div style={{position:'absolute',top:10,left:10,width:28,height:28,borderRadius:'50%',background:r.placeless?'var(--harbor-600)':'var(--coral-500)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-antonio)',fontWeight:700,fontSize:r.placeless?13:15,boxShadow:'0 2px 6px rgba(200,106,82,.4)'}}>
          {r.placeless ? '🌐' : idx+1}
        </div>
      </div>
      <div style={{flex:1,padding:'14px 16px 14px 18px',display:'flex',flexDirection:'column',gap:6,minWidth:0}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
          <div style={{minWidth:0}}>
            <h3 style={{margin:'0 0 5px',fontFamily:'var(--font-antonio)',fontWeight:700,fontSize:19,letterSpacing:'-0.01em',lineHeight:1.15,color:'var(--text)',textWrap:'balance'}}>{r.name}</h3>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <TypePill type={r.type} small/>
              <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:12,color:'var(--text-muted)'}}>
                <PinIcon s={12}/>{r.address}
              </span>
              {r.placeless
                ? <span style={{fontSize:11,fontWeight:700,color:'var(--info-fg)',background:'var(--info-bg)',padding:'2px 9px',borderRadius:999}}>Nationwide / Virtual</span>
                : (r.distance != null && <span style={{fontSize:12,fontWeight:600,color:'var(--success-fg)'}}>{r.distance.toFixed(1)} mi away</span>)}
            </div>
          </div>
          <div style={{display:'flex',gap:2,flexShrink:0}}>
            <button onClick={()=>onFav(r.id)} aria-label="Save" style={{width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
              <HeartIcon f={fav}/>
            </button>
            <button aria-label="Share" style={{width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
              <ShareIcon/>
            </button>
          </div>
        </div>
        {r.description && (
          <p style={{margin:0,fontSize:13,color:'var(--text-secondary)',lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>"{r.description}"</p>
        )}
        <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:2}}>
          {r.services.map((s,i)=>(
            <span key={i} style={{background:'var(--bg-sunken)',color:'var(--text-muted)',fontSize:11,fontWeight:500,padding:'3px 9px',borderRadius:6,border:'1px solid var(--border)'}}>{s}</span>
          ))}
        </div>

const MAP_STYLE = [
  { elementType:'geometry', stylers:[{color:'#f4f0e9'}] },
  { elementType:'labels.text.fill', stylers:[{color:'#7a6e5c'}] },
  { elementType:'labels.text.stroke', stylers:[{color:'#faf7f2'}] },
  { featureType:'water', elementType:'geometry', stylers:[{color:'#c9e4e6'}] },
  { featureType:'landscape.natural', elementType:'geometry', stylers:[{color:'#e6f0e2'}] },
  { featureType:'poi.park', elementType:'geometry', stylers:[{color:'#d9ead0'}] },
  { featureType:'road', elementType:'geometry', stylers:[{color:'#ffffff'}] },
  { featureType:'road.arterial', elementType:'geometry', stylers:[{color:'#f0ebe2'}] },
  { featureType:'road.highway', elementType:'geometry', stylers:[{color:'#eae3d8'}] },
  { featureType:'poi', elementType:'labels.icon', stylers:[{saturation:-60}] },
  { featureType:'transit', stylers:[{visibility:'simplified'}] },
];

// Teardrop pin: round badge on top, point at the bottom anchored to the exact location.
const PIN_PATH = 'M 0,0 L -4,-5 A 11,11 0 1,1 4,-5 Z';
function currentBrandColors() {
  const cs = getComputedStyle(document.body);
  return {
    brand: cs.getPropertyValue('--brand').trim() || '#175d69',
    accent: cs.getPropertyValue('--accent').trim() || '#e0846b',
  };
}
const pinSymbol = (act) => {
  const { brand, accent } = currentBrandColors();
  return {
  path: PIN_PATH,
  fillColor: act ? accent : brand,
  fillOpacity: 1,
  strokeColor: '#ffffff',
  strokeWeight: act ? 2.5 : 2,
  scale: act ? 1.25 : 1,
  anchor: new google.maps.Point(0, 0),
  labelOrigin: new google.maps.Point(0, -15),
  };
};
const youSymbol = { path: 0, fillColor: '#3a7ca5', fillOpacity: 1, strokeColor: '#ffffff', strokeWeight: 3, scale: 8 };
function boundsAround(center, miles){
  const dLat = miles/69;
  const dLng = miles/(69*Math.max(0.2, Math.cos(center.lat*Math.PI/180)));
  const b = new google.maps.LatLngBounds();
  b.extend({ lat: center.lat+dLat, lng: center.lng+dLng });
  b.extend({ lat: center.lat-dLat, lng: center.lng-dLng });
  return b;
}

/* ─── Map panel — real Google Map with numbered pins ────────── */
const MapPanel = ({groups, active, onHover, center, radiusMi, themeKey}) => {
  const elRef = useRef(null);
  const mapRef = useRef(null);
  const infoRef = useRef(null);
  const markersRef = useRef({});
  const userMarkerRef = useRef(null);
  const [ready, setReady] = useState(0);
  const showKey = groups.map(g=>g.map(r=>r.id).join('+')).join(',');
  const centerKey = center ? center.lat + ',' + center.lng : '';

  // init map (wait for Google Maps script to be ready)
  useEffect(() => {
    let cancelled = false;
    (function init(){
      if (cancelled || mapRef.current) return;
      if (!window.google || !window.google.maps) { setTimeout(init, 120); return; }
      mapRef.current = new google.maps.Map(elRef.current, {
        center: { lat: 37.8, lng: -110 }, zoom: 4,
        mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
        zoomControl: true, styles: MAP_STYLE, backgroundColor: '#c9e4e6',
        gestureHandling: 'greedy',
      });
      infoRef.current = new google.maps.InfoWindow();
      setReady(r => r + 1);
    })();
    return () => { cancelled = true; };
  }, []);

  // draw / refresh markers when the shown set changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.google) return;
    Object.values(markersRef.current).forEach(({marker}) => marker.setMap(null));
    markersRef.current = {};
    groups.forEach((g, i) => {
      const first = g[0];
      if (!first.coordinates || first.placeless) return;
      const num = i + 1;
      const groupKey = normalizeAddress(first.address);
      const ids = g.map(r => r.id);
      const isActive = ids.includes(active);
      const marker = new google.maps.Marker({
        position: first.coordinates, map,
        icon: pinSymbol(isActive),
        label: { text: String(num), color: '#ffffff', fontSize: '12px', fontWeight: '700', fontFamily: 'Hanken Grotesk, sans-serif' },
        title: g.length > 1 ? (g.length + ' providers at this address') : first.name,
        zIndex: isActive ? 999 : 1,
      });
      marker.addListener('click', () => {
        const header = g.length > 1
          ? '<strong style="font-size:14px;color:#175d69">' + (first.facility_name || (g.length + ' Resources at This Address')) + '</strong>' +
            '<div style="font-size:11px;color:#5c5345;margin:2px 0 6px">' + first.address + '</div>'
          : '<strong style="font-size:14px;color:#175d69">' + first.name + '</strong>' +
            '<div style="font-size:12px;color:#5c5345;margin:4px 0">' + first.address + '</div>';
        const rows = g.map(r =>
          '<div style="margin-top:6px">' +
          (g.length > 1 ? '<div style="font-weight:600;font-size:12px">' + r.name + '</div>' : '') +
          '<a href="tel:' + r.phone + '" style="font-size:12px;color:#175d69;font-weight:600">' + r.phone + '</a></div>'
        ).join('');
        infoRef.current.setContent('<div style="font-family:Hanken Grotesk,sans-serif;max-width:220px;line-height:1.4">' + header + rows + '</div>');
        infoRef.current.open(map, marker);
      });
      marker.addListener('mouseover', () => onHover(first.id));
      marker.addListener('mouseout', () => onHover(null));
      markersRef.current[groupKey + ':' + i] = { marker, ids };
    });

    // "You are here" marker for the searched location
    if (userMarkerRef.current) { userMarkerRef.current.setMap(null); userMarkerRef.current = null; }
    if (center) {
      userMarkerRef.current = new google.maps.Marker({ position: center, map, icon: youSymbol, title: 'Searched location', zIndex: 0 });
    }

    // Don't let fitBounds zoom in too far on a tight cluster of pins
    const capZoom = (max) => google.maps.event.addListenerOnce(map, 'idle', () => {
      if (map.getZoom() > max) map.setZoom(max);
    });

    // Focus the map tightly around the pins actually shown on this page
    const pts = groups.map(g => g[0]).filter(r => r.coordinates && !r.placeless);
    if (center && pts.length > 0) {
      // Fit the searched location + this page's pins (tighter than a fixed radius)
      const b = new google.maps.LatLngBounds();
      b.extend(center);
      pts.forEach(r => b.extend(r.coordinates));
      map.fitBounds(b, 56);
      capZoom(14);
    } else if (center) {
      // No located pins on this page — just center on the searched location
      const eff = radiusMi || 15;
      map.fitBounds(boundsAround(center, eff), 48);
    } else if (pts.length > 1) {
      const b = new google.maps.LatLngBounds();
      pts.forEach(r => b.extend(r.coordinates));
      map.fitBounds(b, 56);
      capZoom(14);
    } else if (pts.length === 1) {
      map.setCenter(pts[0].coordinates); map.setZoom(13);
    }
  }, [showKey, ready, centerKey, radiusMi, themeKey]);

  // highlight active marker without redrawing
  useEffect(() => {
    Object.values(markersRef.current).forEach(({marker, ids}) => {
      const isA = ids.includes(active);
      marker.setIcon(pinSymbol(isA));
      marker.setZIndex(isA ? 999 : 1);
    });
  }, [active]);

  return (
    <div style={{position:'relative',borderRadius:14,overflow:'hidden',height:'100%',minHeight:480,boxShadow:'0 1px 3px rgba(42,38,30,.1)',border:'1px solid var(--border)'}}>
      <div ref={elRef} style={{width:'100%',height:'100%',minHeight:480,background:'#c9e4e6'}}/>
    </div>
  );
};

/* ─── Reading aloud ──────────────────────────────────────────── */
function useReadAloud(readableList) {
  const [rate, setRate] = useState(1);
  const [voiceURI, setVoiceURI] = useState('');
  const [voices, setVoices] = useState([]);
  const [status, setStatus] = useState('idle'); // idle | playing | paused
  const listRef = useRef(readableList);
  listRef.current = readableList;

  useEffect(() => {
    if (!window.speechSynthesis) return;
    const load = () => setVoices(window.speechSynthesis.getVoices());
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
    return () => window.speechSynthesis.removeEventListener('voiceschanged', load);
  }, []);

  const stop = () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setStatus('idle');
  };

  useEffect(() => stop, [readableList]);

  const speakFrom = (i) => {
    const list = listRef.current;
    if (!window.speechSynthesis || i >= list.length) { setStatus('idle'); return; }
    const item = list[i];
    const u = new SpeechSynthesisUtterance(`${item.label}. ${item.type}. ${item.address}. ${item.description || ''}`);
    u.rate = rate;
    const v = voices.find(vv => vv.voiceURI === voiceURI);
    if (v) u.voice = v;
    u.onend = () => speakFrom(i + 1);
    window.speechSynthesis.speak(u);
  };

  const play = () => {
    if (!window.speechSynthesis || readableList.length === 0) return;
    if (status === 'paused') { window.speechSynthesis.resume(); setStatus('playing'); return; }
    window.speechSynthesis.cancel();
    setStatus('playing');
    speakFrom(0);
  };

  const pause = () => { if (window.speechSynthesis) { window.speechSynthesis.pause(); setStatus('paused'); } };

  return { play, pause, stop, status, rate, setRate, voices, voiceURI, setVoiceURI };
}

const AccessibilityPanel = ({open, onClose, prefs, setPrefs, favs, readableList, canReadAloud, onDeleteAllData}) => {

const PER_PAGE = 10;

/* ─── Pager ──────────────────────────────────────────────────── */
const Pager = ({page, totalPages, setPage}) => {
  const go = p => { setPage(Math.max(0, Math.min(totalPages - 1, p))); window.scrollTo({top:0,behavior:'smooth'}); };
  // Build a windowed list of page numbers with ellipses for large ranges
  const nums = [];
  const push = n => nums.push(n);
  const around = 1;
  for (let i = 0; i < totalPages; i++) {
    if (i === 0 || i === totalPages - 1 || (i >= page - around && i <= page + around)) push(i);
    else if (nums[nums.length - 1] !== '…') push('…');
  }
  const btn = (active, disabled) => ({
    minWidth:36, height:36, padding:'0 10px', borderRadius:8,
    border:'1px solid ' + (active ? 'var(--brand)' : 'var(--border)'),
    background: active ? 'var(--brand)' : 'var(--surface)',
    color: active ? '#fff' : (disabled ? 'var(--text-muted)' : 'var(--text-secondary)'),
    fontFamily:'var(--font-sans)', fontSize:14, fontWeight: active ? 700 : 500,
    cursor: disabled ? 'default' : 'pointer', opacity: disabled ? .5 : 1,
  });
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,flexWrap:'wrap',marginTop:28,paddingTop:20,borderTop:'1px solid var(--divider)'}}>
      <button onClick={()=>go(page-1)} disabled={page===0} style={btn(false, page===0)}>‹ Prev</button>
      {nums.map((n,i)=> n === '…'
        ? <span key={'e'+i} style={{padding:'0 4px',color:'var(--text-muted)'}}>…</span>
        : <button key={n} onClick={()=>go(n)} style={btn(n===page, false)}>{n+1}</button>
      )}
      <button onClick={()=>go(page+1)} disabled={page===totalPages-1} style={btn(false, page===totalPages-1)}>Next ›</button>
    </div>
  );
};

/* ─── Results ────────────────────────────────────────────────── */
const Results = ({ALL, coords, locLabel, keyword, setKeyword, favs, onFav, themeKey, onVisibleChange}) => {
  const [typeFilter, setTypeFilter] = useState('');
  const [specialty, setSpecialty] = useState('');
  const [radius, setRadius] = useState(null);
  const [activeId, setActiveId] = useState(null);
  const [page, setPage] = useState(0);
  const [selSug, setSelSug] = useState([]);
  const toggleSug = s => setSelSug(a => a.includes(s) ? a.filter(x=>x!==s) : [...a,s]);
  // Reset to first page whenever the result set changes
  useEffect(() => { setPage(0); }, [typeFilter, specialty, radius, keyword, coords, selSug]);

  const kw = keyword.trim().toLowerCase();
  const matchKwType = r =>
    (!kw
      || r.name.toLowerCase().includes(kw)
      || (r.services||[]).join(' ').toLowerCase().includes(kw)
      || (r.description||'').toLowerCase().includes(kw)
      || (TYPE_META[r.type] ? TYPE_META[r.type].label.toLowerCase().includes(kw) : false)) &&
    (!typeFilter || r.type === typeFilter) &&
    (!specialty || (r.services||[]).includes(specialty));

  const matchSug = r => {
    if (selSug.length === 0) return true;
    const svc = (r.services||[]).join(' ').toLowerCase();
    const sg = r.suggested || {};
    return selSug.every(s => {
      if (s === 'Individual Provider')         return r.entity_type === 'individual';
      if (s === 'Organization / Agency')       return r.entity_type === 'organization';
      if (s === 'Free / Sliding Scale')       return sg.free_services      || /free|sliding scale/.test(svc);
      if (s === 'Telehealth Available')        return sg.telehealth         || /telehealth|virtual|online therapy|video/.test(svc);
      if (s === 'In-home Services')            return sg.in_home            || /in-home|in home|home visit|home-based/.test(svc);
      if (s === 'Accepts Medicaid')            return sg.accepts_medicaid   || /medicaid|medi-cal/.test(svc);
      if (s === 'Early Intervention (0–5)') return sg.early_intervention || /early intervention|early start|0-5|infant|toddler|preschool/.test(svc);
      if (s === 'Bilingual Services')          return sg.bilingual          || /spanish|bilingual|multilingual|arabic|tagalog|mandarin|vietnamese/.test(svc);
      if (s === 'Wheelchair Accessible')       return sg.wheelchair_accessible || /wheelchair|magical bridge|ada accessible/.test(svc);
      return true;
    });
  };

  const loading = !ALL;

  // Located resources (mapped, distance-filtered) vs. placeless nationwide/virtual ones
  let local = loading ? [] : ALL.filter(r => !r.placeless).map(r => ({...r, distance: coords ? haversine(coords, r.coordinates) : null}));
  if (coords) local.sort((a,b)=>(a.distance ?? 1e9)-(b.distance ?? 1e9));
  const filtered = local.filter(r => matchKwType(r) && matchSug(r) && (radius == null || (r.distance != null && r.distance <= radius)));
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const safePage = Math.min(page, totalPages - 1);
  const start = safePage * PER_PAGE;
  const shown = filtered.slice(start, start + PER_PAGE);
  const national = loading ? [] : ALL.filter(r => r.placeless && matchKwType(r) && matchSug(r));
  const onLastPage = safePage >= totalPages - 1;

  // Multiple providers at the exact same address (e.g. several doctors inside
  // one medical center) collapse into a single card + a single map pin.
  const groupMap = new Map();
  const groups = [];
  shown.forEach(r => {
    const key = normalizeAddress(r.address);
    if (!groupMap.has(key)) { const arr = []; groupMap.set(key, arr); groups.push(arr); }
    groupMap.get(key).push(r);
  });
  const groupsKey = groups.map(g=>g.map(r=>r.id).join('+')).join(',');

  useEffect(() => {
    if (!onVisibleChange) return;
    onVisibleChange(groups.map(g => {
      const first = g[0];
      const t = TYPE_META[first.type] || TYPE_META.general_support;
      return {
        label: g.length > 1 ? (first.facility_name || `${g.length} resources at this address`) : first.name,
        type: t.label,
        address: first.address,
        description: g.length > 1 ? `${g.length} providers at this location` : (first.description || ''),
      };
    }));
  }, [groupsKey, onVisibleChange]);

  if (loading) {
    return (
      <div style={{maxWidth:2400,margin:'0 auto',padding:'96px 24px',textAlign:'center',color:'var(--text-muted)'}}>
        <div style={{fontSize:32,marginBottom:10}}>⏳</div>
        <div style={{fontFamily:'var(--font-antonio)',fontSize:20,fontWeight:700,color:'var(--text)'}}>LOADING DIRECTORY…</div>
        <div style={{fontSize:14,marginTop:6}}>Fetching the full resource list — just a moment.</div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:2400,margin:'0 auto',padding:'24px 1px 64px'}}>
      <div style={{fontSize:13,color:'var(--text-muted)',marginBottom:14,display:'flex',alignItems:'center',gap:6}}>
        <span style={{cursor:'pointer',color:'var(--text-link)'}}>Community Resources</span>
        <span>›</span>
        <span style={{cursor:'pointer',color:'var(--text-link)'}}>Autism &amp; Special Needs</span>
        <span>›</span>
        <span style={{color:'var(--text-muted)'}}>{locLabel}</span>
      </div>
      <div style={{marginBottom:20}}>
        <h2 style={{fontFamily:'var(--font-antonio)',fontWeight:700,fontSize:'clamp(20px,3vw,28px)',margin:'0 0 4px',letterSpacing:'.01em',color:'var(--text)'}}>
          {filtered.length} Resource{filtered.length!==1?'s':''}{radius!=null?` within ${radius} mi`:''} Near {locLabel}
        </h2>
        <div style={{fontSize:13,color:'var(--text-muted)'}}>
          {coords ? 'Sorted by distance' : 'Browse all'}
          {filtered.length > 0 ? ` · showing ${start + 1}–${start + shown.length} of ${filtered.length}` : ''}
          {` · ${ALL.length} total in directory`}
        </div>
      </div>
      <div style={{display:'flex',gap:10,alignItems:'flex-start',flexWrap:'wrap'}}>
        <Sidebar keyword={keyword} setKeyword={setKeyword} typeFilter={typeFilter} setTypeFilter={setTypeFilter} specialty={specialty} setSpecialty={setSpecialty} radius={radius} setRadius={setRadius} selSug={selSug} toggleSug={toggleSug}/>
        <div style={{flex:'1 1 460px',minWidth:320}}>
          {shown.length === 0 && national.length === 0 ? (
            <div style={{textAlign:'center',padding:'64px 0',color:'var(--text-muted)'}}>
              <div style={{fontSize:32,marginBottom:10}}>🔍</div>
              <div style={{fontFamily:'var(--font-antonio)',fontSize:20,fontWeight:700}}>NO RESULTS FOUND</div>
              <div style={{fontSize:14,marginTop:6}}>Try widening the distance or clearing filters</div>
            </div>
          ) : (
            <React.Fragment>
              {groups.map((g,i)=>(
                g.length > 1
                  ? <GroupedResourceCard key={'g'+g[0].id} group={g} idx={i} active={g.some(x=>x.id===activeId)} onHover={setActiveId}/>
                  : <ResourceCard key={g[0].id} r={g[0]} idx={i} fav={favs.includes(g[0].id)} onFav={onFav} active={activeId===g[0].id} onHover={setActiveId}/>
              ))}
              {totalPages > 1 && (
                <Pager page={safePage} totalPages={totalPages} setPage={setPage}/>
              )}
              {onLastPage && national.length > 0 && (
                <div style={{marginTop:24}}>
                  <h3 style={{fontFamily:'var(--font-antonio)',fontWeight:700,fontSize:14,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--text-secondary)',margin:'0 0 4px',borderTop:'1px solid var(--divider)',paddingTop:18}}>Available Nationwide &amp; Virtual</h3>
                  <p style={{fontSize:12,color:'var(--text-muted)',margin:'0 0 14px'}}>{national.length} service{national.length!==1?'s':''} you can reach from anywhere — no fixed location.</p>
                  {national.map((r,i)=>(
                    <ResourceCard key={r.id} r={r} idx={filtered.length+i} fav={favs.includes(r.id)} onFav={onFav} active={activeId===r.id} onHover={setActiveId}/>
                  ))}
                </div>
              )}
            </React.Fragment>
          )}
        </div>
        <div style={{flex:'1 1 440px',minWidth:340,marginLeft:0,position:'sticky',top:80,height:'calc(100vh - 48px)'}}>
          <MapPanel groups={groups} active={activeId} onHover={setActiveId} center={coords} radiusMi={radius} themeKey={themeKey}/>
        </div>
      </div>
    </div>
  );
};

/* ─── App ────────────────────────────────────────────────────── */
function App() {
  const ALL = useCommunityData();
  const [prefs, setPrefs] = useState(loadPrefs);
  const [systemDark, setSystemDark] = useState(() => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [a11yOpen, setA11yOpen] = useState(false);
  const [screen, setScreen] = useState('landing');
  const [coords, setCoords] = useState(null);
  const [locLabel, setLocLabel] = useState('');
  const [keyword, setKeyword] = useState('');
  const [favs, setFavs] = useState(loadFavs);
  const [readableList, setReadableList] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = e => setSystemDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange); };
  }, []);

  const isDark = prefs.theme === 'system' ? systemDark : prefs.theme === 'dark';

  useEffect(() => {
    const b = document.body.classList;
    b.toggle('dark', isDark);
    b.toggle('dyslexic', prefs.typeface === 'dyslexic');
    b.toggle('scheme-blue', prefs.colorScheme === 'blue');
    b.toggle('hc', prefs.contrast === 'high');
    b.toggle('reduce-motion', prefs.motion === 'reduce');
    b.toggle('text-small', prefs.textSize === 'small');
    b.toggle('text-large', prefs.textSize === 'large');
    b.toggle('text-largest', prefs.textSize === 'largest');
    savePrefs(prefs);
  }, [prefs, isDark]);

  useEffect(() => { saveFavs(favs); }, [favs]);

  const themeKey = `${prefs.colorScheme}-${isDark ? 'dark' : 'light'}`;

  const goLanding = () => { setScreen('landing'); setError(''); };

  const searchLocation = async (text) => {
    setBusy(true); setError('');
    try {
      const c = await geocode(text);
      if (!c) { setError('Couldn’t find that location. Try a city, ZIP code, or full address.'); setBusy(false); return; }
      setCoords(c); setLocLabel(text); setKeyword(''); setScreen('results');
    } catch (e) { setError('Search failed — please try again.'); }
    setBusy(false);
  };

  const useMyLocation = () => {
    if (!navigator.geolocation) { setError('Geolocation isn’t supported by your browser.'); return; }
    setBusy(true); setError('');
    navigator.geolocation.getCurrentPosition(
      pos => { setCoords({lat:pos.coords.latitude, lng:pos.coords.longitude}); setLocLabel('My Location'); setKeyword(''); setScreen('results'); setBusy(false); },
      err => { setError(err.code===1 ? 'Location permission denied — enter a location instead.' : 'Couldn’t get your location.'); setBusy(false); },
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  const toggleFav = id => setFavs(f => f.includes(id) ? f.filter(x=>x!==id) : [...f,id]);
  return (
    <div>
      <Header a11yOpen={a11yOpen} setA11yOpen={setA11yOpen} locLabel={locLabel} onLogoClick={goLanding} onSearchLocation={searchLocation} onUseMyLocation={useMyLocation} locBusy={busy} locError={error} showSearch={screen==='results'}/>
      <main>{screen==='landing' ? <Landing onSearch={searchLocation} onLocate={useMyLocation} busy={busy} error={error}/> : <Results ALL={ALL} coords={coords} locLabel={locLabel} keyword={keyword} setKeyword={setKeyword} favs={favs} onFav={toggleFav} themeKey={themeKey} onVisibleChange={setReadableList}/>}</main>
      <AccessibilityPanel
        open={a11yOpen}
        onClose={() => setA11yOpen(false)}
        prefs={prefs}
        setPrefs={setPrefs}
        favs={favs}
        readableList={readableList}
        canReadAloud={screen === 'results'}
        onDeleteAllData={() => { clearAllStoredData(); setPrefs({ ...DEFAULT_PREFS }); setFavs([]); }}
      />
      <footer style={{borderTop:'1px solid var(--border)',background:'var(--surface)',padding:'24px 24px',textAlign:'center',fontSize:12,color:'var(--text-muted)'}}>
        © 2026 Accessibility Mapper · Cal Poly Pomona Computer Science ·{' '}
        <a href="https://github.com/michaelcraft17/autism-community-resources" target="_blank" rel="noopener noreferrer" style={{color:'var(--text-link)',fontWeight:600}}>GitHub</a>
        {' '}·{' '}
        <a href="#donate-section" onClick={e=>{e.preventDefault();document.getElementById('donate-section')?.scrollIntoView({behavior:'smooth'});}} style={{color:'var(--coral-500)',fontWeight:600,cursor:'pointer'}}>Donate ♥</a>
        <span style={{display:'block',marginTop:4}}>Always verify information directly with service providers.</span>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
