/* ─── Accessibility menu (modeled on the UserWay menu used by stanfordnnea.com) ─── */
.a11y-panel{--surface:#fff;--surface-subtle:#f4f6fa;--text:#111;--text-secondary:#3d4452;--text-muted:#5b6474;--border:#d3d9e6;--border-strong:#aab3c5;--brand:#0048ff;--brand-hover:#0038cc;--brand-subtle:#e6ecff;--text-link:#0048ff;--border-focus:#0048ff;

.a11y-panel.big{width:min(520px,100vw);}

.a11y-panel.big .a11y-row{font-size:16px;}
.a11y-switch{width:46px;height:26px;border-radius:13px;border:0;background:#2f3a55;position:relative;padding:0;flex-shrink:0;}
.a11y-switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--dur-fast);}
.a11y-switch[aria-checked=true]{background:#0048ff;}
.a11y-switch[aria-checked=true]::after{transform:translateX(20px);}
.a11y-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.a11y-tile{background:#fff;border:2px solid transparent;border-radius:8px;min-height:114px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:13px;font-weight:700;color:#111;padding:10px 6px 16px;position:relative;text-align:center;line-height:1.25;}

/* ─── Mobile header nav + filter bar (<=640px): collapse the 4 header buttons into a

/* ─── Hero decorations + scroll reveal ──────────────────────────
   All motion here is gated two ways: (1) prefers-reduced-motion:no-preference below,
   so OS-level reduced-motion users never receive it, and (2) body.reduce-motion (the
   existing "Pause Animations" a11y toggle) via the universal !important override near
   the top of this stylesheet, which forces any animation/transition here to a single
   near-instant cycle that settles at its final frame. */
.hero-blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;border-radius:inherit;}
.hero-blob{position:absolute;border-radius:50%;filter:blur(60px);}
.hero-blob.b1{width:340px;height:340px;left:-90px;top:-100px;background:#3d9bf0;opacity:.18;}
.hero-blob.b2{width:300px;height:300px;right:-80px;top:20%;background:#1f6a5e;opacity:.16;}
.hero-blob.b3{width:260px;height:260px;left:18%;bottom:-120px;background:#f6a21e;opacity:.15;}
.hero-blob.b4{width:220px;height:220px;right:20%;bottom:-60px;background:#e5348b;opacity:.14;}
.hero-dots{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(circle,#1f6a5e 1.5px,transparent 1.5px);background-size:26px 26px;}
@media (prefers-reduced-motion:no-preference){
  .hero-blob.b1{animation:blobDrift1 26s ease-in-out infinite;}
  .hero-blob.b2{animation:blobDrift2 32s ease-in-out infinite;}
  .hero-blob.b3{animation:blobDrift3 24s ease-in-out infinite;}
  .hero-blob.b4{animation:blobDrift4 30s ease-in-out infinite;}
  .hero2-chip{transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease,color .15s ease;}
  .hero2-chip:hover,.hero2-chip:focus-visible{transform:translateY(-2px);box-shadow:0 4px 10px rgba(9,42,38,.14);}
}
@keyframes blobDrift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(36px,26px) scale(1.06);}}
@keyframes blobDrift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-34px) scale(1.05);}}
@keyframes blobDrift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(28px,-22px) scale(1.08);}}
@keyframes blobDrift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-22px,18px) scale(1.05);}}
.fade-up{opacity:1;transform:none;}
@media (prefers-reduced-motion:no-preference){
  .fade-up{opacity:0;transform:translateY(12px);transition:opacity .55s ease-out,transform .55s ease-out;}
  .fade-up.in-view{opacity:1;transform:translateY(0);}
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;
const CONTACT_EMAIL = 'changcheng875@gmail.com';

/* ─── Data (real coordinates from community_resources.json) ──── */
const RESOURCES = [
  { id:1, name:'UCLA Center for Autism Research and Treatment', type:'medical', address:'Westwood · Los Angeles, CA', phone:'(310) 825-9041', website:'https://www.semel.ucla.edu/autism', distance:2.4, services:['ABA Therapy','Research','Clinical Services','Treatment'], description:'Leading autism research and treatment center providing evidence-based interventions. One of the most comprehensive programs on the West Coast.', coordinates:{lat:34.0689,lng:-118.4452} },
  { id:2, name:'Easterseals — National Network', type:'therapy', address:'National · call for local services', phone:'1-800-757-3257', website:'https://www.easterseals.com', distance:1.2, services:['ABA Therapy','Social Activities','Career Skills','Family Support'], description:'National network providing therapy, social activities, and career skills programs for individuals with autism and disabilities.', coordinates:{lat:41.8781,lng:-87.6298} },
  { id:3, name:'Autistic Self Advocacy Network (ASAN)', type:'advocacy', address:'Washington, D.C. (national)', phone:'(202) 596-1056', website:'https://autisticadvocacy.org', distance:4.1, services:['Self-Advocacy','Policy','Community Programs'], description:'National nonprofit run by and for autistic individuals, centering autistic voices in advocacy and policy.', coordinates:{lat:38.9072,lng:-77.0369} },
  { id:4, name:'Pacific Autism Center for Education', type:'education', address:'Santa Clara, CA 95050', phone:'(408) 245-3400', website:'https://www.pacificautism.org', distance:6.8, services:['Special Education','Non-verbal Programs','Behavior Support'], description:'Non-public school for students with moderate to severe autism, with emphasis on non-verbal learners ages 6–22.', coordinates:{lat:37.3236,lng:-121.9797} },
  { id:5, name:'Autism Society of Los Angeles', type:'advocacy', address:'Torrance · Los Angeles, CA', phone:'(424) 299-1531', website:'https://www.autismla.org', distance:8.3, services:['Advocacy','Warm Line','Healthcare Navigation'], description:'Non-profit serving Los Angeles through advocacy, education, and community collaboration since 1964.', coordinates:{lat:33.8461,lng:-118.3531} },
  { id:6, name:'UCSF Benioff Autism & Neurodevelopmental Center', type:'medical', address:'Mission Bay · San Francisco, CA', phone:'(877) 822-4453', website:'https://www.ucsfbenioffchildrens.org', distance:12.6, services:['Diagnosis','Developmental Assessment','ADHD Treatment'], description:'Highly specialized care for patients with autism spectrum disorder and neurodevelopmental disorders at UCSF.', coordinates:{lat:37.7699,lng:-122.3925} },
];

const TYPE_META = {
  advocacy:        { label:'Advocacy',       bg:'var(--type-advocacy-bg)',  fg:'var(--type-advocacy-fg)' },
  therapy:         { label:'Therapy',        bg:'var(--type-therapy-bg)',   fg:'var(--type-therapy-fg)' },
  education:       { label:'Education',      bg:'var(--type-education-bg)', fg:'var(--type-education-fg)' },
  medical:         { label:'Medical',        bg:'var(--type-medical-bg)',   fg:'var(--type-medical-fg)' },
  social:          { label:'Social',         bg:'var(--type-social-bg)',    fg:'var(--type-social-fg)' },
  general_support: { label:'General Support',bg:'var(--type-general-bg)',   fg:'var(--type-general-fg)' },
};

/* ─── Full dataset (community_data.js) — loaded asynchronously so the
   page shell renders immediately instead of blocking on a multi-MB file. */
function shapeAll(raw) {
  return (Array.isArray(raw) && raw.length ? raw : RESOURCES).map((r,i) => ({
    id: i+1, name: r.name, type: r.type, address: r.address, phone: r.phone,
    website: r.website, services: r.services || [], description: r.description || '',
    coordinates: r.coordinates, suggested: r.suggested, placeless: r.placeless,
    facility_name: r.facility_name, entity_type: r.entity_type,
  })).filter(r => r.placeless || (r.coordinates && r.coordinates.lat && r.coordinates.lng));
}

function useCommunityData() {
  const [all, setAll] = useState(null); // null = still loading
  useEffect(() => {
    if (window.communityData) { setAll(shapeAll(window.communityData)); return; }
    const s = document.createElement('script');
    s.src = 'community_data.js';
    s.onload = () => setAll(shapeAll(window.communityData));
    s.onerror = () => setAll(shapeAll(null)); // fall back to sample RESOURCES
    document.body.appendChild(s);
  }, []);
  return all;
}

function haversine(a, b){
  if (!a || !b) return null;
  const R = 3959; // miles
  const dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

// A bare 5-digit (or ZIP+4) string is a US ZIP code in every real case this directory
// sees; Nominatim has no way to know that and happily matches the same digits against a
// postal code in another country (e.g. "95112" alone resolves to Klaipeda, Lithuania) --
// confirmed live during the mobile-redesign research session. Scoping to US only for
// this exact shape doesn't affect city/place-name search, which still covers every
// country per the note below.
const US_ZIP_RE = /^\d{5}(-\d{4})?$/;

async function geocode(q){
  // No countrycodes filter -- the directory now covers many countries, and hard-locking
  // this to "us" used to silently resolve e.g. "London" to a US town of the same name.
  const countryHint = US_ZIP_RE.test(q.trim()) ? '&countrycodes=us' : '';
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q) + countryHint;
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  const data = await res.json();
  if (data && data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  return null;
}

/* Formats a Nominatim result into a Google-Maps-style two-line suggestion:
   a bold primary name plus a lighter secondary line (region/country). */
function formatSuggestion(s) {
  const a = s.address || {};
  const main = a.city || a.town || a.village || a.county || a.state || (s.display_name || '').split(',')[0] || s.display_name;
  const rest = (s.display_name || '').split(',').map(p => p.trim()).filter(p => p && p !== main);
  const secondary = rest.slice(0, 2).join(', ');
  return { main, secondary };
}

/* Debounced, cancel-safe Nominatim autocomplete-as-you-type. Nominatim's public API asks for
   at most ~1 request/sec, so this waits 350ms of typing silence before firing, and only ever
   keeps the latest in-flight request's result. */
function useLocationSuggestions(query) {
  const [suggestions, setSuggestions] = useState([]);
  useEffect(() => {
    const q = query.trim();
    if (q.length < 2) { setSuggestions([]); return; }
    let cancelled = false;
    const t = setTimeout(async () => {
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=' + encodeURIComponent(q) + (US_ZIP_RE.test(q) ? '&countrycodes=us' : '');
        const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
        const data = await res.json();
        if (!cancelled) setSuggestions(data || []);
      } catch (e) {
        if (!cancelled) setSuggestions([]);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(t); };
  }, [query]);
  return suggestions;
}

/* Shared dropdown UI for both the landing-page and header search bars. Rendered through a
   portal straight onto <body> so it always sits on top of and outside of everything --
   the landing hero's ".lively-bg" section clips its own confetti with overflow:hidden,
   which was silently cutting the dropdown off before this. Position is computed from the
   anchor input's real on-screen rect, so it tracks wherever that input actually is. */
const SuggestDropdown = ({suggestions, activeIdx, setActiveIdx, onPick, anchorRef, dark}) => {
  const [rect, setRect] = useState(null);
  useEffect(() => {
    if (!suggestions.length || !anchorRef.current) { setRect(null); return; }
    const update = () => setRect(anchorRef.current.getBoundingClientRect());
    update();
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
  }, [suggestions.length, anchorRef]);

  if (!suggestions.length || !rect) return null;
  return ReactDOM.createPortal(
    <div style={{position:'fixed',top:rect.bottom+6,left:rect.left,width:rect.width,background:dark?'#2a261e':'#fff',border:'1px solid var(--border)',borderRadius:10,boxShadow:'0 8px 28px rgba(0,0,0,.18)',zIndex:9999,overflow:'hidden',textAlign:'left'}}>
      {suggestions.map((s,i) => {
        const {main, secondary} = formatSuggestion(s);
        return (
          <div key={s.place_id}
            onMouseDown={e=>{e.preventDefault();onPick(s);}}
            onMouseEnter={()=>setActiveIdx(i)}
            onMouseLeave={()=>setActiveIdx(-1)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',
              background: i===activeIdx ? (dark?'rgba(255,255,255,.14)':'#dce8fb') : 'transparent'}}>

const A11Y_PREFS_KEY = 'a11y_prefs';
const A11Y_FAVS_KEY = 'a11y_favs';
const DEFAULT_PREFS = {
  colorScheme:'earthy', theme:'system', textSize:'default', typeface:'default', contrast:'default', motion:'system',
  links:'default', spacing:'default', lineHeight:'default', textAlign:'default', saturation:'default',
  cursor:'default', hideImages:'default', tooltips:'default',
  oversized:false,
};

function loadPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_PREFS_KEY));
    const prefs = raw && typeof raw === 'object' ? { ...DEFAULT_PREFS, ...raw } : { ...DEFAULT_PREFS };
    if (prefs.cursor === 'white') prefs.cursor = 'black';          // white cursor was replaced by Reading Mask / Guide
    if (prefs.contrast === 'high') prefs.contrast = 'default';   // old "higher contrast" step no longer exists
    return prefs;
  } catch { return { ...DEFAULT_PREFS }; }
}
function savePrefs(prefs) {
  try { localStorage.setItem(A11Y_PREFS_KEY, JSON.stringify(prefs)); } catch {}
}
function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_FAVS_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}
function saveFavs(favs) {
  try { localStorage.setItem(A11Y_FAVS_KEY, JSON.stringify(favs)); } catch {}
}
function clearAllStoredData() {
  try { localStorage.removeItem(A11Y_PREFS_KEY); localStorage.removeItem(A11Y_FAVS_KEY); } catch {}
}

/* ─── Scroll-reveal + count-up hooks (respect reduceMotion: shows final state instantly) ─── */
function useRevealOnce(reduceMotion) {
  const ref = useRef(null);
  const [inView, setInView] = useState(!!reduceMotion);
  useEffect(() => {
    if (reduceMotion) { setInView(true); return; }
    if (inView || !ref.current || !window.IntersectionObserver) { if (!window.IntersectionObserver) setInView(true); return; }
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { setInView(true); obs.disconnect(); }
    }, {threshold:0.15});
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [reduceMotion, inView]);
  return [ref, inView];
}
function useCountUp(target, start, reduceMotion, duration=1200) {
  const [value, setValue] = useState(reduceMotion ? target : 0);
  useEffect(() => {
    if (!start) return;
    if (reduceMotion) { setValue(target); return; }
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [start, reduceMotion, target, duration]);
  return value;
}

/* Shares a resource via the Web Share API where available (mobile browsers, mainly);
   falls back to copying a plain-text summary to the clipboard, since there's no per-resource
   URL on this static site to share instead. Returns a status rather than a boolean so the
   caller can tell a real failure (blocked clipboard permission, confirmed in QA testing) apart
   from success and from the user simply dismissing the native share sheet. */
async function shareResource(r) {
  const text = [r.name, r.address, r.phone, r.website].filter(Boolean).join(' — ');
  if (navigator.share) {
    try { await navigator.share({ title: r.name, text, url: r.website || undefined }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); return 'copied'; }
    catch (e) {}
  }
  return 'failed';
}

// Hovering a pin on the map brings that result into view in the list. The map stays fixed on screen (see MapPanel), so pins
// never move under the cursor while the page scrolls.
function scrollCardIntoView(id) {
  const el = document.querySelector('[data-rid="' + id + '"]');
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.top >= 84 && r.bottom <= window.innerHeight - 8) return;   // already fully visible below the sticky header
  const reduce = document.body.classList.contains('reduce-motion') || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const target = Math.max(0, window.scrollY + r.top - Math.max(84, (window.innerHeight - r.height) / 2));
  const dist = Math.abs(target - window.scrollY);
  const ms = reduce ? 0 : Math.min(600, 320 + dist * 0.22);   // gentle ease-in-out; longer for longer jumps
  if (!ms) { window.scrollTo(0, target); return; }
  const from = window.scrollY, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / ms);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    window.scrollTo(0, from + (target - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function boundsAround(center, miles){
  const dLat = miles/69;
  const dLng = miles/(69*Math.max(0.2, Math.cos(center.lat*Math.PI/180)));
  const b = new google.maps.LatLngBounds();
  b.extend({ lat: center.lat+dLat, lng: center.lng+dLng });
  b.extend({ lat: center.lat-dLat, lng: center.lng-dLng });
  return b;
}

const MapPanel = ({groups, active, onHover, center, radiusMi, themeKey, contrast, mobileFull, sheetState, bottomInset = 0}) => {

  // must start so its natural position equals its pinned position; it only changes when the layout does, never on scroll.
  const [lift, setLift] = useState(0);

        position: first.coordinates,
        icon: pinSymbol(isActive),
        label: { text: String(num), color: isActive ? activeLabelColor() : pinLabelColor(contrastRef.current), fontSize: '13px', fontWeight: '700', fontFamily: 'Hanken Grotesk, sans-serif' },
        title: g.length > 1 ? (g.length + ' providers at this address') : first.name,
        zIndex: isActive ? 999 : 100 - i,   // lower list numbers sit on top when pins overlap
      });
      marker.__ids = ids; marker.__z = 100 - i;
      marker.addListener('click', () => {
        if (mobileFullRef.current) { onHover(first.id); return; }
        const header = g.length > 1
          ? '<strong style="font-size:14px;color:#111315">' + (first.facility_name || (g.length + ' Resources at This Address')) + '</strong>' +
            '<div style="font-size:11px;color:#33383b;margin:2px 0 6px">' + first.address + '</div>'
          : '<strong style="font-size:14px;color:#111315">' + first.name + '</strong>' +
            '<div style="font-size:12px;color:#33383b;margin:4px 0">' + first.address + '</div>';
        const rows = g.map(r =>
          '<div style="margin-top:6px">' +
          (g.length > 1 ? '<div style="font-weight:600;font-size:12px">' + r.name + '</div>' : '') +
          (r.phone ? '<a href="tel:' + r.phone + '" style="font-size:12px;color:#111315;font-weight:600;text-decoration:underline">' + r.phone + '</a>' : '') +
          '</div>'
        ).join('');
        infoRef.current.setContent('<div style="font-family:Hanken Grotesk,sans-serif;max-width:220px;line-height:1.4">' + header + rows + '</div>');
        infoRef.current.open(map, marker);
      });
      // Real touch has no hover, but the sandboxed/desktop-emulated browser used to test this
      // does fire real mouseover/mouseout on the map -- so on mobile, moving the pointer off a
      // just-tapped pin was calling onHover(null) and wiping the tapped selection straight back
      // to "1 of N" (confirmed in QA). Gate both to desktop only.
      marker.addListener('mouseover', () => {
        if (mobileFullRef.current) return;
        onHover(first.id); scrollCardIntoView(first.id);
        const pr = overlayRef.current && overlayRef.current.getProjection();
        const pt = pr && pr.fromLatLngToContainerPixel(marker.getPosition());
        if (pt) setTip({ x: pt.x, y: pt.y, g, num, hidden: hiddenTop() });
      });
      marker.addListener('mouseout', () => { if (mobileFullRef.current) return; onHover(null); setTip(null); });
      markersRef.current[groupKey + ':' + i] = { marker, ids };
      pinMarkers.push(marker);
    });
    // Nearby pins collapse into numbered bubbles (falls back to plain pins if the clusterer script didn't load)
    if (clustererRef.current) clustererRef.current.addMarkers(pinMarkers);
    else pinMarkers.forEach(m => m.setMap(map));

    // "You are here" marker for the searched location
    if (userMarkerRef.current) { userMarkerRef.current.setMap(null); userMarkerRef.current = null; }
    if (center) {
      userMarkerRef.current = new google.maps.Marker({ position: center, map, icon: youSymbol, title: 'Searched location', zIndex: 0 });
    }

    fitToPins();
  }, [showKey, ready, centerKey, radiusMi, themeKey]);

  // Re-skin the cluster bubbles (active = one of their pins is the hovered result)
  const styleClusters = (contrastVal) => {
    const c = clustererRef.current;
    if (!c || !c.clusters) return;
    c.clusters.forEach(cl => {
      if (!cl.marker || !cl.markers || cl.markers.length < 2) return;
      const isA = cl.markers.some(m => (m.__ids || []).includes(activeRef.current));
      cl.marker.setIcon(clusterSymbol(isA));
      cl.marker.setZIndex(isA ? 999 : 500 + cl.markers.length);
      const lb = cl.marker.getLabel();
      if (lb) cl.marker.setLabel({ ...lb, color: isA ? activeLabelColor() : pinLabelColor(contrastVal) });
    });
  };

  // Restyle live when the accessibility "Contrast +" mode changes. Kept separate from the marker effect
  // above so it never re-fits the map: the user's zoom/pan stays put.
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    map.setOptions({ styles: mapStyleFor(contrast), backgroundColor: mapBgFor(contrast) });
    // Wait one tick so App has updated the body classes / CSS variables that pinSymbol() reads.
    const id = setTimeout(() => {
      Object.values(markersRef.current).forEach(({marker, ids}) => {
        marker.setIcon(pinSymbol(ids.includes(activeRef.current)));
        const lb = marker.getLabel();
        if (lb) marker.setLabel({ ...lb, color: ids.includes(activeRef.current) ? activeLabelColor() : pinLabelColor(contrast) });
      });
      styleClusters(contrast);
    }, 0);
    return () => clearTimeout(id);
  }, [contrast, ready]);

  // highlight active marker without redrawing; on the mobile map-first layout, also pan to
  // it so keyboard/screen-reader users stepping through results via Previous/Next (which sets
  // `active` without ever touching the map) actually see the pin they're on. Also nudge the
  // zoom to the clusterer's own maxZoom (16, see algorithmOptions above) when needed, since
  // panning to a marker that's still inside a cluster bubble left the selected pin invisible.
  useEffect(() => {
    let panTarget = null;
    Object.values(markersRef.current).forEach(({marker, ids}) => {
      const isA = ids.includes(active);
      marker.setIcon(pinSymbol(isA));
      marker.setZIndex(isA ? 999 : (marker.__z || 1));
      const lb = marker.getLabel();
      if (lb) marker.setLabel({ ...lb, color: isA ? activeLabelColor() : pinLabelColor(contrastRef.current) });
      if (isA) panTarget = marker.getPosition();
    });
    if (panTarget && mobileFull && mapRef.current) {
      mapRef.current.panTo(panTarget);
      if (mapRef.current.getZoom() < 16) mapRef.current.setZoom(16);
    }
    styleClusters(contrastRef.current);
  }, [active, mobileFull]);

  if (mobileFull) {
    return (
      <div ref={rootRef} style={{position:'absolute',left:0,right:0,top:0,bottom:bottomInset}}>
        <div ref={elRef} style={{width:'100%',height:'100%',background:mapBgFor(contrast)}}/>
        {/* Not rendered at all (rather than just visually repositioned) while the sheet is
           fully expanded: it used to sit at zIndex 15, above the sheet's own 5, so it floated
           over the result list. In peek state it sits above the peek strip/preview card
           instead of at the very bottom, where it used to cover the handle and result count. */}
        {!hiddenInList && away && pinPts.length > 0 && (
          <button type="button" onClick={fitToPins} aria-label="Show all pins on the map" className="hbtn pc pc-cardinal"
            style={{position:'absolute',left:12,top:12,zIndex:8,height:40,padding:'0 16px',gap:8,fontSize:15,boxShadow:'0 2px 10px rgba(0,0,0,.28)'}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Show all pins
          </button>
        )}
      </div>
    );
  }

  return (
    <div ref={winRef} className="map-win" style={{flex:1,position:'relative',borderRadius:14}}>
      <div ref={rootRef} onMouseLeave={() => { onHover(null); setTip(null); }} style={{position:'sticky',top:76,marginTop:-lift,borderRadius:14,overflow:'hidden',height:'calc(100vh - 92px)',minHeight:480,boxShadow:'0 1px 3px rgba(42,38,30,.1)',border:'1px solid var(--border)'}}>
        <div ref={elRef} style={{width:'100%',height:'100%',minHeight:480,background:mapBgFor(contrast)}}/>
        {away && pinPts.length > 0 && (
          <button type="button" onClick={fitToPins} aria-label="Show all pins on the map" className="hbtn pc pc-cardinal"
            style={{position:'absolute',left:12,bottom:38,zIndex:15,height:40,padding:'0 16px',gap:8,fontSize:15,boxShadow:'0 2px 10px rgba(0,0,0,.28)'}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Show all pins
          </button>
        )}
        {tip && <PinTip tip={tip} center={center} width={elRef.current ? elRef.current.clientWidth : 400} minY={tip.hidden || 0}/>}
      </div>
    </div>
  );
};

/* ─── Filter bar (Yelp-style): search box, category pills, and dropdown chips ─── */
const CATEGORIES = ['Advocacy','Therapy','Education','Medical','Social'];
const SUGGESTED = ['Individual Provider','Organization / Agency','Free / Sliding Scale','Telehealth Available','In-home Services','Accepts Medicaid','Early Intervention (0–5)','Bilingual Services','Wheelchair Accessible'];
const Caret = () => <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;

const FilterChip = ({id, label, active, count, open, onToggle, tone, children}) => (
  <div style={{position:'relative'}} data-filter-chip>
    <button type="button" className={`fchip pc pc-${tone}${active?' on':''}`} aria-haspopup="true" aria-expanded={open} onClick={()=>onToggle(id)}>
      {label}{count > 0 && <span className="fcount">{count}</span>}<Caret/>
    </button>
    {open && <div className="fpop" role="group" aria-label={id}>{children}</div>}
  </div>
);

/* ─── Mobile "Filters" bottom sheet ──────────────────────────────
   Below 640px the 7 always-visible filter chips (5 categories + Distance + Specialty,
   plus the "More filters" chip) were pushing every result card below the fold on a phone
   — confirmed on a real 390px screenshot. They collapse into this single sheet, opened from
   a "Filters" button that carries an active-count badge (same .fcount style as the chips). */
const FilterSheet = ({open, onClose, typeFilter, setTypeFilter, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearSug, resultCount, keyword, setKeyword, keywordInSheet}) => {
  const dialogRef = useRef(null);
  const closeRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const t = setTimeout(() => closeRef.current && closeRef.current.focus(), 0);
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key === 'Tab' && dialogRef.current) {
        const f = dialogRef.current.querySelectorAll('button, input, a[href]');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); };
  }, [open]);

  if (!open) return null;
  // On a phone the keyword box lives in this sheet (it's hidden from the filter bar there), so
  // it's one of the filters "Clear all" resets.
  const clearAll = () => { setTypeFilter(''); setSpecialty(''); setRadius(null); clearSug(); if (keywordInSheet) setKeyword(''); };
  return ReactDOM.createPortal(
    <div style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
      <div onClick={onClose} aria-hidden="true" style={{position:'absolute',inset:0,background:'var(--overlay)'}}/>
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title" style={{position:'relative',background:'var(--surface)',borderRadius:'16px 16px 0 0',width:'100%',maxWidth:520,maxHeight:'85vh',overflowY:'auto',boxShadow:'0 -8px 32px rgba(0,0,0,.28)',padding:'18px 18px 16px'}}>
        {/* The result count changes here as filters are toggled, but the equivalent live
           region in FilterBar sits outside this dialog -- some screen readers don't announce
           updates from outside an aria-modal region while it's open, so this is a second copy
           scoped to the sheet itself, not just a style duplicate. */}
        <div aria-live="polite" className="sr-only">{resultCount} result{resultCount!==1?'s':''}</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h2 id="filter-sheet-title" style={{margin:0,fontSize:18,fontFamily:'var(--font-antonio)',color:'var(--text)'}}>Filters</h2>
          <button ref={closeRef} type="button" onClick={onClose} aria-label="Close filters" style={{width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}><XIcon/></button>
        </div>
        {keywordInSheet && (
          <div style={{marginBottom:20}}>
            <label htmlFor="fsheet-keyword" style={{display:'block',fontSize:13,fontWeight:700,color:'var(--text)',margin:'0 0 8px'}}>Name or service</label>
            <div className="fsearch" style={{display:'flex',alignItems:'center',gap:8,border:'1px solid var(--border-strong)',borderRadius:10,padding:'0 4px 0 12px',height:44,background:'var(--surface)'}}>
              <span aria-hidden="true" style={{color:'var(--brand)',display:'inline-flex',flexShrink:0}}><SearchIcon s={16}/></span>
              {/* 16px text so iOS doesn't zoom the page on focus; Enter closes the sheet to show the results. */}
              <input id="fsheet-keyword" value={keyword} onChange={e=>setKeyword(e.target.value)} onKeyDown={e=>{ if (e.key === 'Enter') { e.preventDefault(); onClose(); } }}
                placeholder="e.g. speech therapy, ABA, clinic name" autoComplete="off" enterKeyHint="search"
                style={{flex:1,minWidth:0,border:'none',outline:'none',background:'transparent',fontSize:16,color:'var(--text)',fontFamily:'var(--font-sans)'}}/>
              {keyword && <button type="button" onClick={()=>setKeyword('')} aria-label="Clear name or service search" style={{width:36,height:36,flexShrink:0,borderRadius:'50%',border:'none',background:'transparent',color:'var(--text-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><XIcon/></button>}
            </div>
          </div>
        )}
        <div role="group" aria-label="Type" style={{marginBottom:20}}>
          <h3 style={{fontSize:13,fontWeight:700,color:'var(--text)',margin:'0 0 8px'}}>Type</h3>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            <button type="button" className={`fchip pc pc-teal${!typeFilter?' on':''}`} aria-pressed={!typeFilter} onClick={()=>setTypeFilter('')}>All types</button>
            {CATEGORIES.map(c => {
              const v = c.toLowerCase();
              return <button key={c} type="button" className={`fchip pc pc-${v}${typeFilter===v?' on':''}`} aria-pressed={typeFilter===v} onClick={()=>setTypeFilter(typeFilter===v?'':v)}>{c}</button>;
            })}
          </div>
        </div>
        <fieldset className="fsheet-fieldset">
          <legend>Distance</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {DIST_OPTIONS.map(([d, mi]) => (
              <label key={d} className="fopt"><input type="radio" name="dist-sheet" checked={radius===mi} onChange={()=>setRadius(mi)}/>{d}</label>
            ))}
          </div>
        </fieldset>
        <fieldset className="fsheet-fieldset">
          <legend>Specialty</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {['', ...SPECIALTIES].map(sp => (
              <label key={sp || 'all'} className="fopt"><input type="radio" name="spec-sheet" checked={specialty===sp} onChange={()=>setSpecialty(sp)}/>{sp || 'All specialties'}</label>
            ))}
          </div>
        </fieldset>
        <fieldset className="fsheet-fieldset" style={{marginBottom:8}}>
          <legend>More filters</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {SUGGESTED.map(sg => (
              <label key={sg} className="fopt"><input type="checkbox" checked={selSug.includes(sg)} onChange={()=>toggleSug(sg)}/>{sg}</label>
            ))}
          </div>
        </fieldset>
        <div style={{display:'flex',gap:10,marginTop:14,position:'sticky',bottom:-16,background:'var(--surface)',paddingTop:12,paddingBottom:4,borderTop:'1px solid var(--divider)'}}>
          <button type="button" onClick={clearAll} style={{flex:'0 0 auto',height:44,padding:'0 18px',borderRadius:10,border:'1px solid var(--border-strong)',background:'var(--surface)',color:'var(--text)',fontSize:14,fontWeight:600,cursor:'pointer'}}>Clear all</button>
          <button type="button" onClick={onClose} className="hbtn pc pc-cardinal" style={{flex:1,justifyContent:'center',height:44,border:'none',fontSize:14,fontWeight:700}}>Show {resultCount} result{resultCount!==1?'s':''}</button>
        </div>
      </div>
    </div>,
    document.body
  );
};

function useDebounced(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
}

/* Removable chips summarizing every active structured filter (Baymard: showing applied
   filters up front, with a one-tap way to remove each, speeds up refinement and avoids the
   "what's even filtered right now?" confusion of chips that only live inside a closed sheet).
   Deliberately kept on both desktop and mobile (not gated to mobile): the individual filter
   pills above already show their own "on" state, but this row is the only one-tap way to drop
   a single filter without reopening a popover/sheet, which is worth it on both sizes -- see the
   commit message for this as an explicit decision, not an oversight.
   On desktop the keyword search box is NOT one of these chips and "Clear all" here does not
   touch it -- it's a separate, always-visible, always-editable field there, so a filter-focused
   "clear" acting on it too was surprising. On a phone (`keywordAsChip`) the box is hidden from
   the filter bar and lives inside the Filters sheet instead, so an active keyword gets its own
   chip here -- otherwise it would be an invisible filter -- and both "Clear all"s reset it. */
const ActiveFilterChips = ({typeFilter, setTypeFilter, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearAll, filtersBtnRef, keyword, setKeyword, keywordAsChip}) => {
  const containerRef = useRef(null);
  const [pendingFocus, setPendingFocus] = useState(null);
  const chips = [];
  const kwTrim = (keyword || '').trim();
  if (keywordAsChip && kwTrim) chips.push({ key:'kw', label:`“${kwTrim}”`, srLabel:`name or service “${kwTrim}”`, onRemove:()=>setKeyword('') });
  if (typeFilter) chips.push({ key:'type', label: TYPE_META[typeFilter] ? TYPE_META[typeFilter].label : typeFilter, onRemove:()=>setTypeFilter('') });
  if (radius != null) chips.push({ key:'radius', label:`Within ${radius} mi`, onRemove:()=>setRadius(null) });
  if (specialty) chips.push({ key:'specialty', label:specialty, onRemove:()=>setSpecialty('') });
  selSug.forEach(s => chips.push({ key:'sug-'+s, label:s, onRemove:()=>toggleSug(s) }));

  // Removing a chip used to drop focus to <body> (the button it lived on was simply gone).
  // This moves it to whichever chip's x now sits where the removed one was, or the previous
  // one, or the Filters button once none are left -- resolved after the remaining chips have
  // actually re-rendered, not by guessing which DOM node React will reuse.
  useEffect(() => {
    if (!pendingFocus) return;
    setPendingFocus(null);
    if (pendingFocus === 'filters') { filtersBtnRef && filtersBtnRef.current && filtersBtnRef.current.focus(); return; }
    const el = containerRef.current && containerRef.current.querySelector(`[data-chip-key="${pendingFocus}"] button`);
    if (el) el.focus();
    else if (filtersBtnRef && filtersBtnRef.current) filtersBtnRef.current.focus();
  }, [pendingFocus, chips.length]);

  if (!chips.length) return null;
  const removeChip = key => {
    const idx = chips.findIndex(c => c.key === key);
    const target = chips[idx + 1] || chips[idx - 1];
    setPendingFocus(target ? target.key : 'filters');
    chips[idx].onRemove();
  };
  return (
    <div ref={containerRef} style={keywordAsChip
        ? {display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,flex:'1 1 0',minWidth:0}
        : {display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,flexBasis:'100%',marginTop:2}}>
      {chips.map(c => (
        <span key={c.key} data-chip-key={c.key} className="afchip" style={{maxWidth:'100%'}}>
          <span style={{overflow:'hidden',textOverflow:'ellipsis',minWidth:0}}>{c.label}</span>
          <button type="button" onClick={()=>removeChip(c.key)} aria-label={`Remove filter: ${c.srLabel || c.label}`}><XIcon/></button>
        </span>
      ))}
      <button type="button" onClick={clearAll} style={{background:'transparent',border:'none',color:'var(--text)',textDecoration:'underline',fontSize:13,fontWeight:600,padding:'0 4px',cursor:'pointer'}}>Clear all</button>
    </div>
  );
};

const ListIcon = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;

// `compact` = the phone layout: the keyword box is hidden from this bar and moves into the
// Filters sheet (one search bar on screen -- the header's location field), so there it counts
// as an applied filter, gets a removable chip, and is reset by "Clear all".
const FilterBar = ({keyword, setKeyword, typeFilter, setTypeFilter, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearSug, summary, resultCount, compact}) => {
  const [openId, setOpenId] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const filtersBtnRef = useRef(null);
  const toggle = id => setOpenId(o => o === id ? null : id);
  const activeCount = (typeFilter?1:0) + (specialty?1:0) + (radius!=null?1:0) + selSug.length + (compact && keyword.trim() ? 1 : 0);
  const closeSheet = () => { setSheetOpen(false); filtersBtnRef.current && filtersBtnRef.current.focus(); };

  useEffect(() => {
    if (!openId) return;
    const onDown = e => { if (!e.target.closest || !e.target.closest('[data-filter-chip]')) setOpenId(null); };
    const onKey = e => { if (e.key === 'Escape') setOpenId(null); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [openId]);

  const distLabel = (DIST_OPTIONS.find(([, mi]) => mi === radius) || DIST_OPTIONS[0])[0];
  // Scoped to the structured filters only -- the keyword box is a separate, always-editable
  // field, not one of the removable chips, so this no longer also wipes it (see the note on
  // ActiveFilterChips for why that was surprising).
  const clearAll = () => { setTypeFilter(''); setSpecialty(''); setRadius(null); clearSug(); setOpenId(null); if (compact) setKeyword(''); };
  // Debounced so typing a keyword doesn't fire an announcement on every keystroke -- only once
  // the result count has actually settled for a moment.
  const announcedCount = useDebounced(resultCount, 500);

  return (
    <div className="fbar" role="search" aria-label="Filter resources">
      <div aria-live="polite" className="sr-only">{announcedCount} result{announcedCount!==1?'s':''}</div>
      <div className="fsearch" style={{display:'flex',alignItems:'center',gap:6,border:'1px solid var(--border-strong)',borderRadius:999,padding:'0 12px',height:34,background:'var(--surface)',width:210}}>
        <span style={{color:'var(--brand)',display:'inline-flex',flexShrink:0}}><SearchIcon s={14}/></span>
        <input value={keyword} onChange={e=>setKeyword(e.target.value)} placeholder="Name or service…" aria-label="Search by name or service" style={{flex:1,minWidth:0,border:'none',outline:'none',background:'transparent',fontSize:14,color:'var(--text)',fontFamily:'var(--font-sans)'}}/>
      </div>
      <span className="fbar-sep hide-mobile" aria-hidden="true"/>
      <div className="fbar-desktop-filters" style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8}}>
        <button type="button" className={`fchip pc pc-teal${!typeFilter?' on':''}`} aria-pressed={!typeFilter} onClick={()=>setTypeFilter('')}>All types</button>
        {CATEGORIES.map(c => {
          const v = c.toLowerCase();
          return <button key={c} type="button" className={`fchip pc pc-${v}${typeFilter===v?' on':''}`} aria-pressed={typeFilter===v} onClick={()=>setTypeFilter(typeFilter===v?'':v)}>{c}</button>;
        })}
        <span className="fbar-sep" aria-hidden="true"/>
        <FilterChip tone="blue" id="Distance" label={radius == null ? 'Distance' : distLabel} active={radius != null} open={openId==='Distance'} onToggle={toggle}>
          {DIST_OPTIONS.map(([d, mi]) => (
            <label key={d} className="fopt"><input type="radio" name="dist" checked={radius===mi} onChange={()=>{setRadius(mi); setOpenId(null);}}/>{d}</label>

/* ─── Saved panel — the resources a visitor has hearted (stored on this device only) ─── */
const SavedPanel = ({open, onClose, favs, ALL, coords, onFav}) => {
  const closeRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    closeRef.current && closeRef.current.focus();
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);
  const list = useMemo(() => {
    if (!open || !ALL || !favs.length) return [];
    const byId = new Map();
    const wanted = new Set(favs);
    ALL.forEach(r => { if (wanted.has(r.id)) byId.set(r.id, r); });
    return favs.slice().reverse().map(id => byId.get(id)).filter(Boolean);   // most recently saved first
  }, [open, ALL, favs]);

    <div role="dialog" aria-label="Saved resources" className="saved-panel">

        {favs.length > 0 && ALL && list.length === 0 && <div className="saved-empty">Your saved resources aren’t in the current directory.</div>}
        {list.map(r => {
          const t = TYPE_META[r.type] || TYPE_META.general_support;

/* ─── Suggest-a-resource modal — opens a prefilled GitHub issue, no backend needed
   for a static GitHub Pages site. Reviewed by hand via tools/import_github_issues.py. ─── */
const RESOURCE_TYPE_OPTIONS = Object.entries(TYPE_META).map(([value, meta]) => ({value, label: meta.label}));

function isLikelyUrl(v) {
  if (!v.trim()) return true;
  try { return new URL(/^https?:\/\//i.test(v) ? v : `https://${v}`).hostname.includes('.'); }
  catch { return false; }
}

function buildGithubIssueUrl(f) {
  const body = [
    `**Name:** ${f.name}`,
    `**Type:** ${TYPE_META[f.type] ? TYPE_META[f.type].label : f.type}`,
    `**Country:** ${f.country}`,
    f.address.trim() && `**Address/City:** ${f.address}`,
    f.website.trim() && `**Website:** ${f.website}`,
    f.phone.trim() && `**Phone:** ${f.phone}`,
    `**Description:** ${f.description}`,
    '_Submitted via the "Suggest a Resource" form on autismcommunityorg.org._',
  ].filter(Boolean).join('\n\n');
  const params = new URLSearchParams({ title: `Resource suggestion: ${f.name}`, body, labels: 'resource-suggestion' });
  return `https://github.com/michaelcraft17/autism-community-resources/issues/new?${params.toString()}`;
}

const SG_EMPTY = { name:'', website:'', phone:'', address:'', country:'', type:'advocacy', description:'' };

        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

    window.addEventListener('keydown', onKey);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); };

        <form onSubmit={handleSubmit} noValidate>

/* ─── Header mobile overflow menu ───────────────────────────────
   Below 640px the header's 4 buttons (Donate / Suggest a Resource / Saved / Accessibility)
   no longer fit in one row without clipping (confirmed on a real 390px viewport — "Saved"
   was cut mid-word and "Accessibility" pushed off-screen). Donate/Suggest/Saved collapse into
   this menu; Accessibility stays visible on its own since it's the site's core feature.
   Portaled to document.body (same pattern as SuggestDropdown) so it isn't affected by any
   ancestor's overflow, and positioned from the trigger button's own rect. */
const HeaderMobileMenu = ({open, onClose, anchorRef, onSuggest, savedOpen, savedCount, onToggleSaved, onDonate}) => {
  const [rect, setRect] = useState(null);
  const popRef = useRef(null);

  useEffect(() => {
    if (!open || !anchorRef.current) { setRect(null); return; }
    const update = () => setRect(anchorRef.current.getBoundingClientRect());
    update();
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
  }, [open, anchorRef]);

  useEffect(() => {
    if (!open) return;
    const t = setTimeout(() => { const first = popRef.current && popRef.current.querySelector('button, a[href]'); first && first.focus(); }, 0);
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); anchorRef.current && anchorRef.current.focus(); return; }
      if (e.key === 'Tab' && popRef.current) {
        const items = popRef.current.querySelectorAll('button, a[href]');
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    const onDown = e => { if (popRef.current && !popRef.current.contains(e.target) && anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    window.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onDown);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); document.removeEventListener('mousedown', onDown); };
  }, [open]);

  if (!open || !rect) return null;
  // Plain disclosure panel (ARIA APG "Disclosure"), not a role="menu" -- a real menu implies
  // arrow-key/Home/End navigation between items, which this never implemented; mislabeling it
  // as one gives assistive tech the wrong expectations. Tab-cycling, Escape, and returning
  // focus to the trigger (all still here) are everything the disclosure pattern requires.
  return ReactDOM.createPortal(
    <div ref={popRef} className="hdr-menu-pop" style={{top:rect.bottom+8, right:Math.max(8, window.innerWidth - rect.right)}}>
      <a href="#donate" onClick={e=>{e.preventDefault();onClose();onDonate();}}>
        <span aria-hidden="true" style={{color:'var(--cardinal-500)'}}>♥</span> Donate
      </a>
      <button type="button" onClick={()=>{onClose();onSuggest();}}><PlusCircleIcon s={16}/> Suggest a Resource</button>
      <button type="button" onClick={()=>{onClose();onToggleSaved();}} aria-pressed={savedOpen}>
        <HeartIcon f={savedCount>0 && !savedOpen}/> Saved{savedCount>0 && ` (${savedCount})`}
      </button>
    </div>,
    document.body
  );
};

          </button>

};

/* ─── Reading aloud ──────────────────────────────────────────── */
function useReadAloud(readableList) {
  const [rate, setRate] = useState(1);
  const [voiceURI, setVoiceURI] = useState('');
  const [voices, setVoices] = useState([]);
  const [status, setStatus] = useState('idle'); // idle | playing | paused
  const listRef = useRef(readableList);
  listRef.current = readableList;

  useEffect(() => {
    if (!window.speechSynthesis) return;
    const load = () => setVoices(window.speechSynthesis.getVoices());
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
    return () => window.speechSynthesis.removeEventListener('voiceschanged', load);
  }, []);

  const stop = () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setStatus('idle');
  };

  useEffect(() => stop, [readableList]);

  const speakFrom = (i) => {
    const list = listRef.current;
    if (!window.speechSynthesis || i >= list.length) { setStatus('idle'); return; }
    const item = list[i];
    const u = new SpeechSynthesisUtterance(`${item.label}. ${item.type}. ${item.address}. ${item.description || ''}`);
    u.rate = rate;
    const v = voices.find(vv => vv.voiceURI === voiceURI);
    if (v) u.voice = v;
    u.onend = () => speakFrom(i + 1);
    window.speechSynthesis.speak(u);
  };

  const play = () => {
    if (!window.speechSynthesis || readableList.length === 0) return;
    if (status === 'paused') { window.speechSynthesis.resume(); setStatus('playing'); return; }
    window.speechSynthesis.cancel();
    setStatus('playing');
    speakFrom(0);
  };

  const pause = () => { if (window.speechSynthesis) { window.speechSynthesis.pause(); setStatus('paused'); } };

  return { play, pause, stop, status, rate, setRate, voices, voiceURI, setVoiceURI };
}

// Per-step labels/icons (UserWay/NNEA behavior: a tile renames itself and swaps its icon on each click).
const monitorIcon = (screen) => tileSvg(<>{screen}<path d="M16 22v5M11 27h10"/></>);
// Crisp vector icons for the two "size" tiles (drawn as strokes, not font glyphs, so they look the same at every step).
// Bigger Text: a small and a large slab-serif "T" that both grow with each level.
const slabT = (x, top, w, h, sw) => {
  const tick = Math.min(2.4, h * 0.25);
  return <path strokeWidth={sw} strokeLinecap="butt" strokeLinejoin="miter"
    d={`M${x} ${top}h${w}M${x} ${top}v${tick}M${x+w} ${top}v${tick}M${x+w/2} ${top}v${h}M${x+w/2-w*0.2} ${top+h}h${w*0.4}`}/>;
};
const textSizeIcon = ([ws, hs, wb, hb]) => {
  const gap = 2, x0 = (32 - (ws + gap + wb)) / 2, base = 28;
  return tileSvg(<>{slabT(x0, base - hs, ws, hs, 1.9)}{slabT(x0 + ws + gap, base - hb, wb, hb, 2.2)}</>);
};
const TEXT_SIZE_LEVELS = [[6,8,12,16],[7.5,10,14.5,20],[9,12,16,22],[9.5,13,17,24]];
// Line Height: the double arrow always spans exactly the block of lines, so it stretches as the spacing grows.
const lineHeightIcon = (sp) => {
  const H = 3 * sp, top = 16 - H / 2, bot = 16 + H / 2;
  return tileSvg(<>
    <path strokeWidth="2.2" d={`M6 ${top-1}v${H+2}M6 ${top-1}l-3 3.5M6 ${top-1}l3 3.5M6 ${bot+1}l-3-3.5M6 ${bot+1}l3-3.5`}/>
    {[0,1,2,3].map(k => <path key={k} d={`M13 ${top + k*sp}h16`}/>)}

};

const ICONS_ON = {

    guide: tileSvg(<><rect x="4" y="6" width="24" height="20" rx="2"/><rect x="4" y="13" width="24" height="6" fill="currentColor"/></>),

  textAlign: {

const ResetIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3M3 4v5h5"/></svg>;

/* Reading Mask (dims everything except a band around the pointer) and Reading Guide (a line that follows the pointer). */
const ReadingAid = ({mode}) => {
  const topRef = useRef(null), botRef = useRef(null), guideRef = useRef(null);
  useEffect(() => {
    if (mode !== 'mask' && mode !== 'guide') return;
    const BAND = 120;
    const move = (x, y) => {
      if (mode === 'mask' && topRef.current) {
        topRef.current.style.height = Math.max(0, y - BAND/2) + 'px';
        botRef.current.style.top = (y + BAND/2) + 'px';
      } else if (guideRef.current) {
        guideRef.current.style.transform = `translate(${x - 256}px, ${y - 15}px)`;   // 512px bar centered on the pointer, just above it
      }
    };
    const onMouse = e => move(e.clientX, e.clientY);
    const onTouch = e => e.touches[0] && move(e.touches[0].clientX, e.touches[0].clientY);
    move(window.innerWidth / 2, window.innerHeight / 2);
    window.addEventListener('mousemove', onMouse, {passive:true});
    window.addEventListener('touchmove', onTouch, {passive:true});
    return () => { window.removeEventListener('mousemove', onMouse); window.removeEventListener('touchmove', onTouch); };
  }, [mode]);
  // Distinct keys make React build fresh elements when switching modes. Without them it recycles the mask's
  // <div> as the guide, which keeps the inline height the mask set on it (a giant black box).
  if (mode === 'mask') return <React.Fragment key="mask"><div ref={topRef} className="ra-mask" style={{top:0}} aria-hidden="true"/><div ref={botRef} className="ra-mask" style={{bottom:0}} aria-hidden="true"/></React.Fragment>;
  if (mode === 'guide') return <div key="guide" ref={guideRef} className="ra-guide" aria-hidden="true"/>;
  return null;
};

/* Tooltips feature: shows a label for whatever link/button/image is hovered or focused. */
function useTooltips(enabled) {
  useEffect(() => {
    if (!enabled) return;
    const tip = document.createElement('div');
    tip.className = 'a11y-tip';
    tip.setAttribute('aria-hidden', 'true');
    document.documentElement.appendChild(tip);
    const hide = () => { tip.style.display = 'none'; };
    const show = e => {
      const el = e.target.closest && e.target.closest('a,button,img,input,select,textarea,[role=button],[aria-label],[title]');
      if (!el || el.closest('.a11y-panel')) { hide(); return; }
      const text = (el.getAttribute('aria-label') || el.getAttribute('title') || el.getAttribute('alt') || el.getAttribute('placeholder') || el.textContent || '').trim().replace(/\s+/g, ' ');
      if (!text) { hide(); return; }
      tip.textContent = text.length > 160 ? text.slice(0, 157) + '…' : text;
      tip.style.display = 'block';
      const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
      const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
      const top = r.bottom + 8 + t.height > window.innerHeight ? Math.max(8, r.top - t.height - 8) : r.bottom + 8;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    };
    document.addEventListener('mouseover', show);
    document.addEventListener('focusin', show);
    document.addEventListener('mouseout', hide);
    document.addEventListener('focusout', hide);
    return () => {
      document.removeEventListener('mouseover', show); document.removeEventListener('focusin', show);
      document.removeEventListener('mouseout', hide); document.removeEventListener('focusout', hide);
      tip.remove();
    };
  }, [enabled]);
}

const AccessibilityPanel = ({open, onClose, prefs, setPrefs, favs, readableList, canReadAloud, onDeleteAllData}) => {
  const ra = useReadAloud(canReadAloud ? readableList : []);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const closeRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const opener = document.activeElement;
    closeRef.current && closeRef.current.focus();
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('keydown', onKey);
      if (opener && opener.focus && document.contains(opener)) opener.focus();
    };
  }, [open, onClose]);

  useEffect(() => { if (!open) { setConfirmDelete(false); } }, [open]);

  const set = (k, v) => setPrefs(p => ({ ...p, [k]: v }));

  const cycle = ({key, steps}) => setPrefs(p => {
    const i = steps.indexOf(p[key]);            // -1 = off (or an older stored value)
    return { ...p, [key]: i + 1 < steps.length ? steps[i + 1] : tileOff(key) };
  });

  const resetAll = () => setPrefs({ ...DEFAULT_PREFS });

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ preferences: prefs, favorites: favs }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'accessibility-mapper-data.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    <div role="dialog" aria-label="Accessibility Menu" className={`a11y-panel${prefs.oversized?' big':''}`}>

        </div>

        <div className="a11y-grid">
          {A11Y_TILES.map(t => {
            const val = prefs[t.key];
            const i = t.steps.indexOf(val);
            const on = i >= 0;
            const label = (on && LABELS_ON[t.key] && LABELS_ON[t.key][val]) || t.label;
            const icon = (on && ICONS_ON[t.key] && ICONS_ON[t.key][val]) || ICON_OFF_OVERRIDES[t.key] || TILE_ICONS[t.key];
            const tone = on && TONES_ON[t.key] && TONES_ON[t.key][val];
            return (
              <button key={t.key} type="button" className="a11y-tile" aria-pressed={on} style={tone ? {'--tc': tone} : undefined}
                aria-label={t.steps.length > 1 ? `${label}${on ? `, step ${i+1} of ${t.steps.length}` : ', off'}` : label}
                onClick={()=>cycle(t)}>
                {icon}
                <span>{label}</span>
                {on && t.steps.length > 1 && <span className="a11y-steps" aria-hidden="true">{t.steps.map((_, n) => <i key={n} className={n <= i ? 'on' : ''}/>)}</span>}
              </button>

        </div>

        <button type="button" className="a11y-wide" onClick={resetAll}><ResetIcon/> Reset All Accessibility Settings</button>

        <div className="a11y-more">More settings</div>

        <A11ySection title="Color scheme">
          <div style={{display:'flex',gap:10}}>
            {[['earthy','Cardinal & Teal','#1f6a5e','#b4232a'],['blue','Blue & yellow','#1c5490','#f59e0b']].map(([key,label,c1,c2])=>(
              <button key={key} onClick={()=>set('colorScheme',key)} aria-pressed={prefs.colorScheme===key}
                style={{flex:1,padding:'10px 8px',borderRadius:10,border:`2px solid ${prefs.colorScheme===key?'var(--brand)':'var(--border)'}`,background:prefs.colorScheme===key?'var(--brand-subtle)':'var(--surface)',cursor:'pointer',textAlign:'left'}}>

};

/* Horizontally scrolling row of cards with prev/next buttons (mouse wheel, trackpad swipe, and
   keyboard scrolling all work natively too since the track is a focusable, overflow:auto element). */
const ScrollRow = ({children}) => {
  const trackRef = useRef(null);
  const scrollBy = dir => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector('.scroll-card');
    const step = (card ? card.getBoundingClientRect().width : 260) + 18;
    el.scrollBy({ left: dir * step, behavior: 'smooth' });
  };
  return (
    <div style={{position:'relative'}}>
      <button type="button" aria-label="Scroll left" onClick={()=>scrollBy(-1)} className="carousel-nav left"><ChevronIcon dir="left"/></button>
      <div ref={trackRef} className="carousel-track" tabIndex={0} role="list" aria-label="Project highlights">
        {children}
      </div>
      <button type="button" aria-label="Scroll right" onClick={()=>scrollBy(1)} className="carousel-nav right"><ChevronIcon dir="right"/></button>
    </div>
  );
