.saved-panel{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);z-index:450;background:var(--surface);color:var(--text);border-left:1px solid var(--border-strong);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.18);font-family:var(--font-sans);animation:a11y-slide .22s var(--ease-out);}

/* ─── Accessibility menu (layout modeled on the UserWay menu used by stanfordnnea.com). It keeps fixed
   colors so it stays usable in every page mode, but those colors are the site's own teal, not a separate blue. ─── */
.a11y-panel{--surface:#fff;--surface-subtle:#f4f6fa;--text:#111;--text-secondary:#3d4452;--text-muted:#5b6474;--border:#d3d9e6;--border-strong:#aab3c5;--brand:#1f6a5e;--brand-hover:#17564c;--brand-subtle:#e7f7f4;--text-link:#1f6a5e;--border-focus:#1f6a5e;
  position:fixed;top:0;right:0;height:100%;width:min(355px,100vw);z-index:500;background:#1f6a5e;color:#111;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.28);font-family:var(--font-sans);animation:a11y-slide .22s var(--ease-out);}
.a11y-panel.big{width:min(520px,100vw);}
@keyframes a11y-slide{from{transform:translateX(24px);opacity:0;}to{transform:none;opacity:1;}}
/* Mobile map/list sheet: the sheet itself already slides via an inline transform transition,
   but the content it reveals (the docked pin card, or the full list) used to just pop in with
   no transition of its own. This fades+lifts each in, timed with --dur-base so it automatically
   collapses under prefers-reduced-motion the same way the slide already does. */
@keyframes msheet-content-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.msheet-content-in{animation:msheet-content-in var(--dur-base) var(--ease-out);}
.a11y-head{display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 20px 0 20px;color:#fff;font-weight:600;font-size:var(--fs-sm);flex-shrink:0;}

.a11y-close{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:#1f6a5e;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 3px rgba(255,255,255,.25);}
.a11y-close:hover{background:#17564c;}
.a11y-body{flex:1;overflow-y:auto;background:#eff1f5;border-radius:var(--r-md) var(--r-md) 0 0;padding:20px 20px 32px;}
.a11y-row{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-sm);font-weight:600;color:#111;margin-bottom:14px;}

.a11y-switch[aria-checked=true]::after{transform:translateX(20px);}
.a11y-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.a11y-tile{background:#fff;border:2px solid transparent;border-radius:var(--r-sm);min-height:114px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:var(--fs-sm);font-weight:700;color:#111;padding:10px 6px 16px;position:relative;text-align:center;line-height:1.25;}

/* Light-grey full-width bands alternate with white sections to separate landing-page sections */
.band{display:flow-root;background:var(--band,#f1f1f1);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
body.dark{--band:#14302b;}
/* Lively banner background: cerulean base (keeps white text >= 4.5:1) with sky-blue glows at the edges */
.lively-bg{position:relative;overflow:hidden;--spark-blue:#bfe0ff;background:radial-gradient(760px 380px at 6% -12%,rgba(125,190,255,.55),transparent 70%),radial-gradient(620px 320px at 100% 115%,rgba(90,170,255,.45),transparent 70%),linear-gradient(135deg,#0b5cad 0%,#0a6cc4 55%,#1177d6 100%);}
/* Donate band: deep blue-to-indigo with a warm glow behind the heart, a fading dot grid and soft rings */
.donate-bg{background:radial-gradient(480px 300px at 50% 16%,rgba(255,112,136,.30),transparent 72%),radial-gradient(720px 420px at 0% 0%,rgba(120,175,255,.45),transparent 70%),radial-gradient(680px 420px at 100% 100%,rgba(156,116,255,.42),transparent 70%),linear-gradient(160deg,#093b80 0%,#0b55ad 48%,#2b4fb9 100%);}
.donate-bg::before,.donate-bg::after{content:'';position:absolute;pointer-events:none;z-index:0;}
.donate-bg::before{inset:0;background:radial-gradient(rgba(255,255,255,.2) 1.5px,transparent 2px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 65%);mask-image:radial-gradient(ellipse at 50% 100%,#000 0,transparent 65%);}
.donate-bg::after{left:-170px;bottom:-230px;width:520px;height:520px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 46px,rgba(255,255,255,.11) 46px 48px);}
.lively-bg>*{position:relative;z-index:1;}
.lively-bg>.confetti{position:absolute;inset:0;z-index:0;pointer-events:none;}
.confetti i{position:absolute;border-radius:50%;display:block;opacity:.9;}
body.contrast-dark .band,body.contrast-light .band{background:var(--bg);}
/* Colorful pills: each tone = --f (text on tint), --b (tint), --s (solid fill, white text). Off in the Contrast modes. */
.pc-teal{--f:#17564c;--b:#e7f7f4;--s:#1f6a5e;}.pc-blue{--f:#1c5490;--b:#e8f1fb;--s:#1f5fae;}.pc-amber{--f:#7a4700;--b:#fdf1dc;--s:#a15c00;}
.pc-pink{--f:#a3186b;--b:#fdeaf3;--s:#b0206f;}.pc-cardinal{--f:#8c1515;--b:#fdf0f0;--s:#b4232a;}
.pc-advocacy{--f:#245a73;--b:#e2eef2;--s:#2c6e8a;}.pc-therapy{--f:#59407d;--b:#ece6f2;--s:#6a5191;}.pc-education{--f:#2f6636;--b:#e6f0e2;--s:#3e7a45;}
.pc-medical{--f:#8f4536;--b:#f4e5e2;--s:#a85a4c;}.pc-social{--f:#9c4a2f;--b:#fceee9;--s:#b0532f;}
body:not(.contrast-dark):not(.contrast-light) .pc{background:var(--b);color:var(--f);border-color:var(--s);border-color:color-mix(in srgb,var(--s) 45%,#fff);}
body:not(.contrast-dark):not(.contrast-light) .pc:hover{background:var(--b);border-color:var(--s);filter:brightness(.97);}
body:not(.contrast-dark):not(.contrast-light) .pc.on{background:var(--s);color:#fff;border-color:var(--s);}
body:not(.contrast-dark):not(.contrast-light) .pc.on .fcount{background:#fff;color:var(--s);}
body:not(.contrast-dark):not(.contrast-light) .pc:focus-visible{outline:2px solid var(--s);outline-offset:2px;}
.afchips-inline::-webkit-scrollbar{display:none}.afchips-inline{scrollbar-width:none}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 14px;border-bottom:1px solid var(--divider);margin-bottom:6px;}
@media (max-width:640px){.fbar{padding:6px 0 8px;flex-wrap:nowrap;margin-bottom:0;}}
.fbar-sep{width:1px;height:22px;background:var(--border-strong);margin:0 4px;}
/* Call is the only marigold control. The border gives it a clear edge on white. */
.call-btn{background:var(--action);color:var(--action-on);border:1px solid var(--action-border);text-decoration:none;}
.call-btn:hover{background:var(--action-hover);}
.call-btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
/* Filter chips: one neutral outline style. Selected = brand tint + brand border (+ a count badge). */
.fchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--text);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;}
.fchip:hover{background:var(--bg-sunken);}
.fchip:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
.map-win{overflow:hidden;overflow:clip;}   /* clip keeps the pinned (sticky) map working; browsers without it fall back to a plain scrolling map */
/* Buttons: one filled primary (brand teal) and one outline secondary style, used everywhere. */
.btn-primary,.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:700;white-space:nowrap;text-decoration:none;cursor:pointer;}
.btn-primary{background:var(--brand);color:var(--brand-on);border:1px solid var(--brand);}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);}
.btn-secondary:hover{background:var(--bg-sunken);}
.btn-primary:focus-visible,.btn-secondary:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
.btn-primary:disabled,.btn-secondary:disabled{opacity:.6;cursor:default;}
/* ─── Results-page header redesign: one neutral accent language (brand teal for the primary
   search action, cardinal red reserved only for Donate) instead of a different color on every
   button and filter chip -- the mix of loud, unrelated colors was flagged as visually noisy,
   particularly for autistic users who benefit from a calmer, more predictable UI. ─── */
.hdr-icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border);background:var(--surface-subtle);color:var(--text-secondary);cursor:pointer;position:relative;}
.hdr-icon-btn:hover{background:var(--bg-sunken);}
.hdr-icon-btn.on{background:var(--brand-subtle);border-color:var(--brand);color:var(--brand);}
.hdr-icon-btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
.donate-pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;white-space:nowrap;flex-shrink:0;background:var(--cardinal-500);color:#fff;border:none;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:700;letter-spacing:.02em;text-decoration:none;cursor:pointer;}
@media (max-width:640px){.hdr-icon-btn{width:32px;height:32px;}.hdr-icon-btn svg{width:16px;height:16px;}.donate-pill{height:32px;padding:0 12px;font-size:var(--fs-xs);}}
.donate-pill:hover{background:var(--cardinal-600);}
.donate-pill:focus-visible{outline:2px solid var(--cardinal-500);outline-offset:2px;}
/* Category filter chips: neutral outline + a small dot in the category's own accent color,
   rather than tinting the whole chip -- the dot alone carries the color, text stays the
   primary signal (never relying on color alone), same principle as the TypePill badge dot. */
.catchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r-pill);background:var(--surface);color:var(--text);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;cursor:pointer;}
.catchip svg{flex-shrink:0;color:var(--text-secondary);}
.catchip:hover{background:var(--bg-sunken);}
.catchip .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.catchip.on{background:var(--brand-subtle);border-color:var(--brand);color:var(--text);font-weight:700;}
.catchip.on svg{color:var(--brand);}
.catchip:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
/* Combined "what" + "where" search bar: one pill instead of two competing search boxes
   (the old header location box plus the filter bar's separate "Name or service" box). */
.hdr-search{display:flex;flex-direction:column;align-items:stretch;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);flex:1 1 320px;max-width:640px;padding:3px;}
.hdr-search-field{flex:1 1 0;display:flex;align-items:center;gap:6px;padding:0 12px;min-width:0;height:36px;border-bottom:1px solid var(--border);}
.hdr-search-field:last-of-type{border-bottom:none;}
.hdr-search-field:first-child{flex:1.2 1 0;}
.hdr-search-field input{flex:1;min-width:0;height:100%;border:none;outline:none;font-size:var(--fs-sm);background:transparent;color:var(--text);font-family:var(--font-sans);}
.hdr-search-field input::placeholder{color:var(--text-muted);}
.hdr-search-icon{flex-shrink:0;display:flex;color:var(--text-muted);}
/* The "where" field's leading icon doubles as the "use my current location" button (a real
   <button>, styled to look like the plain decorative icon the other field has) rather than a
   second separate control -- one tap target per field instead of icon-plus-button clutter. */
button.hdr-search-icon{border:none;background:transparent;cursor:pointer;color:var(--brand);padding:0;}
button.hdr-search-icon:hover{color:var(--brand-hover);}
button.hdr-search-icon:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:50%;}
button.hdr-search-icon:disabled{cursor:wait;opacity:.6;}
.hdr-search-btn{flex-shrink:0;width:30px;height:30px;margin:0 2px 0 4px;border-radius:50%;background:var(--brand);color:var(--brand-on);border:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;align-self:center;}
.hdr-search-btn:hover{background:var(--brand-hover);}
.hdr-search-btn:disabled{opacity:.7;cursor:wait;}
@media (max-width:640px){.hdr-search{position:relative;}.hdr-search-field{padding-right:44px;height:34px;}.hdr-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;margin:0;}}
@media (min-width:641px){.hdr-search{flex-direction:row;border-radius:var(--r-pill);}.hdr-search-field{border-bottom:none;}.hdr-search-field:first-child{border-right:1px solid var(--border);}}
.sortsel-wrap{position:relative;display:inline-flex;align-items:center;}
.sortsel{height:34px;padding:0 26px 0 8px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:var(--fs-sm);font-weight:600;font-family:var(--font-sans);cursor:pointer;-webkit-appearance:none;-moz-appearance:none;appearance:none;}
.sortsel:focus-visible{outline:2px solid var(--border-focus);outline-offset:1px;}
.sortsel-chevron{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-secondary);display:flex;}
.fchip.on{border-color:var(--brand);background:var(--brand-subtle);color:var(--text);}
/* Count badge: filter chips, the Filters button and the Saved button all use this one */
.fcount{background:var(--brand);color:var(--brand-on);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;line-height:1;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;}
.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:150;min-width:230px;max-height:min(60vh,420px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:6px;}
.fopt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--text);cursor:pointer;}
.fopt:hover{background:var(--bg-sunken);}
.fopt input{accent-color:var(--brand);width:17px;height:17px;flex-shrink:0;cursor:pointer;}
/* The single "Filters" button (Distance/Specialty/More, plus Type on mobile -- see
   FilterBar's `compact`) is the same sheet-opening control on mobile and desktop now, so
   it no longer needs its own breakpoint-gated show/hide rule; whether the category-chip row
   itself renders is a JS conditional in FilterBar, not CSS. */
.filters-btn{height:40px;}
@media (max-width:640px){
  .hide-mobile{display:none!important;}
  /* Keeps the chip's x at its current small visual size (it reads as a dense filter chip,
     not a standalone button) while giving it a real >=40px hit target via an invisible
     enlarged hit area, rather than growing the circle itself. */
  .afchip button{position:relative;}
  .afchip button::after{content:'';position:absolute;inset:-10px;}
}
.hdr-menu-pop{position:fixed;z-index:9999;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);padding:6px;display:flex;flex-direction:column;gap:2px;}
.hdr-menu-pop button,.hdr-menu-pop a{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--text);font-size:var(--fs-sm);font-weight:600;text-align:left;text-decoration:none;cursor:pointer;}
.hdr-menu-pop button:hover,.hdr-menu-pop a:hover{background:var(--bg-sunken);}
.hdr-menu-pop button:focus-visible,.hdr-menu-pop a:focus-visible{outline:2px solid var(--border-focus);outline-offset:-2px;background:var(--bg-sunken);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.fsheet-fieldset{border:none;margin:0 0 20px;padding:0;}
.fsheet-fieldset legend{padding:0;font-size:var(--fs-sm);font-weight:700;color:var(--text);margin:0 0 8px;}
.afchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border:1px solid var(--border-strong);border-radius:var(--r-pill);background:var(--surface-subtle);color:var(--text);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;}
.afchip button{width:20px;height:20px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
.afchip button:hover{background:var(--bg-sunken);color:var(--text);}
.card-action-btn{height:30px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
.card-icon-btn{width:30px;height:30px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;}
.card-action-btn.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);}
.card-action-btn.secondary:hover{background:var(--bg-sunken);}
.card-action-btn:focus-visible,.card-icon-btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;}
/* A listing's name opens its details: underlined on hover/focus so it reads as a link without adding noise */
.card-title-link{color:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color var(--dur-fast);}
.card-title-link:hover{text-decoration-color:currentColor;}
.card-title-link:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:2px;text-decoration-color:currentColor;}
@media (max-width:640px){
  .card-action-btn{height:40px;padding:0 14px;font-size:var(--fs-sm);}
  .card-icon-btn{width:40px;height:40px;}
  .card-thumb{width:64px!important;height:64px!important;}
}
.ra-mask{position:fixed;left:0;right:0;z-index:480;background:rgba(0,0,0,.62);pointer-events:none;}
.ra-guide{position:fixed;left:0;top:0;width:512px;height:12px;box-sizing:border-box;background:#000;border:3px solid #fff300;border-radius:5px;z-index:480;pointer-events:none;will-change:transform;}
/* Arrow above the bar: yellow triangle outlined around a black one (same size/position as the UserWay guide) */
.ra-guide::before,.ra-guide::after{content:'';position:absolute;left:50%;width:0;height:0;border-style:solid;border-color:transparent;transform:translateX(-50%);}
.ra-guide::before{top:-17px;border-width:0 14px 14px 14px;border-bottom-color:#fff300;}
.ra-guide::after{top:-12.8px;border-width:0 12.8px 12.8px 12.8px;border-bottom-color:#000;}
/* ─── One card anatomy for every featured organization, project and summit card ───────────
   White surface, 1px border, --r-md corners. The logo sits in a white rounded square and supplies
   the only color; then a small muted category label, the title, neutral fact chips, a short blurb
   and one teal-outline "Visit … ↗" button. `.wide` spans the grid; `.tile` is the carousel size. */
.feat-btn{display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 26px;background:var(--fb);color:var(--fbt);border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:background var(--dur-fast),transform var(--dur-fast);}
.feat-btn:hover{background:var(--fbh);transform:translateY(-1px);}
/* Featured resource cards: a grid of category-colored cards. Each tone sets --fa (accent / button fill), --fbt (text on accent),
   --fbg (card), --fbd (border), --ft (title), --fbody (body text), --fl (label text on tinted chips). Contrast modes drop the tints. */
.feat-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px;}
@media (min-width:980px){.feat-grid.cols3{grid-template-columns:repeat(3,1fr);}}
@media (min-width:760px){.feat-grid{grid-template-columns:1fr 1fr;}.feat-card.wide{grid-column:1 / -1;}}
.feat-card{--fa:#1f6a5e;--fbt:#fff;--fbg:#e7f7f4;--fbd:#b9e6dd;--ft:#111315;--fbody:#33383b;--fl:#17564c;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:16px 18px 18px;background:var(--fbg);border:1px solid var(--fbd);border-top:6px solid var(--fa);border-radius:16px;box-shadow:0 2px 10px rgba(9,42,38,.06);transition:transform var(--dur-base) var(--ease-out),box-shadow var(--dur-base) var(--ease-out);}
/* Each card gets its own decoration (all built from the card's accent --fa, drawn behind the content) */
.feat-card::before,.feat-card::after{content:'';position:absolute;pointer-events:none;z-index:0;}
.feat-card>*{position:relative;z-index:1;}
/* teal: big soft circle top-right + small ring */
.feat-tone-teal::before{top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:var(--fa);opacity:.1;}
.feat-tone-teal::after{bottom:26px;right:30px;width:46px;height:46px;border-radius:50%;border:5px solid var(--fa);opacity:.14;}
/* amber: concentric rings, like a ripple, bottom-right */
.feat-tone-amber::before{bottom:-110px;right:-110px;width:300px;height:300px;border-radius:50%;background:repeating-radial-gradient(circle,var(--fa) 0 10px,transparent 10px 30px);opacity:.14;}
/* cardinal: diagonal stripe band across the top-right corner */
.feat-tone-cardinal::before{top:0;right:0;width:260px;height:130px;background:repeating-linear-gradient(135deg,var(--fa) 0 8px,transparent 8px 22px);opacity:.13;-webkit-mask-image:linear-gradient(to left,#000,transparent);mask-image:linear-gradient(to left,#000,transparent);}
/* blue: dot grid fading out from the top-right */
.feat-tone-blue::before{top:0;right:0;width:230px;height:190px;background-image:radial-gradient(var(--fa) 2.5px,transparent 3px);background-size:20px 20px;opacity:.22;-webkit-mask-image:radial-gradient(circle at top right,#000,transparent 75%);mask-image:radial-gradient(circle at top right,#000,transparent 75%);}
/* pink: two overlapping blobs rising from the bottom-right, plus a small dot */
.feat-tone-pink::before{bottom:-60px;right:-30px;width:190px;height:190px;border-radius:46% 54% 60% 40% / 52% 40% 60% 48%;background:var(--fa);opacity:.1;}
.feat-tone-pink::after{bottom:-20px;right:110px;width:110px;height:110px;border-radius:50%;background:var(--fa);opacity:.07;}
/* violet: starburst rays fanning from the top-right corner */
.feat-tone-violet::before{top:-90px;right:-90px;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(var(--fa) 0 8deg,transparent 8deg 24deg);opacity:.13;}
/* green: ring pattern fading in from the bottom-right */
.feat-tone-green::before{bottom:0;right:0;width:200px;height:150px;background:radial-gradient(circle,transparent 5px,var(--fa) 5.5px 7px,transparent 7.5px) 0 0/26px 26px;opacity:.16;-webkit-mask-image:radial-gradient(circle at bottom right,#000,transparent 72%);mask-image:radial-gradient(circle at bottom right,#000,transparent 72%);}
/* orange: bold corner triangle plus a smaller one */
.feat-tone-orange::before{top:0;right:0;width:120px;height:120px;background:var(--fa);opacity:.13;clip-path:polygon(100% 0,0 0,100% 100%);}
.feat-tone-orange::after{top:0;right:0;width:64px;height:64px;background:var(--fa);opacity:.14;clip-path:polygon(100% 0,0 0,100% 100%);}
/* cyan: zigzag waves along the bottom edge */
.feat-tone-cyan::before{left:0;right:0;bottom:0;height:34px;background:linear-gradient(135deg,var(--fa) 25%,transparent 25%) 0 0/22px 22px,linear-gradient(225deg,var(--fa) 25%,transparent 25%) 0 0/22px 22px;opacity:.14;}
/* slate: square grid in the top-right */
.feat-tone-slate::before{top:0;right:0;width:230px;height:170px;background-image:linear-gradient(var(--fa) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--fa) 1.5px,transparent 1.5px);background-size:22px 22px;opacity:.2;-webkit-mask-image:radial-gradient(circle at top right,#000,transparent 75%);mask-image:radial-gradient(circle at top right,#000,transparent 75%);}
/* olive: checkerboard squares fading from the bottom-right */
.feat-tone-olive::before{bottom:0;right:0;width:200px;height:160px;background:repeating-conic-gradient(var(--fa) 0 25%,transparent 0 50%) 0 0/28px 28px;opacity:.14;-webkit-mask-image:radial-gradient(circle at bottom right,#000,transparent 72%);mask-image:radial-gradient(circle at bottom right,#000,transparent 72%);}
/* brown: scalloped arches rising along the bottom */
.feat-tone-brown::before{left:0;right:0;bottom:-14px;height:46px;background:radial-gradient(circle at 50% 100%,var(--fa) 0 17px,transparent 18px) 0 0/36px 46px repeat-x;opacity:.15;}
.feat-card:hover,.feat-card:focus-within{transform:translateY(-3px);box-shadow:0 10px 26px rgba(9,42,38,.14);}
.feat-card .feat-arrow{display:inline-block;transition:transform var(--dur-fast);}
.feat-card:hover .feat-arrow,.feat-card:focus-within .feat-arrow{transform:translate(2px,-2px);}
.feat-card .feat-btn:hover{filter:brightness(.92);}
.feat-title{font-size:18px;}.feat-blurb{font-size:14px;}.feat-head{display:flex;align-items:center;gap:12px;}.feat-head>div{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
.feat-card.mini .feat-title{font-size:16px;}.feat-card.mini .feat-blurb{font-size:13.5px;}

body.contrast-dark .feat-card,body.contrast-light .feat-card{--fa:var(--text);--fbt:var(--bg);--fbg:var(--surface);--fbd:var(--text);--ft:var(--text);--fbody:var(--text);--fl:var(--text);border:2px solid var(--text);box-shadow:none;}

/* Summit carousel tiles: a colored picture tile on top, centered details below (compact take on a product-lineup row) */
.feat-card.tile{flex:0 0 288px;scroll-snap-align:start;align-items:center;text-align:center;padding:12px 16px 18px;gap:8px;border-top-width:1px;}
.feat-tile{align-self:stretch;height:112px;border-radius:12px;background:color-mix(in srgb,var(--fa) 16%,var(--fbg));display:flex;align-items:center;justify-content:center;position:relative;}
.feat-tile .tile-logo{width:176px;height:80px;border-radius:12px;background:#fff;border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;position:relative;}
.feat-tile .tile-logo.sq{width:80px;}
.feat-tile .tile-logo img{width:100%;height:100%;object-fit:contain;}
.feat-card.tile .feat-chips{justify-content:center;}
.feat-card.tile .feat-title{font-size:17px;}
.feat-card.tile .feat-blurb{font-size:13.5px;}
@media (max-width:640px){.feat-card.tile{flex-basis:260px;}}
body.contrast-dark .feat-tile,body.contrast-light .feat-tile{background:transparent;border:1px solid var(--text);}
/* Listing detail service chips (neutral; outside the coloured featured cards) */
.detail-chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--r-pill);background:var(--surface-subtle);border:1px solid var(--border);color:var(--text-secondary);font-size:var(--fs-xs);font-weight:600;}
/* Project cards (the "AI-powered research project" row): same surface, border, radius and type as the cards above */
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);}
.proj-card img{width:100%;height:220px;object-fit:cover;display:block;}
.proj-card-body{padding:var(--sp-5);}
.proj-card-bar{width:36px;height:4px;background:var(--cardinal-500);border-radius:var(--r-pill);margin-bottom:var(--sp-3);}
.proj-card-title{margin:0 0 var(--sp-2);font-family:var(--font-antonio);font-weight:700;font-size:21px;letter-spacing:.01em;color:var(--text);}
.proj-card p{margin:0;font-size:var(--fs-sm);line-height:1.6;color:var(--text-secondary);}
/* Section headings: one pattern for the whole landing page (optional eyebrow, heading, optional subtitle) */
.sec-head{text-align:center;margin:0 auto var(--sp-5);max-width:80ch;}
.sec-eyebrow{display:inline-block;background:var(--brand-subtle);color:var(--text);border-radius:var(--r-pill);padding:4px 14px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--sp-3);}
.sec-title{margin:0;color:var(--text);text-wrap:balance;}
.sec-h2 .sec-title{font-family:var(--font-antonio);font-weight:700;font-size:var(--fs-2xl);letter-spacing:.01em;line-height:1.2;}
.sec-h3 .sec-title{font-family:var(--font-antonio);font-weight:700;font-size:var(--fs-xl);letter-spacing:.01em;line-height:1.3;}
.sec-sub{margin:var(--sp-2) auto 0;font-size:var(--fs-md);line-height:1.6;color:var(--text-muted);max-width:62ch;text-wrap:pretty;}
.sec-h3 .sec-sub{font-size:var(--fs-sm);}
/* Calm "not an emergency service" note under the searches */
.urgent-note{font-size:var(--fs-xs);line-height:1.5;color:var(--text-muted);}
/* Scrolling project-card row: native touch/trackpad/wheel scroll + snap, with prev/next buttons for pointer users */
.carousel-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;scrollbar-width:thin;}
.carousel-track::-webkit-scrollbar{height:7px;width:auto;}
.carousel-track::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-pill);}
.scroll-card{flex:0 0 340px;scroll-snap-align:start;}
.carousel-nav-row{display:flex;justify-content:flex-end;gap:12px;margin-top:14px;}
.carousel-nav{width:38px;height:38px;border-radius:50%;border:none;background:var(--divider);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,opacity .15s;}
.carousel-nav:hover:not(:disabled){background:var(--border-strong);}
.carousel-nav:disabled{opacity:.4;cursor:default;}
body.contrast-dark .carousel-nav,body.contrast-light .carousel-nav{background:transparent;border:2px solid var(--text);}
@media (max-width:640px){.carousel-nav-row{display:none;}.scroll-card{flex-basis:280px;}}
.hero2-search{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-md);overflow:hidden;padding:5px;gap:0;}
.hero2-field{flex:1 1 auto;display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0;height:48px;border-bottom:1px solid var(--border);}
.hero2-field input{flex:1;min-width:0;height:100%;border:none;outline:none;font-size:var(--fs-md);background:transparent;color:var(--text);font-family:var(--font-sans);}
.hero2-field input::placeholder{color:var(--text-muted);}
.hero2-icon{color:var(--text-muted);flex-shrink:0;display:flex;}
.hero2-btn{flex:0 0 auto;height:48px;min-width:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--brand-on);border:none;border-radius:var(--r-sm);font-size:var(--fs-md);font-weight:700;font-family:var(--font-sans);cursor:pointer;white-space:nowrap;}
.hero2-btn-label{display:inline;}
.hero2-clear{flex:0 0 auto;width:32px;height:32px;border:none;background:transparent;color:var(--text-link);font-size:24px;line-height:1;cursor:pointer;border-radius:50%;}
.hero2-clear:hover{background:var(--brand-subtle);}
.hero2-clear{opacity:0;transition:opacity .15s;}
.hero2-field:hover .hero2-clear,.hero2-field:focus-within .hero2-clear,.hero2-clear:focus-visible{opacity:1;}

.hero2-btn:disabled{opacity:.7;cursor:wait;}
.browse-cats{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px;width:min(1040px,calc(100vw - 48px));margin-left:50%;transform:translateX(-50%);}
.hero2-chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 10px;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface);color:var(--text-secondary);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.hero2-chip:hover{background:var(--brand-subtle);border-color:var(--brand);color:var(--text);}
/* Category chip icons: colorful outline art normally; the Contrast modes swap in the monochrome line icon.
   On a pressed (solid-color) chip the art's outlines and tints turn white so they stay readable. */
.cat-art,.cat-line{display:inline-flex;flex-shrink:0;}
.cat-line{display:none;}
body.contrast-dark .cat-art,body.contrast-light .cat-art{display:none;}
body.contrast-dark .cat-line,body.contrast-light .cat-line{display:inline-flex;}

.hero2-chip.on .cat-art .tn{fill:rgba(255,255,255,.2);}
@media (min-width:641px){.hero2-search{flex-direction:row;}.hero2-field{border-bottom:none;flex:1 1 0;}.hero2-field:first-child{flex:1 1 0;}.hero2-field{padding:0 14px;}.hero2-field:nth-child(2){position:relative;flex:0 0 clamp(190px,26%,260px);}.hero2-field:nth-child(2)::before{content:'';position:absolute;left:0;top:50%;height:30px;margin-top:-15px;border-left:2px solid var(--border);}.hero2-btn{width:48px;padding:0;margin-left:4px;}.hero2-btn-label{display:none;}}

/* ─── Hero decorations + scroll reveal ──────────────────────────
   All motion here is gated two ways: (1) prefers-reduced-motion:no-preference below,
   so OS-level reduced-motion users never receive it, and (2) body.reduce-motion (the
   existing "Pause Animations" a11y toggle) via the universal !important override near
   the top of this stylesheet, which forces any animation/transition here to a single
   near-instant cycle that settles at its final frame. */
.hero-blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;border-radius:inherit;}
.hero-blob{position:absolute;border-radius:50%;filter:blur(60px);}
.hero-blob.b1{width:340px;height:340px;left:-90px;top:-100px;background:#3d9bf0;opacity:.18;}
.hero-blob.b2{width:300px;height:300px;right:-80px;top:20%;background:#1f6a5e;opacity:.16;}
.hero-blob.b3{width:260px;height:260px;left:18%;bottom:-120px;background:#f6a21e;opacity:.15;}
.hero-blob.b4{width:220px;height:220px;right:20%;bottom:-60px;background:#e5348b;opacity:.14;}
.hero-dots{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(circle,#1f6a5e 1.5px,transparent 1.5px);background-size:26px 26px;}
@media (prefers-reduced-motion:no-preference){
  .hero-blob.b1{animation:blobDrift1 26s ease-in-out infinite;}
  .hero-blob.b2{animation:blobDrift2 32s ease-in-out infinite;}
  .hero-blob.b3{animation:blobDrift3 24s ease-in-out infinite;}
  .hero-blob.b4{animation:blobDrift4 30s ease-in-out infinite;}
  .hero2-chip{transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease,color .15s ease;}
  .hero2-chip:hover,.hero2-chip:focus-visible{transform:translateY(-2px);box-shadow:0 4px 10px rgba(9,42,38,.14);}
  .cat-art svg{transition:transform .2s ease;}
  .hero2-chip:hover .cat-art svg,.hero2-chip:focus-visible .cat-art svg{transform:scale(1.12) rotate(-6deg);}
}
@keyframes blobDrift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(36px,26px) scale(1.06);}}
@keyframes blobDrift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-34px) scale(1.05);}}
@keyframes blobDrift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(28px,-22px) scale(1.08);}}
@keyframes blobDrift4{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-22px,18px) scale(1.05);}}
.fade-up{opacity:1;transform:none;}
@media (prefers-reduced-motion:no-preference){
  .fade-up{opacity:0;transform:translateY(12px);transition:opacity .55s ease-out,transform .55s ease-out;}
  .fade-up.in-view{opacity:1;transform:translateY(0);}
}
/* ─── City loader (directory loading state) ─────────────────────
   A tilted 3D city flattens into a 2D map, a route draws itself, then a pin drops.
   Base styles ARE the final frame, so OS reduced-motion users (no animation) and the
   "Pause Animations" toggle (body.reduce-motion, which shortens animations to one
   near-instant cycle with no fill) both get a still, finished map. */
.city-loader{display:flex;flex-direction:column;align-items:center;}
.city-stage{width:220px;height:210px;perspective:620px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.city-tile{width:180px;height:180px;display:block;overflow:visible;transform-origin:50% 60%;}
.city-ground{fill:var(--bg-sunken);stroke:var(--border);stroke-width:1.5;}
.city-street{fill:var(--surface);}
.city-park{fill:var(--success);fill-opacity:.18;}
.city-tree{fill:var(--success);}
.city-wall{fill:var(--border-strong);transform:scaleY(0);transform-box:fill-box;transform-origin:50% 100%;}
.city-roof{fill:var(--brand-subtle);stroke:var(--border-strong);stroke-width:1;}
.city-road{fill:none;stroke:var(--brand);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;}
.city-pin-head{fill:var(--pin-fill);}
.city-pin-dot{fill:var(--pin-fill-on);}
.city-ripple{fill:none;stroke:var(--pin-fill);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;}
@media (prefers-reduced-motion:no-preference){
  .city-tile{animation:cityTilt 3.8s cubic-bezier(.45,0,.25,1) infinite;}
  .city-wall{animation:cityWall 3.8s cubic-bezier(.45,0,.25,1) infinite;}
  .city-roof{animation:cityRoof 3.8s cubic-bezier(.45,0,.25,1) infinite;}
  .city-road{animation:cityRoad 3.8s ease-in-out infinite;}
  .city-pin{animation:cityPin 3.8s ease-out infinite;}
  .city-ripple{animation:cityRipple 3.8s ease-out infinite;}
}
@keyframes cityTilt{0%{opacity:0;transform:rotateX(58deg) scale(.9);}8%,12%{opacity:1;transform:rotateX(58deg) scale(.9);}38%{transform:rotateX(0deg) scale(1);}90%{opacity:1;transform:rotateX(0deg) scale(1);}100%{opacity:0;transform:rotateX(0deg) scale(1);}}
@keyframes cityWall{0%,12%{transform:scaleY(1);}38%,100%{transform:scaleY(0);}}
@keyframes cityRoof{0%,12%{transform:translateY(calc(var(--h) * -1px));}38%,100%{transform:translateY(0);}}
@keyframes cityRoad{0%,40%{stroke-dashoffset:1;}66%,100%{stroke-dashoffset:0;}}
@keyframes cityPin{0%,66%{opacity:0;transform:translateY(-28px);}73%{opacity:1;transform:translateY(2px);}77%,100%{opacity:1;transform:translateY(0);}}
@keyframes cityRipple{0%,73%{opacity:0;transform:scale(.3);}75%{opacity:.7;}92%,100%{opacity:0;transform:scale(1.9);}}
</style>

/* ─── Listing ids ───────────────────────────────────────────────────
   Saved items and shared links point at a listing by id, so the id comes from the record itself and
   survives data updates: the NPI number when there is one, otherwise a hash of name + address + source.
   (It used to be the listing's position in the whole directory, which pointed somewhere else after
   every data change.) cyrb53 is a small public-domain 53-bit string hash. */
function cyrb53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
const stableId = r => r.npi_number
  ? 'n' + String(r.npi_number).replace(/\D/g, '')
  : 'h' + cyrb53(`${r.name || ''}|${r.address || ''}|${r.source || ''}`).toString(36);
const LISTING_ID_RE = /^[nh][0-9a-z]{1,20}$/;

/* Registry addresses often arrive in ALL CAPS ("123 MAIN ST, IRVINE, CA 92618"). Those are shown in
   title case; mixed-case addresses are left alone. State codes before a ZIP, postcodes, PO Box and
   compass points stay upper case, and "of / the / and" go lower case. (Nearly all of these are US NPI
   addresses, so words like La and Del stay capitalized: "La Veta Ave", "Del Mar".) */
const ADDR_UPPER = new Set(['PO','NE','NW','SE','SW','N','S','E','W','USA','US','UK','DC']);
const ADDR_LOWER = new Set(['of','the','and']);
const US_STATE_CODES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC PR GU VI AS MP'.split(' '));
function tidyAddress(a) {
  if (!a || /[a-z]/.test(a) || !/[A-Z]{3}/.test(a)) return a;
  const words = a.split(/(\s+|,)/);
  return words.map((w, i) => {
    if (!/[A-Z]/.test(w)) return w;
    if (/\d/.test(w)) return /^\d+(ST|ND|RD|TH)$/.test(w) ? w.toLowerCase() : w;   // 1ST -> 1st; SW1A, 4B stay
    if (ADDR_UPPER.has(w)) return w;
    if (w.length === 2 && US_STATE_CODES.has(w)) {
      const rest = words.slice(i + 1).join('').trim();
      if (!rest || /^\d{5}/.test(rest) || /^,/.test(rest)) return w;                    // "…, CA 92618" / "…, CA"
    }
    const lw = w.toLowerCase();
    if (i > 0 && ADDR_LOWER.has(lw)) return lw;
    return lw.replace(/(^|[-'’/.(])([a-zà-ÿ])/g, (m, p1, c) => p1 + c.toUpperCase());
  }).join('');
}

/* One shard's raw rows -> the listing objects the app uses. Rows without a location that also aren't
   marked placeless (nationwide / online) can't be shown anywhere, so they're dropped. */
function shapeAll(raw) {
  return (Array.isArray(raw) ? raw : []).map(r => ({
    id: stableId(r), name: r.name, type: r.type, address: tidyAddress(r.address), phone: r.phone,
    website: r.website, services: r.services || [], description: r.description || '',
    coordinates: r.coordinates, suggested: r.suggested, placeless: r.placeless,
    facility_name: r.facility_name, entity_type: r.entity_type, source: r.source || '', npi_number: r.npi_number,
  })).filter(r => r.placeless || (r.coordinates && r.coordinates.lat && r.coordinates.lng));
}

/* ─── Directory data: load only what a search needs ──────────────────
   data/manifest.json lists one JSON shard per US state / European country plus world/all.json, each
   with `cells`: the 1°×1° grid squares its located listings fall in, encoded as
   (floor(lat) + 90) * 360 + (floor(lng) + 180) mod 360 -- tools/split_by_region.py writes them. The
   landing page loads only the manifest; a search fetches just the shards with listings in its area
   (an Irvine search needs us/CA.json, ~0.5 MB, not all ~16 MB). "Any distance" loads everything.
   Grid cells, not one bounding box per shard: France's overseas territories alone would stretch its
   box over most of the globe. Placeless listings have no cell, so two shards join by rule:
   us/national.json (US-wide services) for any US search, and world/all.json (international) always. */
const DEFAULT_RADIUS = 10;
const cellKey = (lat, lng) => (Math.floor(lat) + 90) * 360 + (((Math.floor(lng) + 180) % 360) + 360) % 360;
function cellsAround(c, miles) {
  const dLat = miles / 69;
  const dLng = Math.min(180, miles / (69 * Math.max(0.05, Math.cos(c.lat * Math.PI / 180))));
  const keys = [];
  for (let la = Math.floor(c.lat - dLat); la <= Math.floor(c.lat + dLat); la++)
    for (let lo = Math.floor(c.lng - dLng); lo <= Math.floor(c.lng + dLng); lo++) keys.push(cellKey(la, lo));
  return keys;
}
function shardsFor(manifest, coords, radius) {
  const all = manifest.files.map(f => f.file);
  // No location, "Any distance", or an older manifest without cells: the whole directory.
  if (!coords || radius == null || !manifest.files.some(f => f.cells)) return all;
  const want = new Set(cellsAround(coords, radius));
  const picked = manifest.files.filter(f => (f.cells || []).some(k => want.has(k)));
  const keep = new Set(picked.map(f => f.file));
  if (picked.some(f => f.region === 'us')) keep.add('us/national.json');
  keep.add('world/all.json');
  return all.filter(f => keep.has(f));   // manifest order
}

const shardRows = new Map();    // file -> its shaped listings, once loaded (kept for the whole visit)
const shardLoads = new Map();   // file -> the in-flight fetch
function loadShard(file) {
  if (!shardLoads.has(file)) {
    shardLoads.set(file, fetch('data/' + file)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(raw => { shardRows.set(file, shapeAll(raw)); })
      .catch(() => { shardRows.set(file, []); }));   // a broken shard is skipped, as before
  }
  return shardLoads.get(file);
}

/* data/manifest.json: null while loading, then {total, files}. A failed fetch gives no files, and
   searches then fall back to the small built-in RESOURCES list. */
function useManifest() {
  const [manifest, setManifest] = useState(() => window.communityData ? { total: window.communityData.length, files: [] } : null);
  useEffect(() => {
    if (window.communityData) return;
    fetch('data/manifest.json').then(r => r.json())
      .then(m => setManifest({ total: m.total || 0, files: Array.isArray(m.files) ? m.files : [] }))
      .catch(() => setManifest({ total: 0, files: [] }));
  }, []);
  return manifest;
}

/* The listings for one search: `list` is null until every shard it needs has arrived. */
function useSearchListings(manifest, coords, radius, active) {
  const [, setTick] = useState(0);
  const files = useMemo(() => (active && manifest ? shardsFor(manifest, coords, radius) : null),
    [manifest, active, coords && coords.lat, coords && coords.lng, radius]);
  const key = files ? files.join(',') : '';
  const missing = files ? files.filter(f => !shardRows.has(f)) : [];
  useEffect(() => {
    if (!missing.length) return;
    let dead = false;
    missing.forEach(f => loadShard(f).then(() => { if (!dead) setTick(t => t + 1); }));
    return () => { dead = true; };
  }, [missing.join(',')]);
  const ready = !!files && missing.length === 0;
  const list = useMemo(() => {
    if (!ready) return null;
    if (window.communityData) return shapeAll(window.communityData);
    if (!files.length) return shapeAll(RESOURCES);
    const seen = new Set(), out = [];   // the same listing can sit in two shards; show it once
    files.forEach(f => shardRows.get(f).forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); } }));
    return out;
  }, [key, ready]);
  return { list, loaded: files ? files.length - missing.length : 0, total: files ? files.length : 0 };
}

function haversine(a, b){
  if (!a || !b) return null;
  const R = 3959; // miles
  const dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

// A bare 5-digit (or ZIP+4) string is a US ZIP code in every real case this directory
// sees; Nominatim has no way to know that and happily matches the same digits against a
// postal code in another country (e.g. "95112" alone resolves to Klaipeda, Lithuania) --
// confirmed live during the mobile-redesign research session. Scoping to US only for
// this exact shape doesn't affect city/place-name search, which still covers every
// country per the note below.
const US_ZIP_RE = /^\d{5}(-\d{4})?$/;

async function geocode(q){
  // No countrycodes filter -- the directory now covers many countries, and hard-locking
  // this to "us" used to silently resolve e.g. "London" to a US town of the same name.
  const countryHint = US_ZIP_RE.test(q.trim()) ? '&countrycodes=us' : '';
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q) + countryHint;
  const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
  const data = await res.json();
  if (data && data.length) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  return null;
}

/* Formats a Nominatim result into a Google-Maps-style two-line suggestion:
   a bold primary name plus a lighter secondary line (region/country). */
function formatSuggestion(s) {
  const a = s.address || {};
  const main = a.city || a.town || a.village || a.county || a.state || (s.display_name || '').split(',')[0] || s.display_name;
  const rest = (s.display_name || '').split(',').map(p => p.trim()).filter(p => p && p !== main);
  const secondary = rest.slice(0, 2).join(', ');
  return { main, secondary };
}

/* "Use my current location" used to just label the search "My Location" forever -- resolving
   it to a real place name (the same city/state format the address search already shows) makes
   the header search bar readable at a glance instead of a placeholder that never updates.
   Best-effort: any failure here just falls back to the literal "My Location" label. */
async function reverseGeocode(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
    const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
    const data = await res.json();
    const a = data && data.address;
    if (!a) return null;
    // Built from the address' own city/state fields (not display_name's part order, which
    // puts street-level detail before the state) -- that's what actually reads as "San Jose, CA".
    const main = a.city || a.town || a.village || a.county;
    if (!main) return null;
    return a.state ? `${main}, ${a.state}` : main;
  } catch (e) { return null; }
}

/* Remembered location: pre-fills the landing search like other directories do. Only a place name
   is stored (never coordinates), and only in this browser. */
const LAST_LOC_KEY = 'last_loc';
const saveLastLoc = label => { if (label && label !== 'My Location') { try { localStorage.setItem(LAST_LOC_KEY, label); } catch (e) {} } };
const readLastLoc = () => { try { return localStorage.getItem(LAST_LOC_KEY) || ''; } catch (e) { return ''; } };

/* Debounced, cancel-safe Nominatim autocomplete-as-you-type. Nominatim's public API asks for
   at most ~1 request/sec; a single typing user's keystrokes are almost never that fast, so
   this only waits 150ms of silence before firing (down from 350ms, which felt sluggish) and
   only ever keeps the latest in-flight request's result. */
function useLocationSuggestions(query) {
  const [suggestions, setSuggestions] = useState([]);
  useEffect(() => {
    const q = query.trim();
    if (q.length < 2) { setSuggestions([]); return; }
    let cancelled = false;
    const t = setTimeout(async () => {
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=' + encodeURIComponent(q) + (US_ZIP_RE.test(q) ? '&countrycodes=us' : '');
        const res = await fetch(url, { headers:{ 'Accept':'application/json' } });
        const data = await res.json();
        if (!cancelled) setSuggestions(data || []);
      } catch (e) {
        if (!cancelled) setSuggestions([]);
      }
    }, 150);
    return () => { cancelled = true; clearTimeout(t); };
  }, [query]);
  return suggestions;
}

/* Shared dropdown UI for both the landing-page and header search bars. Rendered through a
   portal straight onto <body> so it always sits on top of and outside of everything --
   the landing hero's ".lively-bg" section clips its own confetti with overflow:hidden,
   which was silently cutting the dropdown off before this. Position is computed from the
   anchor input's real on-screen rect, so it tracks wherever that input actually is. */
const SuggestDropdown = ({suggestions, activeIdx, setActiveIdx, onPick, anchorRef, dark, onLocate}) => {
  const off = onLocate ? 1 : 0;
  const [rect, setRect] = useState(null);
  useEffect(() => {
    if ((!suggestions.length && !onLocate) || !anchorRef.current) { setRect(null); return; }
    const update = () => setRect(anchorRef.current.getBoundingClientRect());
    update();
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
  }, [suggestions.length, anchorRef, onLocate]);

  if ((!suggestions.length && !onLocate) || !rect) return null;
  return ReactDOM.createPortal(
    <div style={{position:'fixed',top:rect.bottom+6,left:rect.left,width:rect.width,background:dark?'#2a261e':'#fff',border:'1px solid var(--border)',borderRadius:'var(--r-md)',boxShadow:'0 8px 28px rgba(0,0,0,.18)',zIndex:9999,overflow:'hidden',textAlign:'left'}}>
      {onLocate && (
        <div role="option" aria-selected={activeIdx===0}
          onMouseDown={e=>{e.preventDefault();onLocate();}}
          onMouseEnter={()=>setActiveIdx(0)}
          onMouseLeave={()=>setActiveIdx(-1)}
          style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',cursor:'pointer',color:'var(--text-link)',fontWeight:600,fontSize:'var(--fs-md)',
            background: activeIdx===0 ? (dark?'rgba(255,255,255,.14)':'#dce8fb') : 'transparent'}}>
          <span style={{display:'inline-flex',flexShrink:0}}><PinIcon s={20}/></span>Current Location
        </div>
      )}
      {suggestions.map((s,k) => {
        const i = k + off;
        const {main, secondary} = formatSuggestion(s);
        return (
          <div key={s.place_id}
            onMouseDown={e=>{e.preventDefault();onPick(s);}}
            onMouseEnter={()=>setActiveIdx(i)}
            onMouseLeave={()=>setActiveIdx(-1)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',
              background: i===activeIdx ? (dark?'rgba(255,255,255,.14)':'#dce8fb') : 'transparent'}}>
            <span style={{color:dark?'rgba(255,255,255,.7)':'var(--text-muted)',flexShrink:0,display:'inline-flex'}}><PinIcon s={14}/></span>
            <span style={{fontSize:'var(--fs-sm)',color:dark?'#fff':'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              <b>{main}</b>{secondary && <span style={{color:dark?'rgba(255,255,255,.6)':'var(--text-muted)'}}> {secondary}</span>}
            </span>
          </div>
        );
      })}
    </div>,
    document.body
  );
};

const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normalizeAddress(addr) {
  return (addr || '').trim().toUpperCase().replace(/\s+/g, ' ');
}

/* ─── Accessibility prefs + favorites persistence (localStorage) ─── */
const A11Y_PREFS_KEY = 'a11y_prefs';
const A11Y_FAVS_KEY = 'a11y_favs';
const DEFAULT_PREFS = {
  colorScheme:'earthy', theme:'system', textSize:'default', typeface:'default', contrast:'default', motion:'system',
  links:'default', spacing:'default', lineHeight:'default', textAlign:'default', saturation:'default',
  cursor:'default', hideImages:'default', tooltips:'default',
  oversized:false,
};

function loadPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_PREFS_KEY));
    const prefs = raw && typeof raw === 'object' ? { ...DEFAULT_PREFS, ...raw } : { ...DEFAULT_PREFS };
    if (prefs.cursor === 'white') prefs.cursor = 'black';          // white cursor was replaced by Reading Mask / Guide
    if (prefs.contrast === 'high') prefs.contrast = 'default';   // old "higher contrast" step no longer exists
    return prefs;
  } catch { return { ...DEFAULT_PREFS }; }
}
function savePrefs(prefs) {
  try { localStorage.setItem(A11Y_PREFS_KEY, JSON.stringify(prefs)); } catch {}
}
/* Saved items are small snapshots of each listing (keyed by its stable id), so the Saved panel works
   without loading that listing's region. Older versions stored bare numbers (positions in the whole
   directory); those stay in the list until migrateLegacyFavs() swaps them for snapshots. */
const favSnapshot = r => ({
  id: r.id, name: r.name, type: r.type, address: r.address, phone: r.phone, website: r.website,
  coordinates: r.coordinates, placeless: r.placeless, source: r.source, npi_number: r.npi_number,
  services: r.services, description: r.description,
});
function loadFavs() {
  try {
    const raw = JSON.parse(localStorage.getItem(A11Y_FAVS_KEY));
    return Array.isArray(raw) ? raw.filter(f => typeof f === 'number' || (f && typeof f.id === 'string' && f.name)) : [];
  } catch { return []; }
}
/* Maps old numeric favorites to listings: number n was row n-1 of all shards joined in manifest order,
   so the manifest's per-shard counts say which shard (and which row of it) to fetch. Returns a Map of
   old number -> snapshot; numbers that no longer resolve are left out. */
async function migrateLegacyFavs(nums, manifest) {
  const starts = [];
  manifest.files.reduce((acc, f) => { starts.push(acc); return acc + (f.count || 0); }, 0);
  const byShard = new Map();
  nums.forEach(n => {
    const k = manifest.files.findIndex((f, i) => n > starts[i] && n <= starts[i] + (f.count || 0));
    if (k >= 0) byShard.set(k, [...(byShard.get(k) || []), n]);
  });
  const found = new Map();
  await Promise.all([...byShard].map(async ([k, list]) => {
    const raw = await fetch('data/' + manifest.files[k].file).then(r => r.json()).catch(() => []);
    list.forEach(n => {
      const row = Array.isArray(raw) && raw[n - starts[k] - 1];
      const shaped = row && shapeAll([row])[0];
      if (shaped) found.set(n, favSnapshot(shaped));
    });
  }));
  return found;
}
function saveFavs(favs) {
  try { localStorage.setItem(A11Y_FAVS_KEY, JSON.stringify(favs)); } catch {}
}
function clearAllStoredData() {
  try { localStorage.removeItem(A11Y_PREFS_KEY); localStorage.removeItem(A11Y_FAVS_KEY); } catch {}
}

/* ─── Scroll-reveal + count-up hooks (respect reduceMotion: shows final state instantly) ─── */
function useRevealOnce(reduceMotion) {
  const ref = useRef(null);
  const [inView, setInView] = useState(!!reduceMotion);
  useEffect(() => {
    if (reduceMotion) { setInView(true); return; }
    if (inView || !ref.current || !window.IntersectionObserver) { if (!window.IntersectionObserver) setInView(true); return; }
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) { setInView(true); obs.disconnect(); }
    }, {threshold:0.15});
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, [reduceMotion, inView]);
  return [ref, inView];
}
function useCountUp(target, start, reduceMotion, duration=1200) {
  const [value, setValue] = useState(reduceMotion ? target : 0);
  useEffect(() => {
    if (!start) return;
    if (reduceMotion) { setValue(target); return; }
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [start, reduceMotion, target, duration]);
  return value;
}

/* ─── Where a listing comes from ─────────────────────────────────────
   Every card ends with a plain "Source:" line, the way FindTreatment.gov does it: the registry or
   directory the listing was taken from, plus its registry number when it has one. These labels cover
   the sources behind ~99% of listings; any other source falls back to a readable form of its own name. */
const SOURCE_LABELS = {
  'npi-registry': 'US NPI Registry',
  'France RNA (Repertoire National des Associations) - official government open data, data.gouv.fr': 'France’s national register of associations (RNA)',

  'Brazil IPEA Mapa das OSCs (civil-society-organization registry) - official government open data': 'Brazil’s civil-society register (IPEA Mapa das OSCs)',
  'best-buddies': 'Best Buddies chapter directory',
  'propublica-irs-autism': 'IRS nonprofit records (via ProPublica)',
  "Catalonia Registre d'Associacions (Generalitat de Catalunya)": 'Catalonia’s register of associations',
  'IRS Exempt Organizations Business Master File (NTEE)': 'IRS Exempt Organizations file',
  'sibshops': 'Sibshops directory',
  'Madrid Registro de Asociaciones (Comunidad de Madrid)': 'Madrid’s register of associations',
  'England & Wales Charity Commission (registered charity)': 'Charity Commission for England and Wales',
  'Italy RUNTS (Registro Unico Nazionale del Terzo Settore) - official government register': 'Italy’s third-sector register (RUNTS)',
  'Canarias Registro de Asociaciones (Gobierno de Canarias)': 'Canary Islands’ register of associations',
  'Florida Division of Corporations (Sunbiz) non-profit bulk data - official state open data': 'Florida Division of Corporations',
  'Netherlands ANBI register - official Belastingdienst (Tax Administration) open data': 'Dutch Tax Administration ANBI register',
  'Germany BZSt Zuwendungsempfaengerregister (federal non-profit register)': 'German federal non-profit register (BZSt)',
  'Belgium KBO/BCE (Kruispuntbank van Ondernemingen) - official government business/association register': 'Belgium’s business register (KBO/BCE)',
  'Norway Bronnoysund Register Centre (Enhetsregisteret) - official national entity registry': 'Norway’s Brønnøysund Register Centre',
  'aucd-ucedd': 'AUCD network directory',
  'Inclusion International full member listing (global intellectual-disability federation) - official umbrella-body member directory': 'Inclusion International member list',
  'cpir-pti': 'Parent Center Hub (CPIR) directory',
  'ndrn-protection-advocacy': 'NDRN Protection & Advocacy directory',
  'ecta-partc': 'ECTA Center early-intervention directory',
  'special-olympics': 'Special Olympics program directory',
  'easterseals': 'Easterseals affiliate directory',
  'thearc': 'The Arc chapter directory',
  'asan-affiliate': 'ASAN affiliate directory',
  'autism-society': 'Autism Society affiliate directory',
  'autism-care-network': 'Autism Care Network directory',
  'Autism-Europe official member directory (2023 PDF)': 'Autism-Europe member directory',
};
function sourceLabel(src) {
  if (!src) return '';
  if (SOURCE_LABELS[src]) return SOURCE_LABELS[src];
  if (/^Wikidata\b/.test(src)) return 'Wikidata';
  if (/GPT-Researcher/.test(src) || (/\b20\d\d\b/.test(src) && /\b(Resources|Services|States|Telehealth|Expansion|Programs|Providers)\b/.test(src)))
    return 'Accessibility Mapper’s curated list';
  if (/^[a-z0-9.-]+$/.test(src)) return 'The organization’s own published listings';
  return src.split(' - ')[0].replace(/,?\s*verified\s+20\d\d(-\d\d)?$/i, '').trim();
}
// A registry number a visitor can check for themselves, when the listing has one.
function sourceRef(r) {
  const npi = r.npi_number && String(r.npi_number).replace(/\D/g, '');
  if (npi) return { text: `NPI ${npi}`, url: `https://npiregistry.cms.hhs.gov/provider-view/${npi}` };
  const ein = /\bEIN (\d{7,9})\b/.exec(r.description || '');
  if (ein) { const e = ein[1].padStart(9, '0'); return { text: `EIN ${e}`, url: `https://projects.propublica.org/nonprofits/organizations/${e}` }; }
  const wd = /^Wikidata\b.*\b(Q\d+)\b/.exec(r.source || '');
  if (wd) return { text: `Wikidata ${wd[1]}`, url: `https://www.wikidata.org/wiki/${wd[1]}` };
  return null;
}

/* Registry descriptions are often boilerplate about the registry itself ("IRS-registered 501(c)(3)
   nonprofit … EIN 123", "… (NPI registry)."). That part is already said by the Source line, so the
   card keeps only what describes the service. Keyword search still matches the full original text. */
const DESC_RULES = [
  [/^French officially registered association \(RNA\):\s*/, ''],
  [/^CQC-regulated\s+/, ''],
  [/\s*Funded slots: \d+\.?\s*$/, ''],
  [/\s*\(NPI registry\)/, ''],
  [/,\s*NPI registry\)/, ')'],
  [/^Registered organization in Ukraine's Unified State Register of Legal Entities\.?$/, ''],
  [/^Registered Brazilian civil-society organization \(CNAE \d+\).*$/, ''],
  [/^IRS-registered 501\(c\)\(3\) nonprofit(?:, NTEE classification: (.+?) \([A-Z]\d+[A-Z0-9]*\))?(?:, NTEE code [A-Z0-9]+)?\.\s*EIN \d+\.?$/,
    (m, cat) => cat ? `Nonprofit organization (category: ${cat}).` : 'Nonprofit organization.'],
  [/^IRS-registered tax-exempt organization, NTEE code ([A-Z0-9]+)\.\s*EIN \d+\.?$/,
    (m, code) => /^G84/.test(code) ? 'Nonprofit organization (category: Autism).' : /^H84/.test(code) ? 'Nonprofit organization (category: Autism research).' : 'Nonprofit organization.'],
  [/^Registered Florida non-profit corporation \([A-Z]+\)\.?$/, ''],
  [/^Registered organization in the (?:Czech ARES|Slovak RPO) national registry, based in .*$/, ''],
  [/^Registered organization in the Estonian e-Business Register\.?$/, ''],
  [/^Dutch ANBI-registered public benefit organization(?: \("(.+?)"\))?, based in .*$/, (m, q) => q || ''],
  [/\s*--\s*registered non-profit association \(KBO\/BCE, Belgium's official business register\)\.?$/, ''],
  [/^Registered as an? .+? in .+?, Norway\.\s*/, ''],
  [/^Registered Italian third-sector entity \(RUNTS\), category: (.+?)\.?$/, (m, c) => `Third-sector organization (${c}).`],
  [/^(?:--\s*)?see Wikidata for details\.?$/i, ''],
];
function cleanDescription(r) {
  let d = (r.description || '').trim();
  if (!d) return '';
  if (r.name && d.startsWith(r.name + ' ')) d = d.slice(r.name.length + 1).replace(/^is (an? )?/, '');   // "<Name> is a registered …"
  for (const [re, rep] of DESC_RULES) d = d.replace(re, rep);
  d = d.trim();
  if (!/[a-z]/.test(d) && /[A-Z]{3}/.test(d)) d = d.toLowerCase();   // ALL-CAPS registry text -> sentence case
  d = d.charAt(0).toUpperCase() + d.slice(1);
  return d.toLowerCase() === (r.name || '').trim().toLowerCase() ? '' : d;
}

/* ─── Shareable URLs ───────────────────────────────────────────────────
   A search lives in the URL hash, so a copied link (or Back/Forward) brings it back, e.g.
   #near=Irvine%2C+CA&lat=33.6846&lng=-117.8265&q=ABA&type=therapy&mi=25&view=list&r=n1234567890
   near/lat/lng = the place, q = keyword, type = category, mi = radius ("any" = no limit, 10 when
   absent), view=list = the phone list view, r = an open listing. A hash without lat/lng (like
   "#donate") isn't a search. "Use my location" searches put only 2 decimals (about 1 km) in the URL,
   so a shared link never gives away someone's exact address. */
function readHash() {
  const p = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const lat = parseFloat(p.get('lat')), lng = parseFloat(p.get('lng'));
  const coords = Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? { lat, lng } : null;
  const mi = p.get('mi');
  const type = p.get('type') || '';
  const rid = p.get('r') || '';
  return {
    coords,
    near: (p.get('near') || '').slice(0, 120),
    q: (p.get('q') || '').slice(0, 120),
    type: CATEGORIES.some(c => c.toLowerCase() === type) ? type : '',
    radius: mi === 'any' ? null : DIST_OPTIONS.some(([, m]) => m != null && String(m) === mi) ? Number(mi) : DEFAULT_RADIUS,
    view: p.get('view') === 'list' ? 'full' : 'peek',
    rid: LISTING_ID_RE.test(rid) ? rid : '',
  };
}
const SHARED_LOCATION = 'Shared location';
function buildHash({coords, near, q, type, radius, view, rid, coarse}) {
  if (!coords) return '';
  const num = v => String(Number(v.toFixed(coarse ? 2 : 4)));
  const p = new URLSearchParams();
  if (near && near !== 'My Location' && near !== SHARED_LOCATION) p.set('near', near);
  p.set('lat', num(coords.lat)); p.set('lng', num(coords.lng));
  if (q && q.trim()) p.set('q', q.trim());
  if (type) p.set('type', type);
  if (radius !== DEFAULT_RADIUS) p.set('mi', radius == null ? 'any' : String(radius));
  if (view === 'full') p.set('view', 'list');
  if (rid) p.set('r', rid);
  return '#' + p.toString();
}
// A link that opens this listing: the current search plus r=<id>, or, with no search open, the
// listing's own coordinates. Null for a placeless listing with no search to anchor it.
function listingLink(r) {
  const p = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (!p.get('lat') || !p.get('lng')) {
    if (!r.coordinates) return null;
    ['near','q','type','mi'].forEach(k => p.delete(k));
    p.set('lat', String(Number(r.coordinates.lat.toFixed(4)))); p.set('lng', String(Number(r.coordinates.lng.toFixed(4))));
  }
  p.delete('view'); p.set('r', r.id);
  return window.location.origin + window.location.pathname + '#' + p.toString();
}

/* Shares a listing via the Web Share API where available (mobile browsers, mainly); falls back to
   copying the details plus a link back to the listing. Returns a status rather than a boolean so the
   caller can tell a real failure (blocked clipboard permission, confirmed in QA testing) apart from
   success and from the user simply dismissing the native share sheet. */
function shareDetails(r) {
  const url = listingLink(r);
  const text = [r.name, r.address, r.phone].filter(Boolean).join(' — ');
  return { text, url, copy: url ? `${text}\n${url}` : [text, r.website].filter(Boolean).join(' — ') };
}
async function shareResource(r) {
  const { text, url, copy } = shareDetails(r);
  if (navigator.share) {
    try { await navigator.share({ title: r.name, text, url: url || r.website || undefined }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(copy); return 'copied'; }
    catch (e) {}
  }
  return 'failed';
}

/* The listing's name opens its details. It's a real link to the listing's own URL (so it can be opened
   in a new tab or copied); a plain click opens the details panel in place. The href is refreshed just
   before use, since the search in the URL may have changed after the card rendered. */
const ListingLink = ({r, onOpen, children}) => {
  const fresh = e => { e.currentTarget.href = listingLink(r) || ('#r=' + r.id); };
  return (
    <a href={'#r=' + r.id} className="card-title-link" onMouseDown={fresh} onFocus={fresh}
      onClick={e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; e.preventDefault(); onOpen(r.id); }}>
      {children || r.name}
    </a>
  );
};

// Hovering a pin on the map brings that result into view in the list. The map stays fixed on screen (see MapPanel), so pins
// never move under the cursor while the page scrolls.
function scrollCardIntoView(id) {
  const el = document.querySelector('[data-rid="' + id + '"]');
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.top >= 84 && r.bottom <= window.innerHeight - 8) return;   // already fully visible below the sticky header
  const reduce = document.body.classList.contains('reduce-motion') || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const target = Math.max(0, window.scrollY + r.top - Math.max(84, (window.innerHeight - r.height) / 2));
  const dist = Math.abs(target - window.scrollY);
  const ms = reduce ? 0 : Math.min(600, 320 + dist * 0.22);   // gentle ease-in-out; longer for longer jumps
  if (!ms) { window.scrollTo(0, target); return; }
  const from = window.scrollY, t0 = performance.now();
  const step = (t) => {
    const p = Math.min(1, (t - t0) / ms);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    window.scrollTo(0, from + (target - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function boundsAround(center, miles){
  const dLat = miles/69;
  const dLng = miles/(69*Math.max(0.2, Math.cos(center.lat*Math.PI/180)));
  const b = new google.maps.LatLngBounds();
  b.extend({ lat: center.lat+dLat, lng: center.lng+dLng });
  b.extend({ lat: center.lat-dLat, lng: center.lng-dLng });
  return b;
}
