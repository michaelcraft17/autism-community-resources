const PER_PAGE = 10;

/* ─── Pager ──────────────────────────────────────────────────── */
const Pager = ({page, totalPages, setPage}) => {
  const [jump, setJump] = useState('');
  const rootRef = useRef(null);
  const [announce, setAnnounce] = useState('');
  const submitJump = () => { const n = parseInt(jump, 10); if (!isNaN(n)) { go(n - 1); setJump(''); } };
  // On the mobile map-first layout the list scrolls inside its own container (the shell
  // itself doesn't scroll), so `window.scrollTo` was a no-op there and paging left the list
  // scrolled to wherever it happened to be -- often the bottom, right after the pager that was
  // just clicked. `closest('[data-scroll-root]')` finds that container when it exists; on
  // desktop, where the whole page scrolls, nothing matches it and this falls back to window.
  const go = p => {
    const next = Math.max(0, Math.min(totalPages - 1, p));
    setPage(next);
    const root = rootRef.current && rootRef.current.closest('[data-scroll-root]');
    if (root) root.scrollTo({top: 0, behavior: 'smooth'});
    else window.scrollTo({top: 0, behavior: 'smooth'});
    setAnnounce(`Showing page ${next + 1} of ${totalPages}`);
  };
  // Build a windowed list of page numbers with ellipses for large ranges
  const nums = [];
  const push = n => nums.push(n);
  const around = 1;
  for (let i = 0; i < totalPages; i++) {
    if (i === 0 || i === totalPages - 1 || (i >= page - around && i <= page + around)) push(i);
    else if (nums[nums.length - 1] !== '…') push('…');
  }
  const btn = (active, disabled) => ({
    minWidth:36, height:36, padding:'0 10px', borderRadius:'var(--r-sm)',
    border: active ? '2px solid var(--brand)' : '1px solid var(--border)',
    background: active ? 'var(--brand-subtle)' : 'var(--surface)',
    color: active ? 'var(--text)' : (disabled ? 'var(--text-muted)' : 'var(--text-secondary)'),
    fontFamily:'var(--font-sans)', fontSize:'var(--fs-sm)', fontWeight: active ? 700 : 500,
    cursor: disabled ? 'default' : 'pointer', opacity: disabled ? .5 : 1,
  });
  return (
    <div ref={rootRef} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,flexWrap:'wrap',marginTop:28,paddingTop:20,borderTop:'1px solid var(--divider)'}}>
      <div aria-live="polite" className="sr-only">{announce}</div>
      <button onClick={()=>go(page-1)} disabled={page===0} style={btn(false, page===0)}>‹ Prev</button>
      {nums.map((n,i)=> n === '…'
        ? <span key={'e'+i} style={{padding:'0 4px',color:'var(--text-muted)'}}>…</span>
        : <button key={n} onClick={()=>go(n)} style={btn(n===page, false)}>{n+1}</button>
      )}
      <button onClick={()=>go(page+1)} disabled={page===totalPages-1} style={btn(false, page===totalPages-1)}>Next ›</button>
      {/* Jump straight to any page number */}
      <form onSubmit={e=>{ e.preventDefault(); submitJump(); }}
        style={{display:'inline-flex',alignItems:'center',gap:6,marginLeft:10}}>
        <label htmlFor="pager-jump" style={{fontSize:'var(--fs-sm)',color:'var(--text-muted)',whiteSpace:'nowrap'}}>Go to page</label>
        <input id="pager-jump" value={jump} inputMode="numeric" pattern="[0-9]*" placeholder={`1–${totalPages}`} aria-label={`Go to page, 1 to ${totalPages}`}
          onChange={e=>setJump(e.target.value.replace(/\D/g,'').slice(0,String(totalPages).length))}
          onKeyDown={e=>{ if (e.key === 'Enter') { e.preventDefault(); submitJump(); } }}
          style={{width:74,height:36,padding:'0 10px',borderRadius:'var(--r-sm)',border:'1px solid var(--border-strong)',background:'var(--surface)',color:'var(--text)',fontFamily:'var(--font-sans)',fontSize:'var(--fs-sm)',textAlign:'center'}}/>
        <button type="submit" disabled={jump===''} style={{...btn(false, jump===''),fontWeight:600}}>Go</button>
      </form>
    </div>
  );
};

/* ─── Results ────────────────────────────────────────────────── */
function useIsMobile(bp = 640) {
  const [isMobile, setIsMobile] = useState(() => window.matchMedia ? window.matchMedia(`(max-width:${bp}px)`).matches : false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia(`(max-width:${bp}px)`);
    const onChange = e => setIsMobile(e.matches);
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange); };
  }, [bp]);
  return isMobile;
}

/* The mobile map-first layout needs to know exactly how tall the (variable-height, it wraps
   at narrow widths) sticky header is, so the results screen below it can fill the rest of the
   viewport with no page scroll instead of guessing a fixed offset. */
function useHeaderHeight() {
  const [h, setH] = useState(0);
  useEffect(() => {
    const measure = () => {
      const el = document.querySelector('header');
      if (el) setH(Math.round(el.getBoundingClientRect().bottom));
    };
    measure();
    const el = document.querySelector('header');
    const ro = window.ResizeObserver && el ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);
  return h;
}

/* The selected result, docked inside the collapsed ("peek") list sheet, Google/Apple Maps style,
   rather than floating over the map above a mostly-empty peek strip. It's always present while
   the map is showing -- not only after a pin tap -- because Google Maps markers aren't focusable
   DOM elements: Prev/Next are the keyboard/screen-reader (and non-drag) way to move through every
   result on the map. Its height is held steady (the name reserves two lines, the actions row
   reserves its height) so stepping between results doesn't make the whole sheet jump. */
const MobilePinPreview = ({group, idx, total, onPrev, onNext, onOpen}) => {
  const first = group[0];
  const t = TYPE_META[first.type] || TYPE_META.general_support;
  const many = group.length > 1;
  const name = many ? (first.facility_name || `${group.length} Resources at This Address`) : first.name;
  // A live region announces the actual new selection on every change; the Prev/Next buttons keep
  // plain, stable names (a position baked into them is stale the instant you press one).
  const announceRef = useRef(null);
  useEffect(() => {
    if (announceRef.current) announceRef.current.textContent = `${idx + 1} of ${total}: ${name}`;
  }, [idx, total, name]);
  const navBtn = {borderRadius:'50%',border:'1px solid var(--border-strong)',background:'var(--surface)',color:'var(--text)',fontSize:'var(--fs-lg)',lineHeight:1,cursor:'pointer'};
  return (
    <div role="region" aria-label={`Selected result, ${idx + 1} of ${total}`} style={{margin:'0 12px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-md)',padding:12,display:'flex',gap:10,alignItems:'flex-start',background:'var(--surface)'}}>
      <div ref={announceRef} aria-live="polite" className="sr-only"/>
      <CardThumb fg={t.fg} badge={idx + 1} badgeBg="var(--pin-fill)" badgeColor="var(--pin-fill-on)" grid={!many} size={56}/>
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:3}}>
        <h3 style={{...CARD_TITLE,fontSize:'var(--fs-md)',minHeight:'2.5em',...CLAMP(2)}}>{many ? name : <ListingLink r={first} onOpen={onOpen}/>}</h3>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',fontSize:'var(--fs-xs)',fontWeight:600,color:'var(--text)'}}>
          <TypePill type={first.type} small/>
          {first.distance != null && <span>{first.distance.toFixed(1)} mi</span>}
          {total > 1 && <span style={{color:'var(--text-muted)'}}>· {idx + 1} of {total}</span>}
        </div>
        <div style={{display:'flex',gap:6,marginTop:4,minHeight:40}}>
          <CallLink r={first}/>
          <WebsiteLink r={first}/>
        </div>
      </div>
      {total > 1 && (
        <div style={{display:'flex',gap:6,flexShrink:0}}>
          <button type="button" onClick={onPrev} aria-label="Previous result" className="card-icon-btn" style={navBtn}>‹</button>
          <button type="button" onClick={onNext} aria-label="Next result" className="card-icon-btn" style={navBtn}>›</button>
        </div>
      )}
    </div>
  );
};

/* No-results equivalent of MobilePinPreview, docked in the same spot in the collapsed sheet so a
   "0 resources" search isn't silently invisible in map view. */
const MobileNoResults = () => (
  <div role="region" aria-label="No results" style={{margin:'0 12px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-md)',padding:16,textAlign:'center',color:'var(--text-muted)'}}>
    <div style={{fontSize:'var(--fs-md)',fontWeight:700,color:'var(--text)'}}>No results found</div>
    <div style={{fontSize:'var(--fs-sm)',marginTop:4}}>Try widening the distance or clearing filters</div>
  </div>
);

/* ─── Mobile map-first results layout (<=640px) ──────────────────
   Chosen over "map below the list" (the old layout, confirmed unreachable in practice -- it sat
   ~2,860px down the page on a phone): the map fills the screen behind a draggable sheet holding
   the list, Airbnb/Google-style.
   The sheet's header row is the single map<->list control: a real button (tap, Enter or Space
   toggles -- the WCAG 2.5.7 non-drag path, always in normal tab order) that can also be dragged.
   It replaces the separate "List"/"Map" button that used to sit in the filter bar and did the
   same thing, and it carries the result count, so there's no separate count heading above the
   map either.
   Collapsed ("peek"), the sheet shows that header plus the selected result and is exactly as tall
   as that content (measured), instead of a fixed-height strip that was mostly blank. The map is
   sized to stop at the collapsed sheet's top edge, so pins, fit-to-results framing and Google's
   own controls are never hidden under it.
   The shell fills 100% of its parent -- a fixed-position wrapper in Results sized to exactly the
   viewport height minus the real (measured) header height -- so the page itself never scrolls. */
const SHEET_PEEK_DEFAULT = 200; // first-paint estimate, replaced by the measured height

const MobileMapSheet = ({groups, listContent, noResults, coords, radius, themeKey, contrast, activeId, setActiveId, sheetState, setSheetState, heading, subheading, reduceMotion, onOpen}) => {
  const shellRef = useRef(null);
  const [shellH, setShellH] = useState(0);
  const [measured, setMeasured] = useState(false);
  // useLayoutEffect (not useEffect) so the very first paint already has a real height -- with
  // shellH's 0 default the sheet would briefly render fully covering the map and then slide.
  useLayoutEffect(() => {
    const measure = () => { if (shellRef.current) { setShellH(shellRef.current.clientHeight); setMeasured(true); } };
    measure();
    const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
    if (ro && shellRef.current) ro.observe(shellRef.current);
    window.addEventListener('resize', measure);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);

  // Collapsed height = header + docked result card, measured (it differs for the no-results card,
  // larger text-size settings, etc.). Only measured while collapsed: in list view the card isn't
  // rendered, so the last collapsed height is kept for the trip back down.
  const peekRef = useRef(null);
  const [peekH, setPeekH] = useState(SHEET_PEEK_DEFAULT);
  useLayoutEffect(() => {
    if (sheetState !== 'peek' || !peekRef.current) return;
    const el = peekRef.current;
    const measure = () => setPeekH(Math.ceil(el.getBoundingClientRect().height));
    measure();
    const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(el);
    return () => { if (ro) ro.disconnect(); };
  }, [sheetState]);

  const [dragOffset, setDragOffset] = useState(null);
  const dragStartY = useRef(0);
  const dragStartOffset = useRef(0);
  const movedRef = useRef(false);
  const maxOffset = Math.max(0, shellH - peekH);
  const restOffset = sheetState === 'full' ? 0 : maxOffset;
  const offset = dragOffset != null ? dragOffset : restOffset;
  const full = sheetState === 'full';

  // One control, two ways to use it: a drag (past a small threshold) snaps to whichever state is
  // nearer on release; anything else is a plain click -- tap, Enter or Space -- which toggles.
  // The click the browser fires right after a real drag is swallowed so it can't toggle back.
  const onHeaderPointerDown = e => {
    if (e.button != null && e.button !== 0) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    movedRef.current = false;
    dragStartY.current = e.clientY;
    dragStartOffset.current = offset;
    setDragOffset(offset);
  };
  const onHeaderPointerMove = e => {
    if (dragOffset == null) return;
    const dy = e.clientY - dragStartY.current;
    if (!movedRef.current && Math.abs(dy) < 6) return;
    movedRef.current = true;
    setDragOffset(Math.min(maxOffset, Math.max(0, dragStartOffset.current + dy)));
  };
  const onHeaderPointerUp = () => {
    if (dragOffset == null) return;
    const wasDrag = movedRef.current;
    const next = dragOffset > maxOffset / 2 ? 'peek' : 'full';
    setDragOffset(null);
    if (wasDrag) {
      setSheetState(next);
      setTimeout(() => { movedRef.current = false; }, 0); // after the trailing click, if any
    }
  };
  const onHeaderClick = () => {
    if (movedRef.current) { movedRef.current = false; return; }
    setSheetState(full ? 'peek' : 'full');
  };

  // Pull-to-collapse from the list itself: once the list is scrolled to its top, dragging down
  // (touch) or scrolling up further (wheel / trackpad) brings the sheet down with it, so the
  // handle bar isn't the only way back to the map. The sheet follows the finger and snaps on release.
  const pull = useRef({startY:0, active:false, off:0, wheel:0, wheelT:0});
  const onListTouchStart = e => { pull.current.startY = e.touches[0].clientY; pull.current.active = false; };
  const onListTouchMove = e => {
    const root = e.currentTarget, p = pull.current, dy = e.touches[0].clientY - p.startY;
    if (!p.active) {
      if (root.scrollTop <= 0 && dy > 8) { p.active = true; p.startY = e.touches[0].clientY; }
      else return;
    }
    p.off = Math.min(maxOffset, Math.max(0, e.touches[0].clientY - p.startY));
    setDragOffset(p.off);
  };
  const onListTouchEnd = () => {
    const p = pull.current;
    if (!p.active) return;
    p.active = false;
    setDragOffset(null);
    if (p.off > Math.min(90, maxOffset / 3)) setSheetState('peek');
  };
  const onListWheel = e => {
    const root = e.currentTarget, p = pull.current;
    if (root.scrollTop > 0 || e.deltaY >= 0) { p.wheel = 0; return; }
    const now = Date.now();
    if (now - p.wheelT > 400) p.wheel = 0;   // a new gesture, not a continuation
    p.wheelT = now;
    p.wheel += -e.deltaY;
    if (p.wheel > 120) { p.wheel = 0; setSheetState('peek'); }
  };

  const activeGroupIdx = groups.length ? groups.findIndex(g => g.some(r => r.id === activeId)) : -1;
  // If nothing is selected yet (fresh search, or the previous selection's page no longer
  // exists), select the first result, so the map highlight and the docked card always agree.
  // useLayoutEffect so this resolves before paint, not after a visible flash.
  useLayoutEffect(() => {
    if (groups.length > 0 && activeGroupIdx === -1) setActiveId(groups[0][0].id);
  }, [groups.length, activeGroupIdx]);

  // Expanding to list view used to always land at the top of the results, so stepping to pin
  // 3 or 5 with Prev/Next and then opening the list meant scrolling down by hand to find it.
  // This jumps the list straight to whichever card matches the current selection instead.
  // Measured this two ways before landing here: computing the scroll offset synchronously
  // (in a useLayoutEffect, so it runs before paint) reads the card's position *while the sheet
  // is still mid-slide* from its peek offset to 0 -- transform transitions don't jump straight
  // to their end state, and getBoundingClientRect reports whatever's true at that instant -- so
  // the computed scroll consistently overshot by roughly the slide distance (confirmed: with a
  // ~450px peek offset, landing 1-2 cards further down than the selected one). Waiting for the
  // slide to actually finish before reading the card's real position fixes it.
  useEffect(() => {
    if (!full) return;
    const root = shellRef.current && shellRef.current.querySelector('[data-scroll-root]');
    const card = root && activeId != null && root.querySelector(`[data-rid="${activeId}"]`);
    if (!card) return;
    // Not card.scrollIntoView(): with the card already flush against the top of `root`
    // (scrollTop 0 there satisfies block:'start'), the browser kept walking up the scroll-
    // container chain and also scrolled shellRef -- which is overflow:hidden purely to clip
    // the sliding sheet, never meant to scroll -- dragging the whole sheet (header included)
    // up by the header's own height. That left the header's real screen position overlapped
    // by the filter row above it, so its drag handle couldn't be grabbed or tapped and the
    // sheet got stuck unable to collapse back to the map. Scrolling only `root` by the exact
    // delta sidesteps the ancestor walk entirely.
    const jump = () => { root.scrollTop += card.getBoundingClientRect().top - root.getBoundingClientRect().top; };
    if (reduceMotion) { jump(); return; }
    const ms = parseFloat(getComputedStyle(document.body).getPropertyValue('--dur-base')) || 220;
    const t = setTimeout(jump, ms + 30);
    return () => clearTimeout(t);
  }, [full]);
  const stepPreview = delta => {
    if (!groups.length) return;
    const cur = activeGroupIdx === -1 ? 0 : activeGroupIdx;
    setActiveId(groups[(cur + delta + groups.length) % groups.length][0].id);
  };

  return (
    <div ref={shellRef} style={{position:'relative',height:'100%',overflow:'hidden'}}>
      <MapPanel groups={groups} active={activeId} onHover={setActiveId} center={coords} radiusMi={radius} themeKey={themeKey} contrast={contrast} mobileFull sheetState={sheetState} bottomInset={Math.max(0, peekH - 16)}/>
      <div style={{position:'absolute',left:0,right:0,top:0,bottom:0,zIndex:5,background:'var(--surface)',borderRadius:'var(--r-md) var(--r-md) 0 0',boxShadow:'0 -6px 24px rgba(0,0,0,.18)',display:'flex',flexDirection:'column',
          transform:`translateY(${offset}px)`, transition: (dragOffset == null && measured && !reduceMotion) ? 'transform var(--dur-base) var(--ease-out)' : 'none'}}>
        <h1 id="msheet-heading" className="sr-only">{heading}</h1>
        <div ref={peekRef} style={{flexShrink:0}}>
          <button type="button" onClick={onHeaderClick}
            onPointerDown={onHeaderPointerDown} onPointerMove={onHeaderPointerMove} onPointerUp={onHeaderPointerUp} onPointerCancel={onHeaderPointerUp}
            aria-label={full ? 'Show map' : 'Show list'} aria-expanded={full} aria-controls={full ? 'msheet-list' : undefined} aria-describedby="msheet-heading"
            style={{display:'flex',flexDirection:'column',alignItems:'stretch',gap:6,width:'100%',margin:0,padding:'8px 16px 10px',background:'transparent',border:'none',borderRadius:'var(--r-md) var(--r-md) 0 0',textAlign:'left',color:'var(--text)',font:'inherit',touchAction:'none',cursor:'grab'}}>
            <span aria-hidden="true" style={{alignSelf:'center',width:40,height:4,borderRadius:'var(--r-pill)',background:'var(--border-strong)'}}/>
            <span style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
              <span style={{minWidth:0}}>
                <span style={{display:'block',fontWeight:700,fontSize:'var(--fs-md)',lineHeight:1.25}}>{heading}</span>
                {subheading && <span style={{display:'block',fontSize:'var(--fs-xs)',color:'var(--text-muted)',marginTop:1}}>{subheading}</span>}
              </span>
              <span style={{flexShrink:0,display:'inline-flex',alignItems:'center',gap:6,height:36,padding:'0 14px',borderRadius:'var(--r-pill)',border:'1px solid var(--border-strong)',background:'var(--surface-subtle)',fontSize:'var(--fs-sm)',fontWeight:700}}>
                {full ? <PinIcon s={14}/> : <ListIcon/>} {full ? 'Map' : 'List'}
              </span>
            </span>
          </button>
          {!full && (activeGroupIdx !== -1 || noResults) && (
            <div className="msheet-content-in">
              {activeGroupIdx !== -1
                ? <MobilePinPreview group={groups[activeGroupIdx]} idx={activeGroupIdx} total={groups.length}
                    onPrev={()=>stepPreview(-1)} onNext={()=>stepPreview(1)} onOpen={onOpen}/>
                : <MobileNoResults/>
              }
            </div>
          )}
        </div>
        {full && (
          <div id="msheet-list" data-scroll-root className="msheet-content-in" onTouchStart={onListTouchStart} onTouchMove={onListTouchMove} onTouchEnd={onListTouchEnd} onTouchCancel={onListTouchEnd} onWheel={onListWheel} style={{flex:1,overflowY:'auto',padding:'0 12px 24px',WebkitOverflowScrolling:'touch',overscrollBehaviorY:'contain'}}>
            {listContent}
          </div>
        )}
      </div>
    </div>
  );
};

/* ─── Loading animation: 3D city → 2D map → route → pin (styles: .city-* in <style>) ─── */

const CITY_BUILDINGS = [

// How many "Available nationwide & virtual" listings show at first, and per "Show more".
const NATIONAL_STEP = 20;

/* Category, radius and the phone map/list view live in App (they're part of the shareable URL);
   the radius defaults to DEFAULT_RADIUS (not "Any distance") so "N resources within 10 mi" means
   something from the first search. */
const Results = ({ALL, loadNote, coords, locLabel, keyword, typeFilter, setTypeFilter, radius, setRadius, sheetState, setSheetState, favIds, onFav, onOpen, onHome, themeKey, contrast, onVisibleChange, reduceMotion}) => {
  const [specialty, setSpecialty] = useState('');
  const [sortBy, setSortBy] = useState('distance');
  // Two separate ids, not one: `activeId` is the desktop transient hover highlight (set by
  // mouseenter/mouseleave on a card or a map pin), `selectedId` is the mobile sticky selection
  // (set by tapping a pin or Prev/Next, and meant to persist). QA found the single shared id
  // this used to be got reset to null by unrelated hover-out events -- moving the pointer off a
  // just-tapped pin on mobile, or an in-flight desktop hover ending when resizing crossed the
  // 640px breakpoint and unmounted the hovered card -- silently reverting the mobile selection
  // back to result #1 both times. Kept independent, neither can clobber the other.
  const [activeId, setActiveId] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [page, setPage] = useState(0);
  const [selSug, setSelSug] = useState([]);
  const toggleSug = s => setSelSug(a => a.includes(s) ? a.filter(x=>x!==s) : [...a,s]);
  const isMobile = useIsMobile();
  const headerH = useHeaderHeight();
  const curId = isMobile ? selectedId : activeId;
  const setCurId = isMobile ? setSelectedId : setActiveId;
  // Reset to first page whenever the result set changes
  useEffect(() => { setPage(0); }, [typeFilter, specialty, radius, keyword, coords, selSug, sortBy]);

  const kw = keyword.trim().toLowerCase();
  const matchKwType = r =>
    (!kw
      || r.name.toLowerCase().includes(kw)
      || (r.services||[]).join(' ').toLowerCase().includes(kw)
      || (r.description||'').toLowerCase().includes(kw)
      || (TYPE_META[r.type] ? TYPE_META[r.type].label.toLowerCase().includes(kw) : false)) &&
    (!typeFilter || r.type === typeFilter) &&
    (!specialty || (r.services||[]).includes(specialty));

  const matchSug = r => {
    if (selSug.length === 0) return true;
    const svc = (r.services||[]).join(' ').toLowerCase();
    const sg = r.suggested || {};
    return selSug.every(s => {
      if (s === 'Individual Provider')         return r.entity_type === 'individual';
      if (s === 'Organization / Agency')       return r.entity_type === 'organization';
      if (s === 'Free / Sliding Scale')       return sg.free_services      || /free|sliding scale/.test(svc);
      if (s === 'Telehealth Available')        return sg.telehealth         || /telehealth|virtual|online therapy|video/.test(svc);
      if (s === 'In-home Services')            return sg.in_home            || /in-home|in home|home visit|home-based/.test(svc);
      if (s === 'Accepts Medicaid')            return sg.accepts_medicaid   || /medicaid|medi-cal/.test(svc);
      if (s === 'Early Intervention (0–5)') return sg.early_intervention || /early intervention|early start|0-5|infant|toddler|preschool/.test(svc);
      if (s === 'Bilingual Services')          return sg.bilingual          || /spanish|bilingual|multilingual|arabic|tagalog|mandarin|vietnamese/.test(svc);
      if (s === 'Wheelchair Accessible')       return sg.wheelchair_accessible || /wheelchair|magical bridge|ada accessible/.test(svc);
      return true;
    });
  };

  const loading = !ALL;

  // Located resources (mapped, distance-filtered) vs. placeless nationwide/virtual ones
  // Memoized: this filters, measures and sorts the whole directory (100k+ entries), so it must not re-run when only the
  // hovered/active result changes -- it used to, on every pin or card hover, which was the highlight lag.
  const { filtered, national } = useMemo(() => {
    const local = loading ? [] : ALL.filter(r => !r.placeless).map(r => ({...r, distance: coords ? haversine(coords, r.coordinates) : null}));
    if (sortBy === 'name') local.sort((a,b)=>a.name.localeCompare(b.name));
    else if (coords) local.sort((a,b)=>(a.distance ?? 1e9)-(b.distance ?? 1e9));
    return {
      filtered: local.filter(r => matchKwType(r) && matchSug(r) && (radius == null || (r.distance != null && r.distance <= radius))),
      national: loading ? [] : ALL.filter(r => r.placeless && matchKwType(r) && matchSug(r)),
    };
  }, [ALL, coords, sortBy, kw, typeFilter, specialty, selSug, radius]);
  // Nationwide & virtual listings come only from the regions this search loaded, and show 20 at a time.
  const [natShown, setNatShown] = useState(NATIONAL_STEP);
  useEffect(() => { setNatShown(NATIONAL_STEP); }, [national]);
  // "Show more" moves keyboard focus to the first newly shown listing, so focus isn't lost
  // when the button disappears after the last batch.
  const natListRef = useRef(null), natFocusIdx = useRef(null);
  const showMoreNational = () => { natFocusIdx.current = natShown; setNatShown(n => n + NATIONAL_STEP); };
  useEffect(() => {
    if (natFocusIdx.current == null || !natListRef.current) return;
    const link = natListRef.current.querySelectorAll('.card-title-link')[natFocusIdx.current];
    natFocusIdx.current = null;
    link && link.focus();
  }, [natShown]);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  const safePage = Math.min(page, totalPages - 1);
  const start = safePage * PER_PAGE;
  const shown = useMemo(() => filtered.slice(start, start + PER_PAGE), [filtered, start]);
  const onLastPage = safePage >= totalPages - 1;

  // Multiple providers at the exact same address (e.g. several doctors inside
  // one medical center) collapse into a single card + a single map pin.
  const groups = useMemo(() => {
    const groupMap = new Map(), out = [];
    shown.forEach(r => {
      const key = normalizeAddress(r.address);
      if (!groupMap.has(key)) { const arr = []; groupMap.set(key, arr); out.push(arr); }
      groupMap.get(key).push(r);
    });
    return out;
  }, [shown]);
  const groupsKey = groups.map(g=>g.map(r=>r.id).join('+')).join(',');

  useEffect(() => {
    if (!onVisibleChange) return;
    onVisibleChange(groups.map(g => {
      const first = g[0];
      const t = TYPE_META[first.type] || TYPE_META.general_support;
      return {
        label: g.length > 1 ? (first.facility_name || `${g.length} resources at this address`) : first.name,
        type: t.label,
        address: first.address,
        description: g.length > 1 ? `${g.length} providers at this location` : cleanDescription(first),
      };
    }));
  }, [groupsKey, onVisibleChange]);

  if (loading) {
    return (
      <div style={{maxWidth:2400,margin:'0 auto',padding:'96px 24px',textAlign:'center',color:'var(--text-muted)'}}>
        <CityLoader note={loadNote}/>
      </div>
    );
  }

  const noResults = shown.length === 0 && national.length === 0;
  const listContent = noResults ? (
    <div style={{textAlign:'center',padding:'64px 0',color:'var(--text-muted)'}}>
      <div style={{fontSize:'var(--fs-2xl)',marginBottom:10}} aria-hidden="true">🔍</div>
      <div style={{fontSize:'var(--fs-lg)',fontWeight:700,color:'var(--text)'}}>No results found</div>
      <div style={{fontSize:'var(--fs-sm)',marginTop:6}}>Try widening the distance or clearing filters</div>
    </div>
  ) : (
    <React.Fragment>
      {groups.map((g,i)=>(
        g.length > 1
          ? <GroupedResourceCard key={'g'+g[0].id} group={g} idx={i} active={g.some(x=>x.id===curId)} onHover={setCurId} onOpen={onOpen} compact={isMobile}/>
          : <ResourceCard key={g[0].id} r={g[0]} idx={i} fav={favIds.has(g[0].id)} onFav={onFav} active={curId===g[0].id} onHover={setCurId} onOpen={onOpen} compact={isMobile}/>
      ))}
      {totalPages > 1 && (
        <Pager page={safePage} totalPages={totalPages} setPage={setPage}/>
      )}
      {onLastPage && national.length > 0 && (
        <section ref={natListRef} aria-labelledby="national-heading" style={{marginTop:24,borderTop:'1px solid var(--divider)',paddingTop:18}}>
          <h3 id="national-heading" style={{fontSize:'var(--fs-md)',fontWeight:700,color:'var(--text)',margin:'0 0 4px'}}>Available nationwide &amp; virtual</h3>
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text-muted)',margin:'0 0 14px'}}>{national.length.toLocaleString()} service{national.length!==1?'s':''} with no fixed location that you can reach from anywhere{national.length > natShown ? ` — showing ${natShown.toLocaleString()}` : ''}.</p>
          {national.slice(0, natShown).map((r,i)=>(
            <ResourceCard key={r.id} r={r} idx={filtered.length+i} fav={favIds.has(r.id)} onFav={onFav} active={curId===r.id} onHover={setCurId} onOpen={onOpen} compact={isMobile}/>
          ))}
          {national.length > natShown && (
            <button type="button" className="btn-secondary" style={{marginTop:14}} onClick={showMoreNational}>
              Show {Math.min(NATIONAL_STEP, national.length - natShown)} more ({(national.length - natShown).toLocaleString()} left)
            </button>
          )}
        </section>
      )}
      {isMobile && <UrgentNote style={{marginTop:20}}/>}
    </React.Fragment>
  );

  // One FilterBar now, used identically on mobile and desktop -- it no longer carries the
  // count/sort summary (that moved to its own row, `resultsSummary` below) or a keyword box
  // (that's the header's job now), so there's nothing left that needs to differ by size.
  const filterBar = (
    <FilterBar resultCount={filtered.length} typeFilter={typeFilter} setTypeFilter={setTypeFilter} specialty={specialty} setSpecialty={setSpecialty} radius={radius} setRadius={setRadius} selSug={selSug} toggleSug={toggleSug} clearSug={()=>setSelSug([])} compact={isMobile}/>
  );
  // Desktop-only summary row: left-aligned count/location line plus a sort control, replacing
  // the old right-aligned, un-comma-formatted heading crammed into the end of the filter bar.
  const resultsSummary = (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,margin:'14px 0 10px'}}>
      <div>
        {/* The page's one h1, like the big directories' "Autism therapists in Irvine, CA". */}
        <h1 style={{margin:0,fontFamily:'var(--font-sans)',fontSize:'var(--fs-md)',fontWeight:700,lineHeight:1.4,color:'var(--text)'}}>
          {filtered.length.toLocaleString()} resource{filtered.length!==1?'s':''}{radius!=null?` within ${radius} mi of ${locLabel}`:` near ${locLabel}`}
        </h1>
        {filtered.length > 0 && <div style={{fontSize:'var(--fs-xs)',color:'var(--text-muted)',marginTop:2}}>Showing {start+1}–{start+shown.length}</div>}
        <UrgentNote style={{marginTop:4}}/>
      </div>
      {coords && (
        <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'var(--fs-sm)',color:'var(--text-secondary)',flexShrink:0}}>
          Sort:
          <span className="sortsel-wrap">
            <select className="sortsel" value={sortBy} onChange={e=>setSortBy(e.target.value)} aria-label="Sort results by">
              <option value="distance">Nearest</option>
              <option value="name">Name (A–Z)</option>
            </select>
            <span className="sortsel-chevron" aria-hidden="true"><ChevronDownIcon s={13}/></span>
          </span>
        </label>
      )}
    </div>
  );
  const sheetHeading = `${filtered.length.toLocaleString()} resource${filtered.length!==1?'s':''}${radius!=null?` within ${radius} mi`:''} near ${locLabel}`;
  const sheetSubheading = `${coords ? 'Sorted by distance' : 'Browse all'}${filtered.length > 0 ? ` · showing ${start + 1}–${start + shown.length}` : ''}`;

  // Mobile: a fixed, viewport-filling column (header height to the bottom of the screen, no
  // page scroll at all) rather than normal document flow. Previously this content sat in
  // ordinary flow below the header, so the shell's own `calc(100vh - 92px)` sizing assumed a
  // roughly fixed header height -- wrong as soon as the header wrapped to more lines (measured
  // at 137px in QA, not ~76px), leaving the shell taller than the space actually available and
  // the whole page scrolling underneath it, with the sheet handle and pager ending up below the
  // fold. Sizing this wrapper from the header's real, measured height and letting the map shell
  // be the only flexible (flex:1) piece removes page scroll entirely: everything either fits in
  // its own fixed-height row above the shell, or scrolls inside the shell's own sheet.
  if (isMobile) {
    return (
      <div style={{position:'fixed',top:headerH,left:0,right:0,bottom:0,zIndex:100,display:'flex',flexDirection:'column',background:'var(--bg)',overflow:'hidden'}}>
        <div style={{padding:'10px 16px',flexShrink:0}}>{filterBar}</div>
        <div style={{flex:'1 1 auto',minHeight:0}}>
          <MobileMapSheet groups={groups} listContent={listContent} noResults={noResults} coords={coords} radius={radius} themeKey={themeKey} contrast={contrast}
            activeId={curId} setActiveId={setCurId} sheetState={sheetState} setSheetState={setSheetState} heading={sheetHeading} subheading={sheetSubheading} reduceMotion={reduceMotion} onOpen={onOpen}/>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:2400,margin:'0 auto',padding:'12px 24px 48px'}}>
      <div style={{fontSize:'var(--fs-sm)',color:'var(--text-muted)',marginBottom:6,display:'flex',alignItems:'center',flexWrap:'wrap',gap:6}}>
        {/* A real breadcrumb: the first step goes home; the last is where you are. */}
        <nav aria-label="Breadcrumb">
          <ol style={{listStyle:'none',margin:0,padding:0,display:'flex',alignItems:'center',flexWrap:'wrap',gap:6}}>
            <li><a href="./" onClick={e=>{ if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); onHome(); }} style={{color:'var(--text-link)',textDecoration:'underline'}}>Community Resources</a></li>
            <li aria-hidden="true">›</li>
            <li aria-current="page" style={{color:'var(--text-secondary)',fontWeight:600}}>{locLabel}</li>
          </ol>
        </nav>
        <span style={{marginLeft:'auto'}}>Questions or feedback? <a href={`mailto:${CONTACT_EMAIL}`} style={{color:'var(--text-link)',fontWeight:600,textDecoration:'underline'}}>{CONTACT_EMAIL}</a></span>
      </div>
      {filterBar}
      {resultsSummary}
      <div style={{display:'flex',gap:20,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div style={{flex:'3 1 480px',minWidth:320}}>{listContent}</div>
        <div style={{flex:'2 1 400px',minWidth:340,alignSelf:'stretch',minHeight:'calc(100vh - 92px)',display:'flex',flexDirection:'column'}}>
          <MapPanel groups={groups} active={curId} onHover={setCurId} center={coords} radiusMi={radius} themeKey={themeKey} contrast={contrast}/>
        </div>
      </div>
    </div>
  );
};

/* ─── App ────────────────────────────────────────────────────── */
function App() {
  const manifest = useManifest();
  const [prefs, setPrefs] = useState(loadPrefs);
  const [systemDark, setSystemDark] = useState(() => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const [systemReducedMotion, setSystemReducedMotion] = useState(() => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const [a11yOpen, setA11yOpenRaw] = useState(false);
  const [savedOpen, setSavedOpen] = useState(false);
  const [suggestOpen, setSuggestOpen] = useState(false);
  // Only one drawer at a time: opening the accessibility menu closes Saved, and vice versa.
  const setA11yOpen = v => { setA11yOpenRaw(v); setSavedOpen(false); };
  const toggleSaved = () => { setSavedOpen(o => !o); setA11yOpenRaw(false); };
  // Everything in the shareable URL starts from the hash, so opening a link restores that search.
  const [initial] = useState(readHash);
  const [screen, setScreen] = useState(initial.coords ? 'results' : 'landing');
  const [coords, setCoords] = useState(initial.coords);
  const [locLabel, setLocLabel] = useState(initial.coords ? (initial.near || SHARED_LOCATION) : '');
  const [keyword, setKeyword] = useState(initial.q);
  const [typeFilter, setTypeFilter] = useState(initial.type);
  const [radius, setRadius] = useState(initial.radius);
  const [sheetView, setSheetViewRaw] = useState(initial.view);   // phone map ('peek') / list ('full')
  const [detailId, setDetailId] = useState(initial.coords && initial.rid ? initial.rid : null);
  const [favs, setFavs] = useState(loadFavs);
  const [readableList, setReadableList] = useState([]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  // The mobile results screen is a fixed, viewport-filling panel painted above everything else
  // in normal flow, including the footer right below the header in the (now practically empty)
  // document flow -- so the footer sits completely hidden behind it, but, without this, stayed
  // a real focusable/AT-visible target a keyboard user could Tab straight into with no visible
  // focus indicator anywhere on screen. Same fix as the mobile-map-in-list-view case.
  const isMobileApp = useIsMobile();
  const footerRef = useRef(null);
  const hideFooter = screen === 'results' && isMobileApp;
  useEffect(() => {
    if (!footerRef.current) return;
    footerRef.current.inert = hideFooter;
    footerRef.current.setAttribute('aria-hidden', hideFooter ? 'true' : 'false');
  }, [hideFooter]);

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = e => setSystemDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange); };
  }, []);

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    const onChange = e => setSystemReducedMotion(e.matches);
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange); };
  }, []);

  const isDark = prefs.theme === 'system' ? systemDark : prefs.theme === 'dark';
  // Combines the existing "Pause Animations" a11y-panel toggle (prefs.motion) with the OS-level
  // preference, so decorative animation is skipped by either signal.
  const reduceMotion = prefs.motion === 'reduce' || systemReducedMotion;

  useEffect(() => {
    const b = document.body.classList;
    const h = document.documentElement;
    b.toggle('dark', isDark);
    b.toggle('dyslexic', prefs.typeface === 'dyslexic');
    b.toggle('legible', prefs.typeface === 'legible');
    b.toggle('scheme-blue', prefs.colorScheme === 'blue');
    ['dark','light'].forEach(c => b.toggle('contrast-' + c, prefs.contrast === c));
    b.toggle('reduce-motion', prefs.motion === 'reduce');
    ['small','large','largest','huge','giant'].forEach(sz => b.toggle('text-' + sz, prefs.textSize === sz));
    b.toggle('hl-links', prefs.links === 'on');
    b.toggle('hide-images', prefs.hideImages === 'on');
    ['1','2','3'].forEach(n => { b.toggle('sp-' + n, prefs.spacing === n); b.toggle('lh-' + n, prefs.lineHeight === n); });
    ['left','right','center','justify'].forEach(a => b.toggle('ta-' + a, prefs.textAlign === a));
    b.toggle('cursor-black', prefs.cursor === 'black');
    // Invert + saturation are page-wide filters; they must live on <html> (a filter on <body> would break position:fixed).
    const invert = prefs.contrast === 'invert';
    h.classList.toggle('a11y-invert', invert);
    const sat = { low:'saturate(.5)', high:'saturate(2)', mono:'grayscale(1)' }[prefs.saturation];
    h.style.filter = [invert && 'invert(1) hue-rotate(180deg)', sat].filter(Boolean).join(' ');
    savePrefs(prefs);
  }, [prefs, isDark]);

  useTooltips(prefs.tooltips === 'on');

  // Ctrl+U toggles the accessibility menu (same shortcut as the UserWay menu on stanfordnnea.com).
  useEffect(() => {
    const onKey = e => {
      if (e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'u') { e.preventDefault(); setA11yOpen(o => !o); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => { saveFavs(favs); }, [favs]);

  // Saved items from before stable ids were numbers; swap them for snapshots once the manifest is in.
  useEffect(() => {
    const nums = favs.filter(f => typeof f === 'number');
    if (!manifest || !manifest.files.length || !nums.length) return;
    let dead = false;
    migrateLegacyFavs(nums, manifest).then(found => {
      if (dead) return;
      setFavs(cur => {
        const seen = new Set();
        return cur.map(f => typeof f === 'number' ? found.get(f) : f)
          .filter(f => f && !seen.has(f.id) && seen.add(f.id));
      });
    });
    return () => { dead = true; };
  }, [manifest]);
  const favIds = useMemo(() => new Set(favs.filter(f => f && typeof f === 'object').map(f => f.id)), [favs]);
  const toggleFav = r => setFavs(f => f.some(x => x && x.id === r.id) ? f.filter(x => !(x && x.id === r.id)) : [...f, favSnapshot(r)]);

  const themeKey = `${prefs.colorScheme}-${isDark ? 'dark' : 'light'}`;

  // The listings this search needs (only the regions around it); null while they load.
  const listings = useSearchListings(manifest, coords, radius, screen === 'results');
  const ALL = listings.list;
  const loadNote = listings.total > 3 ? `Loaded ${listings.loaded} of ${listings.total} regions…` : '';

  /* URL <-> state. A new search, the phone map/list switch and opening a listing add a history entry
     (so Back undoes each); filter and keyword edits only update the current entry. */
  const pushNext = useRef(false);
  const coarseCoords = useRef(false);   // "Use my location": 2 decimals in the URL
  const detailEntry = useRef(false);    // the open listing has its own history entry (close = Back)
  const coordsRef = useRef(coords); coordsRef.current = coords;
  useEffect(() => {
    if (screen !== 'results' || !coords) { pushNext.current = false; return; }
    const h = buildHash({coords, near: locLabel, q: keyword, type: typeFilter, radius, view: sheetView, rid: detailId, coarse: coarseCoords.current});
    if (h !== window.location.hash) history[pushNext.current ? 'pushState' : 'replaceState'](null, '', h);
    pushNext.current = false;
  }, [screen, coords, locLabel, keyword, typeFilter, radius, sheetView, detailId]);
  // Back / Forward / an edited or followed link: apply whatever the hash now says.
  useEffect(() => {
    const near = (a, b) => a && b && Math.abs(a.lat - b.lat) < 0.006 && Math.abs(a.lng - b.lng) < 0.006;
    const onNav = () => {
      const h = readHash();
      detailEntry.current = !!h.rid;
      if (!h.coords) { setScreen('landing'); setDetailId(null); return; }   // not a search: landing (or "#donate")
      const same = near(coordsRef.current, h.coords);
      setCoords(c => same ? c : h.coords);
      setLocLabel(l => h.near || (same ? l : SHARED_LOCATION));
      setKeyword(h.q); setTypeFilter(h.type); setRadius(h.radius); setSheetViewRaw(h.view);
      setDetailId(h.rid || null);
      setScreen('results'); setError('');
    };
    window.addEventListener('popstate', onNav);
    window.addEventListener('hashchange', onNav);
    return () => { window.removeEventListener('popstate', onNav); window.removeEventListener('hashchange', onNav); };
  }, []);
  // A link with only a place name (#near=Irvine, CA) is looked up once.
  useEffect(() => { if (!initial.coords && initial.near) searchLocation(initial.near, initial.q); }, []);

  const setSheetView = next => { if (next !== sheetView) { pushNext.current = true; setSheetViewRaw(next); } };
  const openDetail = id => {
    if (id === detailId) return;
    if (screen === 'results') { pushNext.current = true; detailEntry.current = true; }
    setDetailId(id);
  };
  const closeDetail = () => {
    if (screen === 'results' && detailEntry.current && readHash().rid) { history.back(); return; }
    detailEntry.current = false;
    setDetailId(null);
  };
  const detail = useMemo(() => {
    if (!detailId) return null;
    const r = (ALL && ALL.find(x => x.id === detailId)) || favs.find(f => f && f.id === detailId) || null;
    return { r, status: r ? 'ok' : (screen === 'results' && !ALL ? 'loading' : 'missing') };
  }, [detailId, ALL, favs, screen]);

  const goLanding = () => {
    if (window.location.hash) history.pushState(null, '', window.location.pathname + window.location.search);
    setScreen('landing'); setDetailId(null); setError('');
  };

  // Donate only has a real target (#donate-section) on the landing page. From results, jumping
  // straight to "#donate" used to do nothing visible -- confirmed in QA -- so this navigates to
  // landing first and scrolls once it's actually painted (double rAF: one for the state update's
  // render, one for layout to settle) rather than racing a fixed setTimeout.
  const pendingDonateScroll = useRef(false);
  const scrollToDonate = () => {
    document.getElementById('donate-section')?.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth'});
  };
  const goDonate = () => {
    window.location.hash = 'donate';
    if (screen !== 'landing') { pendingDonateScroll.current = true; setScreen('landing'); }
    else scrollToDonate();
  };
  useEffect(() => {
    if (screen === 'landing' && pendingDonateScroll.current) {
      pendingDonateScroll.current = false;
      requestAnimationFrame(() => requestAnimationFrame(scrollToDonate));
    }
  }, [screen]);

  const round4 = v => Number(v.toFixed(4));
  const startSearch = (c, label, kw, coarse) => {
    pushNext.current = true; coarseCoords.current = !!coarse; detailEntry.current = false;
    setCoords(c); setLocLabel(label); setKeyword(kw); setDetailId(null); setScreen('results'); setError('');
  };
  // From the landing page a search starts fresh; from the results header it keeps the filters.
  const resetFilters = () => { setTypeFilter(''); setRadius(DEFAULT_RADIUS); setSheetViewRaw('peek'); };

  const searchLocation = async (text, kw = '') => {
    setBusy(true); setError('');
    try {
      const c = await geocode(text);
      if (!c) { setError('Couldn’t find that location. Try a city, ZIP code, or full address.'); setBusy(false); return; }
      saveLastLoc(text);
      startSearch({ lat: round4(c.lat), lng: round4(c.lng) }, text, kw, false);
    } catch (e) { setError('Search failed — please try again.'); }
    setBusy(false);
  };

  // Picking a suggestion from the autocomplete dropdown already carries real coordinates,
  // so this skips a redundant geocode() round-trip (and its false-match risk) entirely.
  const selectSuggestion = (s, kw = '') => {
    const {main, secondary} = formatSuggestion(s);
    const label = secondary ? `${main}, ${secondary}` : main;
    saveLastLoc(label);
    startSearch({ lat: round4(parseFloat(s.lat)), lng: round4(parseFloat(s.lon)) }, label, kw, false);
  };

  const useMyLocation = (kw = '') => {
    if (!navigator.geolocation) { setError('Geolocation isn’t supported by your browser.'); return; }
    setBusy(true); setError('');
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lng } = pos.coords;
        startSearch({lat, lng}, 'My Location', kw, true); setBusy(false);
        // Best-effort upgrade from the placeholder label to an actual place name ("San Jose, CA")
        // once it resolves -- results are already shown by coordinates, so this never blocks them.
        const resolved = await reverseGeocode(lat, lng);
        if (resolved) { setLocLabel(resolved); saveLastLoc(resolved); }
      },
      err => { setError(err.code===1 ? 'Location permission denied — enter a location instead.' : 'Couldn’t get your location.'); setBusy(false); },
      { enableHighAccuracy:true, timeout:10000 }
    );
  };

  return (
    <>
    <div className="app-zoom">
      <Header a11yOpen={a11yOpen} setA11yOpen={setA11yOpen} savedOpen={savedOpen} savedCount={favs.length} onToggleSaved={toggleSaved} onSuggest={() => setSuggestOpen(true)} onDonate={goDonate} locLabel={locLabel} onLogoClick={goLanding} onSearchLocation={searchLocation} onSelectSuggestion={selectSuggestion} onUseMyLocation={useMyLocation} locBusy={busy} locError={error} showSearch={screen==='results'} keyword={keyword} setKeyword={setKeyword}/>
      <main>{screen==='landing'
        ? <Landing onSearch={(t, kw) => { resetFilters(); searchLocation(t, kw); }} onSelectSuggestion={(s, kw) => { resetFilters(); selectSuggestion(s, kw); }} onLocate={kw => { resetFilters(); useMyLocation(kw); }} busy={busy} error={error} reduceMotion={reduceMotion} total={manifest && manifest.total}/>
        : <Results ALL={ALL} loadNote={loadNote} coords={coords} locLabel={locLabel} keyword={keyword}
            typeFilter={typeFilter} setTypeFilter={setTypeFilter} radius={radius} setRadius={setRadius} sheetState={sheetView} setSheetState={setSheetView}
            favIds={favIds} onFav={toggleFav} onOpen={openDetail} onHome={goLanding}
            themeKey={themeKey} contrast={prefs.contrast} onVisibleChange={setReadableList} reduceMotion={reduceMotion}/>}</main>
      <footer ref={footerRef} style={{borderTop:'1px solid var(--border)',background:'var(--surface)',padding:'24px 24px',textAlign:'center',fontSize:'var(--fs-xs)',color:'var(--text-muted)'}}>
        © 2026 Accessibility Mapper · Cal Poly Pomona Computer Science ·{' '}
        <a href="https://github.com/michaelcraft17/autism-community-resources" target="_blank" rel="noopener noreferrer" style={{color:'var(--text-link)',textDecoration:'underline',fontWeight:600}}>GitHub</a>
        {' '}·{' '}
        <a href="#donate" onClick={e=>{e.preventDefault();goDonate();}} style={{color:'var(--accent-text)',fontWeight:600,cursor:'pointer'}}>Donate ♥</a>
        <span style={{display:'block',marginTop:4}}>Contact: <a href={`mailto:${CONTACT_EMAIL}`} style={{color:'var(--text-link)',textDecoration:'underline',fontWeight:600}}>{CONTACT_EMAIL}</a></span>
        <span style={{display:'block',marginTop:4}}>Always verify information directly with service providers.</span>
      </footer>
    </div>
      <ReadingAid mode={prefs.cursor}/>
      <SavedPanel open={savedOpen} onClose={() => setSavedOpen(false)} favs={favs} coords={screen === 'results' ? coords : null} onFav={toggleFav} onOpen={openDetail}/>
      {detail && <ResourceDetail r={detail.r} status={detail.status} onClose={closeDetail} fav={!!detail.r && favIds.has(detail.r.id)} onFav={toggleFav} coords={screen === 'results' ? coords : null} locLabel={locLabel}/>}
      <SuggestModal open={suggestOpen} onClose={() => setSuggestOpen(false)}/>
      <AccessibilityPanel
        open={a11yOpen}
        onClose={() => setA11yOpen(false)}
        prefs={prefs}
        setPrefs={setPrefs}
        favs={favs}
        readableList={readableList}
        canReadAloud={screen === 'results'}
        onDeleteAllData={() => { clearAllStoredData(); setPrefs({ ...DEFAULT_PREFS }); setFavs([]); }}
      />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
