  const rootRef = useRef(null);
  const winRef = useRef(null);
  const progRef = useRef(false);            // true while a programmatic fit is settling (so it isn't mistaken for the user moving the map)
  const progTimer = useRef(0);
  const [away, setAway] = useState(false);   // the user has zoomed/panned away from the fit-all-pins view
  // The map is pinned to the screen (sticky at 76px) from the very first pixel of scrolling, and the frame around it is a
  // window whose top edge is the filter bar's bottom. As the page scrolls, that edge slides up and simply reveals more of the
  // already-pinned map: it grows in step with the scroll and pins never move. `lift` is how far above the window the map
  // must start so its natural position equals its pinned position; it only changes when the layout does, never on scroll.
  const [lift, setLift] = useState(0);
  useEffect(() => {
    const measure = () => {
      const w = winRef.current;
      if (w) setLift(Math.max(0, Math.round(w.getBoundingClientRect().top + window.scrollY - 76)));
    };
    measure();
    const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
    if (ro) ro.observe(document.body);
    window.addEventListener('resize', measure);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);
  // How much of the map's top is currently clipped away by the window (>0 only while the page is scrolled to the very top).
  const hiddenTop = () => { const w = winRef.current, r = rootRef.current; return w && r ? Math.max(0, Math.round(w.getBoundingClientRect().top - r.getBoundingClientRect().top)) : 0; };
  const [tip, setTip] = useState(null);
  const userMarkerRef = useRef(null);
  const activeRef = useRef(active); activeRef.current = active;
  const contrastRef = useRef(contrast); contrastRef.current = contrast;
  const mobileFullRef = useRef(mobileFull); mobileFullRef.current = mobileFull;
  const [ready, setReady] = useState(0);
  const showKey = groups.map(g=>g.map(r=>r.id).join('+')).join(',');
  const centerKey = center ? center.lat + ',' + center.lng : '';

  // While the mobile sheet is fully expanded (list view), the map sits behind it, fully
  // covered -- but its Google Maps controls (zoom, "Show all pins", etc.) were still real,
  // focusable DOM elements, so Tab silently walked through ~9 invisible controls before
  // reaching the first result card, and screen readers announced them too (WCAG 2.4.11).
  // `inert` removes the whole subtree from both the tab order and the accessibility tree in
  // one step; it's toggled imperatively (not via the `inert` JSX prop) since this file targets
  // React 18.3 via CDN, where JSX->DOM support for boolean-ish global attributes is uneven.
  const hiddenInList = mobileFull && sheetState === 'full';
  useEffect(() => {
    if (!rootRef.current) return;
    rootRef.current.inert = hiddenInList;
    rootRef.current.setAttribute('aria-hidden', hiddenInList ? 'true' : 'false');
  }, [hiddenInList]);

  // init map (wait for Google Maps script to be ready)
  useEffect(() => {
    let cancelled = false;
    (function init(){
      if (cancelled || mapRef.current) return;
      // With loading=async the google.maps namespace appears before Map is ready, so wait for Map itself.
      if (!window.google || !window.google.maps || typeof window.google.maps.Map !== 'function') { setTimeout(init, 120); return; }
      mapRef.current = new google.maps.Map(elRef.current, {
        center: { lat: 37.8, lng: -110 }, zoom: 4,
        mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
        zoomControl: true, styles: mapStyleFor(contrastRef.current), backgroundColor: mapBgFor(contrastRef.current),
        gestureHandling: 'greedy',
      });
      infoRef.current = new google.maps.InfoWindow();
      // Empty overlay: only here to give us the projection (lat/lng -> pixel) for the hover preview.
      const ov = new google.maps.OverlayView();
      ov.onAdd = () => {}; ov.draw = () => {}; ov.onRemove = () => {};
      ov.setMap(mapRef.current);
      overlayRef.current = ov;
      // Each 'idle' during a programmatic fit pushes the end of the settling window out a little (fitBounds + the zoom cap take a moment).
      mapRef.current.addListener('idle', () => { if (progRef.current) { clearTimeout(progTimer.current); progTimer.current = setTimeout(() => { progRef.current = false; }, 500); } });
      ['dragstart', 'zoom_changed'].forEach(ev => mapRef.current.addListener(ev, () => { setTip(null); if (!progRef.current) setAway(true); }));
      setReady(r => r + 1);
    })();
    // Without this, crossing the 640px breakpoint (e.g. rotating a phone) unmounted this
    // component but left its markers, clusterer, map instance, and idle/dragstart/zoom_changed
    // listeners alive and referenced -- a leaked, still-billable Google Maps load every time.
    return () => {
      cancelled = true;
      clearTimeout(progTimer.current);
      if (clustererRef.current) { clustererRef.current.clearMarkers(); clustererRef.current = null; }
      Object.values(markersRef.current).forEach(({marker}) => marker.setMap(null));
      markersRef.current = {};
      if (userMarkerRef.current) { userMarkerRef.current.setMap(null); userMarkerRef.current = null; }
      if (window.google && mapRef.current) google.maps.event.clearInstanceListeners(mapRef.current);
      mapRef.current = null;
    };
  }, []);

  // Frame the searched location plus every pin on this page (also what the "Show all pins" button restores).
  const pinPts = groups.map(g => g[0]).filter(r => r.coordinates && !r.placeless);
  const fitToPins = () => {
    const map = mapRef.current;
    if (!map || !window.google) return;
    progRef.current = true;
    clearTimeout(progTimer.current);
    progTimer.current = setTimeout(() => { progRef.current = false; }, 1500);   // safety net if the view doesn't change
    setAway(false);
    // Don't let fitBounds zoom in too far on a tight cluster of pins
    const capZoom = (max) => google.maps.event.addListenerOnce(map, 'idle', () => {
      if (map.getZoom() > max) map.setZoom(max);
    });
    const pts = pinPts;
    if (center && pts.length > 0) {
      // Fit the searched location + this page's pins (tighter than a fixed radius)
      const b = new google.maps.LatLngBounds();
      b.extend(center);
      pts.forEach(r => b.extend(r.coordinates));
      map.fitBounds(b, { top: 56 + hiddenTop(), right: 56, bottom: 56, left: 56 });
      capZoom(14);
    } else if (center) {
      // No located pins on this page — just center on the searched location
      const eff = radiusMi || 15;
      map.fitBounds(boundsAround(center, eff), { top: 48 + hiddenTop(), right: 48, bottom: 48, left: 48 });
    } else if (pts.length > 1) {
      const b = new google.maps.LatLngBounds();
      pts.forEach(r => b.extend(r.coordinates));
      map.fitBounds(b, { top: 56 + hiddenTop(), right: 56, bottom: 56, left: 56 });
      capZoom(14);
    } else if (pts.length === 1) {
      map.setCenter(pts[0].coordinates); map.setZoom(13);
    }
  };

  // draw / refresh markers when the shown set changes
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !window.google) return;
    Object.values(markersRef.current).forEach(({marker}) => marker.setMap(null));
    markersRef.current = {};
    if (!clustererRef.current && window.markerClusterer) {
      clustererRef.current = new markerClusterer.MarkerClusterer({
        map, markers: [],
        algorithmOptions: { radius: 55, maxZoom: 16 },   // pins split apart once zoomed in past street level
        renderer: { render: (cluster) => {
          const isA = (cluster.markers || []).some(m => (m.__ids || []).includes(activeRef.current));
          return new google.maps.Marker({
            position: cluster.position, icon: clusterSymbol(isA), zIndex: 500 + cluster.count,
            label: { text: String(cluster.count), color: isA ? activeLabelColor() : pinLabelColor(contrastRef.current), fontSize: '15px', fontWeight: '700', fontFamily: 'Hanken Grotesk, sans-serif' },
            title: cluster.count + ' resources here — click to zoom in',
          });
        } },
      });
    }
    if (clustererRef.current) clustererRef.current.clearMarkers();
    const pinMarkers = [];
    groups.forEach((g, i) => {
      const first = g[0];
      if (!first.coordinates || first.placeless) return;
      const num = i + 1;
      const groupKey = normalizeAddress(first.address);
      const ids = g.map(r => r.id);
      const isActive = ids.includes(active);
      const marker = new google.maps.Marker({
        position: first.coordinates,
        icon: pinSymbol(isActive),
        label: { text: String(num), color: isActive ? activeLabelColor() : pinLabelColor(contrastRef.current), fontSize: '13px', fontWeight: '700', fontFamily: 'Hanken Grotesk, sans-serif' },
        title: g.length > 1 ? (g.length + ' providers at this address') : first.name,
        zIndex: isActive ? 999 : 100 - i,   // lower list numbers sit on top when pins overlap
      });
      marker.__ids = ids; marker.__z = 100 - i;
      marker.addListener('click', () => {
        if (mobileFullRef.current) { onHover(first.id); return; }
        // Listing text comes from outside registries, so it's escaped before going into this HTML string.
        const header = g.length > 1
          ? '<strong style="font-size:14px;color:#111315">' + esc(first.facility_name || (g.length + ' Resources at This Address')) + '</strong>' +
            '<div style="font-size:12px;color:#33383b;margin:2px 0 6px">' + esc(first.address) + '</div>'
          : '<strong style="font-size:14px;color:#111315">' + esc(first.name) + '</strong>' +
            '<div style="font-size:12px;color:#33383b;margin:4px 0">' + esc(first.address) + '</div>';
        const rows = g.map(r =>
          '<div style="margin-top:6px">' +
          (g.length > 1 ? '<div style="font-weight:600;font-size:12px">' + esc(r.name) + '</div>' : '') +
          (r.phone ? '<a href="tel:' + esc(r.phone) + '" style="font-size:12px;color:#111315;font-weight:600;text-decoration:underline">' + esc(r.phone) + '</a>' : '') +
          (r.phone ? ' · ' : '') + '<a href="' + esc(listingLink(r) || '#r=' + r.id) + '" style="font-size:12px;color:#111315;font-weight:600;text-decoration:underline">View details</a>' +
          '</div>'
        ).join('');
        infoRef.current.setContent('<div style="font-family:Hanken Grotesk,sans-serif;max-width:220px;line-height:1.4">' + header + rows + '</div>');
        infoRef.current.open(map, marker);
      });
      // Real touch has no hover, but the sandboxed/desktop-emulated browser used to test this
      // does fire real mouseover/mouseout on the map -- so on mobile, moving the pointer off a
      // just-tapped pin was calling onHover(null) and wiping the tapped selection straight back
      // to "1 of N" (confirmed in QA). Gate both to desktop only.
      marker.addListener('mouseover', () => {
        if (mobileFullRef.current) return;
        onHover(first.id); scrollCardIntoView(first.id);
        const pr = overlayRef.current && overlayRef.current.getProjection();
        const pt = pr && pr.fromLatLngToContainerPixel(marker.getPosition());
        if (pt) setTip({ x: pt.x, y: pt.y, g, num, hidden: hiddenTop() });
      });
      marker.addListener('mouseout', () => { if (mobileFullRef.current) return; onHover(null); setTip(null); });
      markersRef.current[groupKey + ':' + i] = { marker, ids };
      pinMarkers.push(marker);
    });
    // Nearby pins collapse into numbered bubbles (falls back to plain pins if the clusterer script didn't load)
    if (clustererRef.current) clustererRef.current.addMarkers(pinMarkers);
    else pinMarkers.forEach(m => m.setMap(map));

    // "You are here" marker for the searched location
    if (userMarkerRef.current) { userMarkerRef.current.setMap(null); userMarkerRef.current = null; }
    if (center) {
      userMarkerRef.current = new google.maps.Marker({ position: center, map, icon: youSymbol, title: 'Searched location', zIndex: 0 });
    }

    fitToPins();
  }, [showKey, ready, centerKey, radiusMi, themeKey]);

  // Re-skin the cluster bubbles (active = one of their pins is the hovered result)
  const styleClusters = (contrastVal) => {
    const c = clustererRef.current;
    if (!c || !c.clusters) return;
    c.clusters.forEach(cl => {
      if (!cl.marker || !cl.markers || cl.markers.length < 2) return;
      const isA = cl.markers.some(m => (m.__ids || []).includes(activeRef.current));
      const ckey = contrastVal + '|' + currentBrandColors().brand;
      if (cl.marker.__act === isA && cl.marker.__actC === ckey) return;   // unchanged: skip the costly icon/label updates
      cl.marker.__act = isA; cl.marker.__actC = ckey;
      cl.marker.setIcon(clusterSymbol(isA));
      cl.marker.setZIndex(isA ? 999 : 500 + cl.markers.length);
      const lb = cl.marker.getLabel();
      if (lb) cl.marker.setLabel({ ...lb, color: isA ? activeLabelColor() : pinLabelColor(contrastVal) });
    });
  };

  // Restyle live when the accessibility "Contrast +" mode changes. Kept separate from the marker effect
  // above so it never re-fits the map: the user's zoom/pan stays put.
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    map.setOptions({ styles: mapStyleFor(contrast), backgroundColor: mapBgFor(contrast) });
    // Wait one tick so App has updated the body classes / CSS variables that pinSymbol() reads.
    const id = setTimeout(() => {
      Object.values(markersRef.current).forEach(({marker, ids}) => {
        marker.setIcon(pinSymbol(ids.includes(activeRef.current)));
        const lb = marker.getLabel();
        if (lb) marker.setLabel({ ...lb, color: ids.includes(activeRef.current) ? activeLabelColor() : pinLabelColor(contrast) });
      });
      styleClusters(contrast);
    }, 0);
    return () => clearTimeout(id);
  }, [contrast, ready]);

  // highlight active marker without redrawing; on the mobile map-first layout, also pan to
  // it so keyboard/screen-reader users stepping through results via Previous/Next (which sets
  // `active` without ever touching the map) actually see the pin they're on. Also nudge the
  // zoom to the clusterer's own maxZoom (16, see algorithmOptions above) when needed, since
  // panning to a marker that's still inside a cluster bubble left the selected pin invisible.
  useEffect(() => {
    let panTarget = null;
    Object.values(markersRef.current).forEach(({marker, ids}) => {
      const isA = ids.includes(active);
      if (isA) panTarget = marker.getPosition();
      if (marker.__act === isA) return;   // only the previously- and newly-active pins need new icons
      marker.__act = isA;
      marker.setIcon(pinSymbol(isA));
      marker.setZIndex(isA ? 999 : (marker.__z || 1));
      const lb = marker.getLabel();
      if (lb) marker.setLabel({ ...lb, color: isA ? activeLabelColor() : pinLabelColor(contrastRef.current) });
    });
    if (panTarget && mobileFull && mapRef.current) {
      mapRef.current.panTo(panTarget);
      if (mapRef.current.getZoom() < 16) mapRef.current.setZoom(16);
    }
    styleClusters(contrastRef.current);
  }, [active, mobileFull]);

  if (mobileFull) {
    return (
      <div ref={rootRef} style={{position:'absolute',left:0,right:0,top:0,bottom:bottomInset}}>
        <div ref={elRef} style={{width:'100%',height:'100%',background:mapBgFor(contrast)}}/>
        {/* Not rendered at all (rather than just visually repositioned) while the sheet is
           fully expanded: it used to sit at zIndex 15, above the sheet's own 5, so it floated
           over the result list. In peek state it sits above the peek strip/preview card
           instead of at the very bottom, where it used to cover the handle and result count. */}
        {!hiddenInList && away && pinPts.length > 0 && (
          <button type="button" onClick={fitToPins} aria-label="Show all pins on the map" className="btn-secondary"
            style={{position:'absolute',left:12,top:12,zIndex:8,height:40,padding:'0 16px',boxShadow:'var(--shadow-md)'}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Show all pins
          </button>
        )}
      </div>
    );
  }

  return (
    <div ref={winRef} className="map-win" style={{flex:1,position:'relative',borderRadius:'var(--r-md)'}}>
      <div ref={rootRef} onMouseLeave={() => { onHover(null); setTip(null); }} style={{position:'sticky',top:76,marginTop:-lift,borderRadius:'var(--r-md)',overflow:'hidden',height:'calc(100vh - 92px)',minHeight:480,boxShadow:'0 1px 3px rgba(42,38,30,.1)',border:'1px solid var(--border)'}}>
        <div ref={elRef} style={{width:'100%',height:'100%',minHeight:480,background:mapBgFor(contrast)}}/>
        {away && pinPts.length > 0 && (
          <button type="button" onClick={fitToPins} aria-label="Show all pins on the map" className="btn-secondary"
            style={{position:'absolute',left:12,bottom:38,zIndex:15,height:40,padding:'0 16px',boxShadow:'var(--shadow-md)'}}>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Show all pins
          </button>
        )}
        {tip && <PinTip tip={tip} center={center} width={elRef.current ? elRef.current.clientWidth : 400} minY={tip.hidden || 0}/>}
      </div>
    </div>
  );
};

/* ─── Filter bar (Yelp-style): search box, category pills, and dropdown chips ─── */
const CATEGORIES = ['Advocacy','Therapy','Education','Medical','Social'];
// A separate, more saturated palette just for the small category dot -- TYPE_META's own
// colors are tuned to work as running text on a light tint (WCAG AA), which reads as muted
// on a tiny 8px dot; this is purely decorative so it can be as vivid as an actual color-coded
// legend, without touching the text-safe colors used everywhere else (badges, cards).
const CATEGORY_DOT_COLORS = { advocacy:'#378ADD', therapy:'#7F77DD', education:'#639922', medical:'#D4537E', social:'#D85A30', general_support:'#8A8F94' };
const SUGGESTED =['Individual Provider','Organization / Agency','Free / Sliding Scale','Telehealth Available','In-home Services','Accepts Medicaid','Early Intervention (0–5)','Bilingual Services','Wheelchair Accessible'];
const Caret = () => <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;

// Desktop keeps Distance/Specialty/More filters as three separate dropdown chips (the
// pre-redesign look the site owner asked to keep), all in the same neutral style -- only mobile
// (`compact`, see FilterBar) collapses them into the single FilterSheet panel below.
const FilterChip = ({id, label, active, count, open, onToggle, tone, children}) => (
  <div style={{position:'relative'}} data-filter-chip>
    <button type="button" className={`fchip${tone?` pc pc-${tone}`:''}${active?' on':''}`} aria-haspopup="true" aria-expanded={open} onClick={()=>onToggle(id)}>
      {label}{count > 0 && <span className="fcount">{count}</span>}<Caret/>
    </button>
    {open && <div className="fpop" role="group" aria-label={id}>{children}</div>}
  </div>
);

/* ─── Mobile "Filters" bottom sheet ──────────────────────────────
   Below 640px the 7 always-visible filter chips (5 categories + Distance + Specialty,
   plus the "More filters" chip) were pushing every result card below the fold on a phone
   — confirmed on a real 390px screenshot. They collapse into this single sheet, opened from
   a "Filters" button that carries an active-count badge (same .fcount style as the chips). */
const FilterSheet = ({open, onClose, typeFilter, setTypeFilter, showType, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearSug, resultCount}) => {
  const dialogRef = useRef(null);
  const closeRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const t = setTimeout(() => closeRef.current && closeRef.current.focus(), 0);
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key === 'Tab' && dialogRef.current) {
        const f = dialogRef.current.querySelectorAll('button, input, a[href]');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); };
  }, [open]);

  if (!open) return null;
  const clearAll = () => { if (showType) setTypeFilter(''); setSpecialty(''); setRadius(null); clearSug(); };
  return ReactDOM.createPortal(
    <div style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
      <div onClick={onClose} aria-hidden="true" style={{position:'absolute',inset:0,background:'var(--overlay)'}}/>
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="filter-sheet-title" style={{position:'relative',background:'var(--surface)',borderRadius:'var(--r-md) var(--r-md) 0 0',width:'100%',maxWidth:520,maxHeight:'85vh',overflowY:'auto',boxShadow:'0 -8px 32px rgba(0,0,0,.28)',padding:'18px 18px 16px'}}>
        {/* The result count changes here as filters are toggled, but the equivalent live
           region in FilterBar sits outside this dialog -- some screen readers don't announce
           updates from outside an aria-modal region while it's open, so this is a second copy
           scoped to the sheet itself, not just a style duplicate. */}
        <div aria-live="polite" className="sr-only">{resultCount} result{resultCount!==1?'s':''}</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h2 id="filter-sheet-title" className="dlg-title">Filters</h2>
          <button ref={closeRef} type="button" onClick={onClose} aria-label="Close filters" style={{width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}><XIcon/></button>
        </div>
        {/* On desktop, category is the always-visible chip row above the results list, so it's
           deliberately left out of this panel to avoid a second, redundant way to set the same
           thing. On mobile there's no room for that row without pushing results below the fold
           (measured: header + an inline category row ate over half the viewport before the map
           even started), so category rejoins Distance/Specialty/More filters in here instead --
           `showType` is just `compact` from FilterBar. Name/service search moved out of both,
           into the header's combined search bar, on both sizes. */}
        {showType && (
          <div role="group" aria-label="Type" style={{marginBottom:20}}>
            <h3 style={{fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text)',margin:'0 0 8px'}}>Type</h3>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              <button type="button" className={`catchip${!typeFilter?' on':''}`} aria-pressed={!typeFilter} onClick={()=>setTypeFilter('')}>All</button>
              {CATEGORIES.map(c => {
                const v = c.toLowerCase();
                return (
                  <button key={c} type="button" className={`catchip${typeFilter===v?' on':''}`} aria-pressed={typeFilter===v} onClick={()=>setTypeFilter(typeFilter===v?'':v)}>
                    <span className="cdot" aria-hidden="true" style={{background:CATEGORY_DOT_COLORS[v]}}/>{c}
                  </button>
                );
              })}
            </div>
          </div>
        )}
        <fieldset className="fsheet-fieldset">
          <legend>Distance</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {DIST_OPTIONS.map(([d, mi]) => (
              <label key={d} className="fopt"><input type="radio" name="dist-sheet" checked={radius===mi} onChange={()=>setRadius(mi)}/>{d}</label>
            ))}
          </div>
        </fieldset>
        <fieldset className="fsheet-fieldset">
          <legend>Specialty</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {['', ...SPECIALTIES].map(sp => (
              <label key={sp || 'all'} className="fopt"><input type="radio" name="spec-sheet" checked={specialty===sp} onChange={()=>setSpecialty(sp)}/>{sp || 'All specialties'}</label>
            ))}
          </div>
        </fieldset>
        <fieldset className="fsheet-fieldset" style={{marginBottom:8}}>
          <legend>More filters</legend>
          <div style={{display:'flex',flexDirection:'column'}}>
            {SUGGESTED.map(sg => (
              <label key={sg} className="fopt"><input type="checkbox" checked={selSug.includes(sg)} onChange={()=>toggleSug(sg)}/>{sg}</label>
            ))}
          </div>
        </fieldset>
        <div style={{display:'flex',gap:10,marginTop:14,position:'sticky',bottom:-16,background:'var(--surface)',paddingTop:12,paddingBottom:4,borderTop:'1px solid var(--divider)'}}>
          <button type="button" onClick={clearAll} className="btn-secondary" style={{flex:'0 0 auto'}}>Clear all</button>
          <button type="button" onClick={onClose} className="btn-primary" style={{flex:1}}>Show {resultCount.toLocaleString()} result{resultCount!==1?'s':''}</button>
        </div>
      </div>
    </div>,
    document.body
  );
};

function useDebounced(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
}

/* Removable chips summarizing every active structured filter (Baymard: showing applied
   filters up front, with a one-tap way to remove each, speeds up refinement and avoids the
   "what's even filtered right now?" confusion of chips that only live inside a closed sheet).
   Deliberately kept on both desktop and mobile (not gated to mobile): the individual filter
   pills above already show their own "on" state, but this row is the only one-tap way to drop
   a single filter without reopening a popover/sheet, which is worth it on both sizes -- see the
   commit message for this as an explicit decision, not an oversight.
   Keyword has no chip here -- it's a separate, always-visible, always-editable field in the
   header now (on both desktop and mobile), so a filter-focused "clear" acting on it too would
   be surprising, same as it always was on desktop. */
const ActiveFilterChips = ({typeFilter, setTypeFilter, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearAll, filtersBtnRef, inline}) => {
  const containerRef = useRef(null);
  const [pendingFocus, setPendingFocus] = useState(null);
  const chips = [];
  if (typeFilter) chips.push({ key:'type', label: TYPE_META[typeFilter] ? TYPE_META[typeFilter].label : typeFilter, onRemove:()=>setTypeFilter('') });
  if (radius != null) chips.push({ key:'radius', label:`Within ${radius} mi`, onRemove:()=>setRadius(null) });
  if (specialty) chips.push({ key:'specialty', label:specialty, onRemove:()=>setSpecialty('') });
  selSug.forEach(s => chips.push({ key:'sug-'+s, label:s, onRemove:()=>toggleSug(s) }));

  // Removing a chip used to drop focus to <body> (the button it lived on was simply gone).
  // This moves it to whichever chip's x now sits where the removed one was, or the previous
  // one, or the Filters button once none are left -- resolved after the remaining chips have
  // actually re-rendered, not by guessing which DOM node React will reuse.
  useEffect(() => {
    if (!pendingFocus) return;
    setPendingFocus(null);
    if (pendingFocus === 'filters') { filtersBtnRef && filtersBtnRef.current && filtersBtnRef.current.focus(); return; }
    const el = containerRef.current && containerRef.current.querySelector(`[data-chip-key="${pendingFocus}"] button`);
    if (el) el.focus();
    else if (filtersBtnRef && filtersBtnRef.current) filtersBtnRef.current.focus();
  }, [pendingFocus, chips.length]);

  if (!chips.length) return null;
  const removeChip = key => {
    const idx = chips.findIndex(c => c.key === key);
    const target = chips[idx + 1] || chips[idx - 1];
    setPendingFocus(target ? target.key : 'filters');
    chips[idx].onRemove();
  };
  return (
    <div ref={containerRef} className={inline ? 'afchips-inline' : undefined} style={inline ? {display:'flex',flexWrap:'nowrap',alignItems:'center',gap:8,flex:'1 1 0',minWidth:0,overflowX:'auto'} : {display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,flexBasis:'100%',marginTop:2}}>
      {chips.map(c => (
        <span key={c.key} data-chip-key={c.key} className="afchip" style={{maxWidth:'100%'}}>
          <span style={{overflow:'hidden',textOverflow:'ellipsis',minWidth:0}}>{c.label}</span>
          <button type="button" onClick={()=>removeChip(c.key)} aria-label={`Remove filter: ${c.srLabel || c.label}`}><XIcon/></button>
        </span>
      ))}
      <button type="button" onClick={clearAll} style={{background:'transparent',border:'none',color:'var(--text)',textDecoration:'underline',fontSize:'var(--fs-sm)',fontWeight:600,padding:'0 4px',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>Clear all</button>
    </div>
  );
};

const ListIcon = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;

// Name/service search now lives only in the header's combined search bar (both mobile and
// desktop). Category stays its own always-visible chip row on desktop. Distance/Specialty/
// More filters are back to three separate dropdown chips on desktop (the site owner's
// preference -- reverted after trying the single-panel consolidation); mobile (`compact`)
// still collapses Type + those three into one "Filters" sheet, since an inline category row
// plus three dropdown chips measured out at over half the viewport before the map even
// started there.
const FilterBar = ({typeFilter, setTypeFilter, specialty, setSpecialty, radius, setRadius, selSug, toggleSug, clearSug, resultCount, compact}) => {
  const [openId, setOpenId] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);
  const filtersBtnRef = useRef(null);
  const toggle = id => setOpenId(o => o === id ? null : id);
  const activeCount = (specialty?1:0) + (radius!=null?1:0) + selSug.length + (compact && typeFilter ? 1 : 0);
  const closeSheet = () => { setSheetOpen(false); filtersBtnRef.current && filtersBtnRef.current.focus(); };
  const clearAll = () => { setTypeFilter(''); setSpecialty(''); setRadius(null); clearSug(); setOpenId(null); };
  const distLabel = (DIST_OPTIONS.find(([, mi]) => mi === radius) || DIST_OPTIONS[0])[0];

  useEffect(() => {
    if (!openId) return;
    const onDown = e => { if (!e.target.closest || !e.target.closest('[data-filter-chip]')) setOpenId(null); };
    const onKey = e => { if (e.key === 'Escape') setOpenId(null); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [openId]);

  // Debounced so typing a keyword doesn't fire an announcement on every keystroke -- only once
  // the result count has actually settled for a moment.
  const announcedCount = useDebounced(resultCount, 500);

  return (
    <div className="fbar" role="search" aria-label="Filter resources">
      <div aria-live="polite" className="sr-only">{announcedCount} result{announcedCount!==1?'s':''}</div>
      {!compact && (
        <div className="fbar-cats" style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8}}>
          <button type="button" className={`catchip${!typeFilter?' on':''}`} aria-pressed={!typeFilter} onClick={()=>setTypeFilter('')}>All</button>
          {CATEGORIES.map(c => {
            const v = c.toLowerCase();
            return (
              <button key={c} type="button" className={`catchip${typeFilter===v?' on':''}`} aria-pressed={typeFilter===v} onClick={()=>setTypeFilter(typeFilter===v?'':v)}>
                <span className="cdot" aria-hidden="true" style={{background:CATEGORY_DOT_COLORS[v]}}/>{c}
              </button>
            );
          })}
        </div>
      )}
      {!compact && (
        <>
          <span className="fbar-sep" aria-hidden="true"/>
          <FilterChip tone="blue" id="Distance" label={radius == null ? 'Distance' : distLabel} active={radius != null} open={openId==='Distance'} onToggle={toggle}>
            {DIST_OPTIONS.map(([d, mi]) => (
              <label key={d} className="fopt"><input type="radio" name="dist" checked={radius===mi} onChange={()=>{setRadius(mi); setOpenId(null);}}/>{d}</label>
            ))}
          </FilterChip>
          <FilterChip tone="amber" id="Specialty" label={specialty || 'Specialty'} active={!!specialty} open={openId==='Specialty'} onToggle={toggle}>
            {['', ...SPECIALTIES].map(sp => (
              <label key={sp || 'all'} className="fopt"><input type="radio" name="spec" checked={specialty===sp} onChange={()=>{setSpecialty(sp); setOpenId(null);}}/>{sp || 'All specialties'}</label>
            ))}
          </FilterChip>
          <FilterChip tone="pink" id="More filters" label="More filters" active={selSug.length > 0} count={selSug.length} open={openId==='More filters'} onToggle={toggle}>
            {SUGGESTED.map(sg => (
              <label key={sg} className="fopt"><input type="checkbox" checked={selSug.includes(sg)} onChange={()=>toggleSug(sg)}/>{sg}</label>
            ))}
          </FilterChip>
        </>
      )}
      {compact && (
        <button ref={filtersBtnRef} type="button" className="filters-btn fchip" style={{flexShrink:0}} aria-haspopup="dialog" aria-label={activeCount > 0 ? `Filters, ${activeCount} applied` : 'Filters'} onClick={()=>setSheetOpen(true)}>
          <SlidersIcon/> Filters{activeCount > 0 && <span className="fcount">{activeCount}</span>}
        </button>
      )}
      <ActiveFilterChips typeFilter={typeFilter} setTypeFilter={setTypeFilter} specialty={specialty} setSpecialty={setSpecialty} radius={radius} setRadius={setRadius} selSug={selSug} toggleSug={toggleSug} clearAll={clearAll} filtersBtnRef={filtersBtnRef} inline={compact}/>
      {compact && <FilterSheet open={sheetOpen} onClose={closeSheet} typeFilter={typeFilter} setTypeFilter={setTypeFilter} showType specialty={specialty} setSpecialty={setSpecialty} radius={radius} setRadius={setRadius} selSug={selSug} toggleSug={toggleSug} clearSug={clearSug} resultCount={resultCount}/>}
    </div>
  );
};

/* ─── Saved panel — the listings a visitor has hearted (snapshots stored on this device only) ─── */

/* ─── Listing details ──────────────────────────────────────────────────
   Opened from a listing's name (on a card, in Saved, or "View details" in a map pin's pop-up): a
   drawer on wider screens, a full screen on a phone. One place for everything about a listing -- the
   full description, every service, the address with directions, Call, website, and the source with
   its registry number -- plus Save, Share and "Report a problem". It has its own URL (r=<id>), so
   Back closes it and a shared link opens it. */
function buildProblemReportUrl(r) {
  const body = [
    `**Listing:** ${r.name}`,
    r.address && `**Address:** ${r.address}`,
    r.phone && `**Phone:** ${r.phone}`,
    r.website && `**Website:** ${r.website}`,
    `**Source:** ${sourceLabel(r.source) || 'unknown'}`,
    `**Listing id:** ${r.id}`,
    listingLink(r) && `**Link:** ${listingLink(r)}`,
    '**What’s wrong?** (for example: closed, moved, wrong phone number, not autism-related)',
    '_Reported via the "Report a problem" link on autismcommunityorg.org._',
  ].filter(Boolean).join('\n\n');
  const params = new URLSearchParams({ title: `Listing problem: ${r.name}`, body, labels: 'listing-problem' });
  return `https://github.com/michaelcraft17/autism-community-resources/issues/new?${params.toString()}`;
}

const ResourceDetail = ({r, status, onClose, fav, onFav, coords, locLabel}) => {
  const panelRef = useRef(null), closeBtnRef = useRef(null);
  const onCloseRef = useRef(onClose); onCloseRef.current = onClose;
  const [shareMsg, setShareMsg] = useState(null);
  useEffect(() => {
    const opener = document.activeElement;
    const t = setTimeout(() => closeBtnRef.current && closeBtnRef.current.focus(), 0);
    const onKey = e => {
      if (e.key === 'Escape') { onCloseRef.current(); return; }   // SavedPanel ignores this Escape while .detail-wrap is open
      if (e.key === 'Tab' && panelRef.current) {
        const f = panelRef.current.querySelectorAll('button, a[href], input, select, textarea');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => {
      clearTimeout(t); window.removeEventListener('keydown', onKey);
      if (opener && opener.focus && document.contains(opener)) opener.focus();

  }, []);
  useEffect(() => { setShareMsg(null); }, [r && r.id]);

  const doShare = async () => {

        </div>
        <div className="detail-body">
          {status === 'missing' && <p style={{margin:0,color:'var(--text-secondary)'}}>This listing may have been updated or removed from the directory.</p>}
          {status === 'loading' && <p style={{margin:0,color:'var(--text-secondary)'}}>Loading this listing…</p>}
          {r && (<>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <TypePill type={r.type}/>
              {r.placeless && <NationwideTag/>}
            </div>
            {r.placeless

              : r.address && (
                <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
                  <span style={{color:'var(--text-muted)',marginTop:2,flexShrink:0}}><PinIcon s={16}/></span>
                  <div style={{display:'flex',flexDirection:'column',gap:2}}>
                    <span style={{fontSize:'var(--fs-md)',color:'var(--text)'}}>{r.address}</span>
                    {dist != null && <span style={{fontSize:'var(--fs-xs)',color:'var(--text-muted)'}}>{dist.toFixed(1)} mi from {locLabel || 'your search'}</span>}
                    {directions && <a href={directions} target="_blank" rel="noopener noreferrer" style={{fontSize:'var(--fs-sm)',fontWeight:600,color:'var(--text-link)',textDecoration:'underline',marginTop:2}}>Get directions ↗<span className="sr-only"> (opens Google Maps in a new tab)</span></a>}
                  </div>

              )}
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {r.phone && <a href={`tel:${r.phone}`} className="call-btn detail-btn" aria-label={`Call ${r.name} at ${r.phone}`}>Call {r.phone}</a>}

/* ─── Suggest-a-resource modal — opens a prefilled GitHub issue, no backend needed
   for a static GitHub Pages site. Reviewed by hand via tools/import_github_issues.py. ─── */
const RESOURCE_TYPE_OPTIONS = Object.entries(TYPE_META).map(([value, meta]) => ({value, label: meta.label}));

function isLikelyUrl(v) {
  if (!v.trim()) return true;
  try { return new URL(/^https?:\/\//i.test(v) ? v : `https://${v}`).hostname.includes('.'); }
  catch { return false; }
}

function buildGithubIssueUrl(f) {
  const body = [
    `**Name:** ${f.name}`,
    `**Type:** ${TYPE_META[f.type] ? TYPE_META[f.type].label : f.type}`,
    `**Country:** ${f.country}`,
    f.address.trim() && `**Address/City:** ${f.address}`,
    f.website.trim() && `**Website:** ${f.website}`,
    f.phone.trim() && `**Phone:** ${f.phone}`,
    `**Description:** ${f.description}`,
    '_Submitted via the "Suggest a resource" form on autismcommunityorg.org._',
  ].filter(Boolean).join('\n\n');
  const params = new URLSearchParams({ title: `Resource suggestion: ${f.name}`, body, labels: 'resource-suggestion' });
  return `https://github.com/michaelcraft17/autism-community-resources/issues/new?${params.toString()}`;
}

const SG_EMPTY = { name:'', website:'', phone:'', address:'', country:'', type:'advocacy', description:'' };

const SuggestModal = ({open, onClose}) => {
  const [fields, setFields] = useState(SG_EMPTY);
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  const dialogRef = useRef(null);
  const firstFieldRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    setFields(SG_EMPTY); setErrors({}); setSent(false);
    const t = setTimeout(() => firstFieldRef.current && firstFieldRef.current.focus(), 0);
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); return; }
      if (e.key === 'Tab' && dialogRef.current) {
        const f = dialogRef.current.querySelectorAll('button, input, select, textarea, a[href]');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); };
  }, [open]);

  if (!open) return null;

  const set = k => e => setFields(f => ({...f, [k]: e.target.value}));

  const handleSubmit = e => {
    e.preventDefault();
    const errs = {};
    if (!fields.name.trim()) errs.name = 'Name is required.';

  const inputStyle = {width:'100%',padding:'9px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-sm)',fontSize:'var(--fs-sm)',color:'var(--text)',background:'var(--surface)',fontFamily:'var(--font-sans)'};
  const labelStyle = {display:'block',fontSize:'var(--fs-sm)',fontWeight:700,color:'var(--text-secondary)',marginBottom:4};
  const errStyle = {fontSize:'var(--fs-xs)',color:'var(--error-fg)',marginTop:4};

  return ReactDOM.createPortal(

/* ─── Header overflow menu ───────────────────────────────────────
   Donate, Saved, and Accessibility are all their own always-visible buttons now (a red
   outline pill and two icon buttons), so this menu only needs to hold Suggest a Resource --
   kept as a real menu icon (not just a mobile fallback) as a home for that and any future
   secondary, non-primary action, rather than growing the always-visible row further.
   Portaled to document.body (same pattern as SuggestDropdown) so it isn't affected by any
   ancestor's overflow, and positioned from the trigger button's own rect. */
const HeaderMobileMenu = ({open, onClose, anchorRef, onSuggest}) => {
  const [rect, setRect] = useState(null);
  const popRef = useRef(null);

  useEffect(() => {
    if (!open || !anchorRef.current) { setRect(null); return; }
    const update = () => setRect(anchorRef.current.getBoundingClientRect());
    update();
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
  }, [open, anchorRef]);

  useEffect(() => {
    if (!open) return;
    const t = setTimeout(() => { const first = popRef.current && popRef.current.querySelector('button, a[href]'); first && first.focus(); }, 0);
    const onKey = e => {
      if (e.key === 'Escape') { onClose(); anchorRef.current && anchorRef.current.focus(); return; }
      if (e.key === 'Tab' && popRef.current) {
        const items = popRef.current.querySelectorAll('button, a[href]');
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    const onDown = e => { if (popRef.current && !popRef.current.contains(e.target) && anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    window.addEventListener('keydown', onKey);
    document.addEventListener('mousedown', onDown);
    return () => { clearTimeout(t); window.removeEventListener('keydown', onKey); document.removeEventListener('mousedown', onDown); };
  }, [open]);

  if (!open || !rect) return null;
  // Plain disclosure panel (ARIA APG "Disclosure"), not a role="menu" -- a real menu implies
  // arrow-key/Home/End navigation between items, which this never implemented; mislabeling it
  // as one gives assistive tech the wrong expectations. Tab-cycling, Escape, and returning
  // focus to the trigger (all still here) are everything the disclosure pattern requires.
  return ReactDOM.createPortal(
    <div ref={popRef} className="hdr-menu-pop" style={{top:rect.bottom+8, right:Math.max(8, window.innerWidth - rect.right)}}>
      <button type="button" onClick={()=>{onClose();onSuggest();}}><PlusCircleIcon s={16}/> Suggest a resource</button>
    </div>,
    document.body
  );
};

/* ─── Header ───────────────────────────────────────────────────

   old header-only location box plus the filter bar's separate "Name or service" box), a
   single filled (brand teal) search button as the only filled control here, Saved and
   Accessibility as plain icon buttons, Suggest a Resource moved into the menu icon, and
   Donate as a red outline pill instead of a filled one competing with the search button's

const Header = ({a11yOpen, setA11yOpen, savedOpen, savedCount, onToggleSaved, onSuggest, onDonate, locLabel, onLogoClick, onSearchLocation, onSelectSuggestion, onUseMyLocation, showSearch, locBusy, locError, keyword, setKeyword}) => {

  const [open, setOpen] = useState(false);
  const [activeIdx, setActiveIdx] = useState(-1);
  const suggestions = useLocationSuggestions(open ? locInput : '');

  const anchorRef = useRef(null);
  const pick = (s) => { setOpen(false); onSelectSuggestion(s, keyword); };

  const isMobile = useIsMobile();
  const searchBlock = showSearch && (
    <form className="hdr-search" onSubmit={e=>{ e.preventDefault(); if (open && activeIdx >= 0 && suggestions[activeIdx]) pick(suggestions[activeIdx]); else submitLocation(); }}>

        <span className="hdr-search-icon" aria-hidden="true"><SearchIcon s={15}/></span>

      </div>
      <div ref={anchorRef} className="hdr-search-field" style={{position:'relative'}}>
        {/* Doubles as "use my current location" -- a real button styled like the plain
           decorative icon the "what" field has, instead of a second separate icon+button
           pair crowding this already-compact field. */}
        <button type="button" className="hdr-search-icon" onClick={onUseMyLocation} disabled={locBusy} aria-label="Use my current location" title="Use my current location">
          <LocateIcon s={15}/>
        </button>
        <input
          value={locInput}
          onChange={e=>{ setLocInput(e.target.value); setOpen(true); }}
          onFocus={()=>setOpen(true)}

          onKeyDown={e=>{
            if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx(i => Math.min(i+1, suggestions.length-1)); }

            else if (e.key === 'Escape') { setOpen(false); }

          placeholder="City, ZIP, or address"
          title="Search a new location"
          autoComplete="off"
        />
        {open && <SuggestDropdown suggestions={suggestions} activeIdx={activeIdx} setActiveIdx={setActiveIdx} onPick={pick} anchorRef={anchorRef}/>}
        {locError && <div style={{position:'absolute',top:'calc(100% + 6px)',right:0,background:'var(--error-bg)',color:'var(--error-fg)',border:'1px solid var(--error)',borderRadius:'var(--r-sm)',padding:'6px 10px',fontSize:'var(--fs-xs)',whiteSpace:'nowrap',boxShadow:'0 2px 8px rgba(42,38,30,.12)',zIndex:1}}>{locError}</div>}
      </div>
      <button type="submit" disabled={locBusy} title="Search" aria-label="Search" className="hdr-search-btn">
        <ArrowRightIcon s={16}/>

  );
  return (
    <header style={{background:'var(--surface)',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:200,boxShadow:'0 1px 4px rgba(42,38,30,.06)'}}>
      <div style={{maxWidth:2400,margin:'0 auto',padding:isMobile && showSearch ? '6px 16px 8px' : '6px 24px',minHeight:isMobile && showSearch ? 0 : 62,display:'flex',flexWrap:'wrap',alignItems:'center',columnGap:16,rowGap:isMobile && showSearch ? 6 : 6,position:'relative'}}>
        {!showSearch && <div className="hdr-tagline" style={{position:'absolute',left:'50%',transform:'translateX(-50%)',pointerEvents:'none',textAlign:'center',whiteSpace:'nowrap'}}>
          <span style={{fontFamily:'var(--font-sans)',fontSize:'var(--fs-xs)',fontWeight:500,color:'var(--text-muted)'}}>Developed by Michael Chang, Founder of AI for Every Ability Inc.</span>
        </div>}
        <Logo onClick={onLogoClick} iconOnly={isMobile && showSearch}/>
        {!isMobile && searchBlock}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          <button type="button" onClick={onToggleSaved} aria-pressed={savedOpen} aria-haspopup="dialog" title={savedCount>0 ? `Saved resources (${savedCount})` : 'Saved resources'} aria-label={savedCount>0 ? `Saved resources, ${savedCount} saved` : 'Saved resources'} className={`hdr-icon-btn${savedOpen?' on':''}`}>

          </button>

            <SlidersIcon/>

            <MenuIcon/>

            ♥ Donate

  );
};

/* ─── Reading aloud ──────────────────────────────────────────── */
function useReadAloud(readableList) {
  const [rate, setRate] = useState(1);
  const [voiceURI, setVoiceURI] = useState('');
  const [voices, setVoices] = useState([]);
  const [status, setStatus] = useState('idle'); // idle | playing | paused
  const listRef = useRef(readableList);
  listRef.current = readableList;

  useEffect(() => {
    if (!window.speechSynthesis) return;
    const load = () => setVoices(window.speechSynthesis.getVoices());
    load();
    window.speechSynthesis.addEventListener('voiceschanged', load);
    return () => window.speechSynthesis.removeEventListener('voiceschanged', load);
  }, []);

  const stop = () => {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setStatus('idle');
  };

  useEffect(() => stop, [readableList]);

  const speakFrom = (i) => {
    const list = listRef.current;
    if (!window.speechSynthesis || i >= list.length) { setStatus('idle'); return; }
    const item = list[i];
    const u = new SpeechSynthesisUtterance(`${item.label}. ${item.type}. ${item.address}. ${item.description || ''}`);
    u.rate = rate;
    const v = voices.find(vv => vv.voiceURI === voiceURI);
    if (v) u.voice = v;
    u.onend = () => speakFrom(i + 1);
    window.speechSynthesis.speak(u);
  };

  const play = () => {
    if (!window.speechSynthesis || readableList.length === 0) return;
    if (status === 'paused') { window.speechSynthesis.resume(); setStatus('playing'); return; }
    window.speechSynthesis.cancel();
    setStatus('playing');
    speakFrom(0);
  };

  const pause = () => { if (window.speechSynthesis) { window.speechSynthesis.pause(); setStatus('paused'); } };

  return { play, pause, stop, status, rate, setRate, voices, voiceURI, setVoiceURI };
}

// Per-step labels/icons (UserWay/NNEA behavior: a tile renames itself and swaps its icon on each click).
const monitorIcon = (screen) => tileSvg(<>{screen}<path d="M16 22v5M11 27h10"/></>);
// Crisp vector icons for the two "size" tiles (drawn as strokes, not font glyphs, so they look the same at every step).
// Bigger Text: a small and a large slab-serif "T" that both grow with each level.
const slabT = (x, top, w, h, sw) => {
  const tick = Math.min(2.4, h * 0.25);
  return <path strokeWidth={sw} strokeLinecap="butt" strokeLinejoin="miter"
    d={`M${x} ${top}h${w}M${x} ${top}v${tick}M${x+w} ${top}v${tick}M${x+w/2} ${top}v${h}M${x+w/2-w*0.2} ${top+h}h${w*0.4}`}/>;
};
const textSizeIcon = ([ws, hs, wb, hb]) => {
  const gap = 2, x0 = (32 - (ws + gap + wb)) / 2, base = 28;
  return tileSvg(<>{slabT(x0, base - hs, ws, hs, 1.9)}{slabT(x0 + ws + gap, base - hb, wb, hb, 2.2)}</>);

// Line Height: the double arrow always spans exactly the block of lines, so it stretches as the spacing grows.
const lineHeightIcon = (sp) => {
  const H = 3 * sp, top = 16 - H / 2, bot = 16 + H / 2;
  return tileSvg(<>
    <path strokeWidth="2.2" d={`M6 ${top-1}v${H+2}M6 ${top-1}l-3 3.5M6 ${top-1}l3 3.5M6 ${bot+1}l-3-3.5M6 ${bot+1}l3-3.5`}/>
    {[0,1,2,3].map(k => <path key={k} d={`M13 ${top + k*sp}h16`}/>)}

    mono: tileSvg(<><path d={DROP}/><path d="M11 16.5h10M9.5 20.5h13M10 24.5h12" strokeWidth="1.6"/></>),

};
const ICON_OFF_OVERRIDES = {
  textSize: textSizeIcon([7,9,13.5,18]),
  lineHeight: lineHeightIcon(5.5),
  spacing: tileSvg(<><path d="M7 16h18" strokeDasharray="3 3"/><path d="M6 16l4-4M6 16l4 4M26 16l-4-4M26 16l-4 4"/></>),
  saturation: tileSvg(<><path d={DROP} fill="currentColor"/><path d="M11.5 20a4.6 4.6 0 002.6 4.2" stroke="#fff" strokeWidth="1.6"/></>),

const LABELS_ON = {
  contrast:   { invert:'Invert Colors', dark:'Dark Contrast', light:'Light Contrast' },
  spacing:    { '1':'Light Spacing', '2':'Moderate Spacing', '3':'Heavy Spacing' },
  motion:     { reduce:'Play Animations' },
  hideImages: { on:'Hide images enabled' },
  typeface:   { legible:'Legible Fonts' },
  cursor:     { black:'Big Cursor', mask:'Reading Mask', guide:'Reading Guide' },
  lineHeight: { '1':'Line Height (1.5x)', '2':'Line Height (1.75x)', '3':'Line Height (2x)' },
  textAlign:  { left:'Align Left', right:'Align Right', center:'Align Center', justify:'Justify' },
  saturation: { low:'Low Saturation', high:'High Saturation', mono:'Desaturate' },
};
// Saturation steps get their own accent (navy for low, grey for desaturate), like NNEA
const TONES_ON = { saturation: { low:'#3c4f9c', mono:'#5b616e' } };

// steps: values a tile cycles through (after 'default'); a single step makes it an on/off toggle.
const A11Y_TILES = [
  { key:'contrast',   label:'Contrast +',       steps:['invert','dark','light'] },
  { key:'links',      label:'Highlight Links',  steps:['on'] },
  { key:'textSize',   label:'Bigger Text',      steps:['large','largest','huge','giant'] },
  { key:'spacing',    label:'Text Spacing',     steps:['1','2','3'] },
  { key:'motion',     label:'Pause Animations', steps:['reduce'] },
  { key:'hideImages', label:'Hide Images',      steps:['on'] },
  { key:'typeface',   label:'Dyslexia Friendly',steps:['dyslexic','legible'] },
  { key:'cursor',     label:'Cursor',           steps:['black','mask','guide'] },
  { key:'tooltips',   label:'Tooltips',         steps:['on'] },
  { key:'lineHeight', label:'Line Height',      steps:['1','2','3'] },
  { key:'textAlign',  label:'Text Align',       steps:['left','right','center','justify'] },
  { key:'saturation', label:'Saturation',       steps:['low','high','mono'] },
];
const TILE_DEFAULTS = { motion:'system', typeface:'default' };
const tileOff = key => TILE_DEFAULTS[key] || 'default';

const ResetIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.7 3M3 4v5h5"/></svg>;

/* Reading Mask (dims everything except a band around the pointer) and Reading Guide (a line that follows the pointer). */
const ReadingAid = ({mode}) => {
  const topRef = useRef(null), botRef = useRef(null), guideRef = useRef(null);
  useEffect(() => {
    if (mode !== 'mask' && mode !== 'guide') return;
    const BAND = 120;
    const move = (x, y) => {
      if (mode === 'mask' && topRef.current) {
        topRef.current.style.height = Math.max(0, y - BAND/2) + 'px';
        botRef.current.style.top = (y + BAND/2) + 'px';
      } else if (guideRef.current) {
        guideRef.current.style.transform = `translate(${x - 256}px, ${y - 15}px)`;   // 512px bar centered on the pointer, just above it
      }
    };
    const onMouse = e => move(e.clientX, e.clientY);
    const onTouch = e => e.touches[0] && move(e.touches[0].clientX, e.touches[0].clientY);
    move(window.innerWidth / 2, window.innerHeight / 2);
    window.addEventListener('mousemove', onMouse, {passive:true});
    window.addEventListener('touchmove', onTouch, {passive:true});
    return () => { window.removeEventListener('mousemove', onMouse); window.removeEventListener('touchmove', onTouch); };
  }, [mode]);
  // Distinct keys make React build fresh elements when switching modes. Without them it recycles the mask's
  // <div> as the guide, which keeps the inline height the mask set on it (a giant black box).
  if (mode === 'mask') return <React.Fragment key="mask"><div ref={topRef} className="ra-mask" style={{top:0}} aria-hidden="true"/><div ref={botRef} className="ra-mask" style={{bottom:0}} aria-hidden="true"/></React.Fragment>;
  if (mode === 'guide') return <div key="guide" ref={guideRef} className="ra-guide" aria-hidden="true"/>;
  return null;
};

/* Tooltips feature: shows a label for whatever link/button/image is hovered or focused. */
function useTooltips(enabled) {
  useEffect(() => {
    if (!enabled) return;
    const tip = document.createElement('div');
    tip.className = 'a11y-tip';
    tip.setAttribute('aria-hidden', 'true');
    document.documentElement.appendChild(tip);
    const hide = () => { tip.style.display = 'none'; };
    const show = e => {
      const el = e.target.closest && e.target.closest('a,button,img,input,select,textarea,[role=button],[aria-label],[title]');
      if (!el || el.closest('.a11y-panel')) { hide(); return; }
      const text = (el.getAttribute('aria-label') || el.getAttribute('title') || el.getAttribute('alt') || el.getAttribute('placeholder') || el.textContent || '').trim().replace(/\s+/g, ' ');
      if (!text) { hide(); return; }
      tip.textContent = text.length > 160 ? text.slice(0, 157) + '…' : text;
      tip.style.display = 'block';
      const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
      const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
      const top = r.bottom + 8 + t.height > window.innerHeight ? Math.max(8, r.top - t.height - 8) : r.bottom + 8;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    };
    document.addEventListener('mouseover', show);
    document.addEventListener('focusin', show);
    document.addEventListener('mouseout', hide);
    document.addEventListener('focusout', hide);
    return () => {
      document.removeEventListener('mouseover', show); document.removeEventListener('focusin', show);
      document.removeEventListener('mouseout', hide); document.removeEventListener('focusout', hide);
      tip.remove();
    };
  }, [enabled]);
}

const AccessibilityPanel = ({open, onClose, prefs, setPrefs, favs, readableList, canReadAloud, onDeleteAllData}) => {
  const ra = useReadAloud(canReadAloud ? readableList : []);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const closeRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const opener = document.activeElement;
    closeRef.current && closeRef.current.focus();
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('keydown', onKey);
      if (opener && opener.focus && document.contains(opener)) opener.focus();
    };
  }, [open, onClose]);

  useEffect(() => { if (!open) { setConfirmDelete(false); } }, [open]);

  const set = (k, v) => setPrefs(p => ({ ...p, [k]: v }));

  const cycle = ({key, steps}) => setPrefs(p => {
    const i = steps.indexOf(p[key]);            // -1 = off (or an older stored value)
    return { ...p, [key]: i + 1 < steps.length ? steps[i + 1] : tileOff(key) };
  });

  const resetAll = () => setPrefs({ ...DEFAULT_PREFS });

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ preferences: prefs, favorites: favs }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'accessibility-mapper-data.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  if (!open) return null;

  return (
    <div role="dialog" aria-label="Accessibility Menu" className={`a11y-panel${prefs.oversized?' big':''}`}>
      <div className="a11y-head">
        <span>Accessibility Menu (CTRL+U)</span>
        <button ref={closeRef} type="button" className="a11y-close" onClick={onClose} aria-label="Close accessibility menu">
          <XIcon/>
        </button>
      </div>

      <div className="a11y-body">
        <div className="a11y-row">
          <span id="a11y-oversized-label">Oversized Widget</span>
          <button type="button" role="switch" className="a11y-switch" aria-checked={!!prefs.oversized} aria-labelledby="a11y-oversized-label" onClick={()=>set('oversized', !prefs.oversized)}/>
        </div>

        <div className="a11y-grid">
          {A11Y_TILES.map(t => {
            const val = prefs[t.key];
            const i = t.steps.indexOf(val);
            const on = i >= 0;
            const label = (on && LABELS_ON[t.key] && LABELS_ON[t.key][val]) || t.label;
            const icon = (on && ICONS_ON[t.key] && ICONS_ON[t.key][val]) || ICON_OFF_OVERRIDES[t.key] || TILE_ICONS[t.key];
            const tone = on && TONES_ON[t.key] && TONES_ON[t.key][val];
            return (
              <button key={t.key} type="button" className="a11y-tile" aria-pressed={on} style={tone ? {'--tc': tone} : undefined}
                aria-label={t.steps.length > 1 ? `${label}${on ? `, step ${i+1} of ${t.steps.length}` : ', off'}` : label}
                onClick={()=>cycle(t)}>
                {icon}
                <span>{label}</span>
                {on && t.steps.length > 1 && <span className="a11y-steps" aria-hidden="true">{t.steps.map((_, n) => <i key={n} className={n <= i ? 'on' : ''}/>)}</span>}
              </button>
            );
          })}
        </div>

        <button type="button" className="a11y-wide" onClick={resetAll}><ResetIcon/> Reset All Accessibility Settings</button>

        <div className="a11y-more">More settings</div>

        <A11ySection title="Color scheme">
          <div style={{display:'flex',gap:10}}>
            {[['earthy','Cardinal & Teal','#1f6a5e','#b4232a'],['blue','Blue & yellow','#1c5490','#f59e0b']].map(([key,label,c1,c2])=>(
              <button key={key} onClick={()=>set('colorScheme',key)} aria-pressed={prefs.colorScheme===key}
                style={{flex:1,padding:'10px 8px',borderRadius:'var(--r-sm)',border:`2px solid ${prefs.colorScheme===key?'var(--brand)':'var(--border)'}`,background:prefs.colorScheme===key?'var(--brand-subtle)':'var(--surface)',cursor:'pointer',textAlign:'left'}}>
                <div style={{display:'flex',gap:4,marginBottom:6}}>
                  <span style={{width:16,height:16,borderRadius:'50%',background:c1,display:'inline-block'}}/>
                  <span style={{width:16,height:16,borderRadius:'50%',background:c2,display:'inline-block'}}/>
                </div>
                <span style={{fontSize:'var(--fs-xs)',fontWeight:600,color:'var(--text)'}}>{label}</span>
              </button>
            ))}
          </div>
        </A11ySection>

        <A11ySection title="Theme">
          <div style={{display:'flex',gap:6}}>
            <SegButton active={prefs.theme==='system'} onClick={()=>set('theme','system')}>Match device</SegButton>
            <SegButton active={prefs.theme==='light'} onClick={()=>set('theme','light')}>Light</SegButton>
            <SegButton active={prefs.theme==='dark'} onClick={()=>set('theme','dark')}>Dark</SegButton>
          </div>
        </A11ySection>

        <A11ySection title="Reading aloud">
          {!canReadAloud && <p style={{fontSize:'var(--fs-xs)',color:'var(--text-muted)',margin:'0 0 8px'}}>Search for resources first — reading aloud works on the results list.</p>}
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            {ra.status === 'playing'
              ? <SegButton active onClick={ra.pause} disabled={!canReadAloud}>⏸ Pause</SegButton>
              : <SegButton active={ra.status==='paused'} onClick={ra.play} disabled={!canReadAloud || readableList.length===0}>▶ {ra.status==='paused'?'Resume':'Play'}</SegButton>}
            <SegButton onClick={ra.stop} disabled={!canReadAloud || ra.status==='idle'}>⏹ Stop</SegButton>
          </div>
          <div style={{fontSize:'var(--fs-xs)',color:'var(--text-muted)',marginBottom:4}}>Speed</div>
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            <SegButton active={ra.rate===0.8} onClick={()=>ra.setRate(0.8)} disabled={!canReadAloud}>Slower</SegButton>
            <SegButton active={ra.rate===1} onClick={()=>ra.setRate(1)} disabled={!canReadAloud}>Normal</SegButton>
            <SegButton active={ra.rate===1.3} onClick={()=>ra.setRate(1.3)} disabled={!canReadAloud}>Faster</SegButton>
          </div>
          {ra.voices.length > 0 && (
            <select value={ra.voiceURI} onChange={e=>ra.setVoiceURI(e.target.value)} disabled={!canReadAloud}
              style={{width:'100%',height:34,padding:'0 8px',borderRadius:'var(--r-sm)',border:'1px solid var(--border-strong)',background:'var(--surface)',color:'var(--text)',fontSize:'var(--fs-sm)',fontFamily:'var(--font-sans)'}}>
              <option value="">Default voice</option>
              {ra.voices.map(v => <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>)}
            </select>
          )}
        </A11ySection>

        <A11ySection title="Your data">
          <p style={{fontSize:'var(--fs-xs)',color:'var(--text-secondary)',margin:'0 0 10px'}}>
            {favs.length} saved resource{favs.length!==1?'s':''} · preferences and favorites are stored only on this device, never uploaded anywhere.
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <button onClick={exportData} style={{padding:'9px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text)',fontSize:'var(--fs-sm)',fontWeight:600,cursor:'pointer',textAlign:'left'}}>
              ⬇ Export a copy
            </button>
            {!confirmDelete ? (
              <button onClick={()=>setConfirmDelete(true)} style={{padding:'9px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--error)',background:'var(--error-bg)',color:'var(--error-fg)',fontSize:'var(--fs-sm)',fontWeight:600,cursor:'pointer',textAlign:'left'}}>
                🗑 Delete all my data
              </button>
            ) : (
              <div style={{padding:10,borderRadius:'var(--r-sm)',border:'1px solid var(--error)',background:'var(--error-bg)'}}>
                <p style={{fontSize:'var(--fs-xs)',color:'var(--error-fg)',margin:'0 0 8px'}}>This clears saved preferences and favorites on this device. This can’t be undone.</p>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={()=>{onDeleteAllData();setConfirmDelete(false);}} style={{flex:1,padding:'7px 10px',borderRadius:'var(--r-sm)',border:'none',background:'var(--error)',color:'#fff',fontSize:'var(--fs-xs)',fontWeight:700,cursor:'pointer'}}>Confirm delete</button>
                  <button onClick={()=>setConfirmDelete(false)} style={{flex:1,padding:'7px 10px',borderRadius:'var(--r-sm)',border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-secondary)',fontSize:'var(--fs-xs)',cursor:'pointer'}}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </A11ySection>
      </div>
    </div>
  );
};

};

/* Horizontally scrolling row of cards with prev/next buttons (mouse wheel, trackpad swipe, and
   keyboard scrolling all work natively too since the track is a focusable, overflow:auto element). */
const ScrollRow = ({children, label='Project highlights', maxW=1100}) => {
  const gutter = `max(24px, calc((100vw - ${maxW}px) / 2 + 24px))`;
  const trackRef = useRef(null);
  const [edge, setEdge] = useState({start:true, end:false});
  const sync = () => {
    const el = trackRef.current;
    if (!el) return;
    setEdge({start: el.scrollLeft <= 2, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 2});
  };
  useEffect(() => {
    sync();
    window.addEventListener('resize', sync);
    return () => window.removeEventListener('resize', sync);
  }, []);
  const scrollBy = dir => {
    const el = trackRef.current;
    if (!el) return;
    const card = el.querySelector('.scroll-card');
    const step = (card ? card.getBoundingClientRect().width : 260) + 18;
    el.scrollBy({ left: dir * step, behavior: 'smooth' });
  };
  return (
    <div className="bleed-row" style={{position:'relative',width:'100vw',marginLeft:'calc(50% - 50vw)'}}>
      <div ref={trackRef} onScroll={sync} className="carousel-track" style={{paddingLeft:gutter,paddingRight:gutter,scrollPaddingLeft:gutter}} tabIndex={0} role="list" aria-label={label}>
        {children}
      </div>
      <div className="carousel-nav-row" style={{paddingLeft:gutter,paddingRight:gutter}}>
        <button type="button" aria-label="Scroll left" disabled={edge.start} onClick={()=>scrollBy(-1)} className="carousel-nav"><ChevronIcon dir="left"/></button>
        <button type="button" aria-label="Scroll right" disabled={edge.end} onClick={()=>scrollBy(1)} className="carousel-nav"><ChevronIcon dir="right"/></button>
      </div>
    </div>
  );
};

    update();
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    return () => { window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
  }, [items.length, anchorRef]);
  if (!items.length || !rect) return null;
  return ReactDOM.createPortal(
    <div role="listbox" aria-label="Search suggestions" style={{position:'fixed',top:rect.bottom+8,left:rect.left,width:Math.max(rect.width,260),background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--r-md)',boxShadow:'0 8px 28px rgba(0,0,0,.18)',zIndex:9999,overflow:'hidden',textAlign:'left',padding:'6px 0'}}>
      {items.map((t,i) => (
        <div key={t} role="option" aria-selected={i===activeIdx}
          onMouseDown={e=>{e.preventDefault();onPick(t);}}
          onMouseEnter={()=>setActiveIdx(i)}
          style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',cursor:'pointer',fontSize:'var(--fs-md)',color:'var(--text)',
            background: i===activeIdx ? 'var(--brand-subtle)' : 'transparent'}}>
          <span style={{display:'inline-flex',flexShrink:0,width:22,justifyContent:'center'}}><KeywordIcon term={t}/></span>{t}
        </div>
      ))}
    </div>,
    document.body
  );
};
